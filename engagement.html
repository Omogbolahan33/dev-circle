<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Engagement History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <style>
    .topnav { position:sticky;top:0;z-index:100;background:var(--ink);border-bottom:1px solid rgba(160,160,184,0.06);padding:0 var(--sp-6); }
    .topnav-inner { max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px; }
    .topnav-logo { font-family:var(--font-display);font-weight:var(--fw-black);font-size:var(--fs-md);letter-spacing:-0.03em;color:var(--white);text-decoration:none; }
    .topnav-logo span { color:var(--cd-blue); }
    .topnav-links { display:flex;gap:var(--sp-1); }
    .topnav-link { padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:var(--fw-medium);color:var(--ash);cursor:pointer;border:none;background:none;transition:all var(--duration-fast) var(--ease-out);text-decoration:none; }
    .topnav-link:hover { color:var(--white);background:rgba(160,160,184,0.05); }
    .topnav-link.active { color:var(--white);background:var(--cd-blue-dim); }
    .topnav-user { display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm);color:var(--ash);cursor:pointer;padding:var(--sp-1) var(--sp-2);border-radius:var(--r-md);border:none;background:none; }
    .topnav-user:hover { background:rgba(160,160,184,0.05); }
    .topnav-avatar { width:28px;height:28px;border-radius:50%;background:var(--cd-blue-dim);color:var(--cd-blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:var(--fw-bold);font-family:var(--font-display); }

    .page { max-width:720px;margin:0 auto;padding:var(--sp-8) var(--sp-6); }
    .page-header { margin-bottom:var(--sp-8); }
    .page-title { font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-2xl);letter-spacing:-0.03em;margin-bottom:var(--sp-1); }
    .page-subtitle { color:var(--ash);font-size:var(--fs-sm); }

    .stat-strip { display:flex;gap:var(--sp-6);flex-wrap:wrap;padding:var(--sp-4) 0;margin-bottom:var(--sp-6);border-bottom:1px solid rgba(160,160,184,0.06); }
    .stat-item .val { font-family:var(--font-display);font-weight:var(--fw-black);font-size:var(--fs-xl);letter-spacing:-0.03em; }
    .stat-item .label { font-size:var(--fs-xs);color:var(--ash-dim);margin-top:2px; }

    .filter-bar { display:flex;gap:var(--sp-2);margin-bottom:var(--sp-6);flex-wrap:wrap; }
    .filter-btn { padding:var(--sp-1) var(--sp-3);border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:var(--fw-medium);cursor:pointer;border:1px solid rgba(160,160,184,0.08);background:none;color:var(--ash);transition:all var(--duration-fast) var(--ease-out); }
    .filter-btn:hover { border-color:rgba(160,160,184,0.20);color:var(--white); }
    .filter-btn.active { border-color:var(--cd-blue);background:var(--cd-blue-dim);color:var(--cd-blue); }

    .timeline { list-style:none; }
    .timeline-item { display:flex;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid rgba(160,160,184,0.03); }
    .timeline-item:last-child { border-bottom:none; }
    .timeline-dot { width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0; }
    .timeline-dot.survey { background:var(--cd-blue); }
    .timeline-dot.gift { background:var(--emerald); }
    .timeline-dot.feedback { background:var(--cd-gold); }
    .timeline-dot.system { background:var(--ash-dim); }
    .timeline-dot.alert { background:var(--rose); }
    .timeline-body { flex:1; }
    .timeline-head { display:flex;align-items:center;gap:var(--sp-2);margin-bottom:2px; }
    .timeline-type { font-size:10px;font-family:var(--font-mono);padding:2px 6px;border-radius:var(--r-sm);text-transform:uppercase;letter-spacing:0.04em; }
    .timeline-type.survey { color:var(--cd-blue);background:var(--cd-blue-dim); }
    .timeline-type.gift { color:var(--emerald);background:var(--emerald-dim); }
    .timeline-type.feedback { color:var(--cd-gold);background:var(--cd-gold-dim); }
    .timeline-type.system { color:var(--ash);background:rgba(160,160,184,0.06); }
    .timeline-text { font-size:var(--fs-sm); }
    .timeline-detail { font-size:var(--fs-xs);color:var(--ash);margin-top:2px; }
    .timeline-time { font-size:var(--fs-xs);color:var(--ash-dim);font-family:var(--font-mono);margin-top:2px; }
    .timeline-source { font-size:10px;color:var(--ash-dim); }

    .section { margin-bottom:var(--sp-10); }
    .section-title { font-family:var(--font-display);font-weight:var(--fw-semibold);font-size:var(--fs-md);letter-spacing:-0.01em;margin-bottom:var(--sp-4); }

    .empty { text-align:center;padding:var(--sp-8);color:var(--ash-dim);font-size:var(--fs-sm); }

    @media (max-width:640px) { .page{padding:var(--sp-6) var(--sp-4);} .page-title{font-size:var(--fs-xl);} .stat-strip{gap:var(--sp-4);} }
  </style>
</head>
<body>

  <nav class="topnav">
    <div class="topnav-inner">
      <a href="developer-dashboard.html" class="topnav-logo">dev<span>.</span>circle</a>
      <div class="topnav-links">
        <a href="developer-dashboard.html" class="topnav-link">Home</a>
        <a href="developer-dashboard.html" class="topnav-link" onclick="localStorage.setItem('devcircle_view','surveys')">Surveys</a>
        <a href="profile.html" class="topnav-link">Profile</a>
        <a href="gifts-dev.html" class="topnav-link">Gifts</a>
        <a href="engagement.html" class="topnav-link active">History</a>
      </div>
      <button class="topnav-user" onclick="Auth.logout()">
        <div class="topnav-avatar" id="navAvatar">—</div>
      </button>
    </div>
  </nav>

  <div class="page">
    <header class="page-header">
      <h1 class="page-title">Engagement history</h1>
      <p class="page-subtitle">Your complete activity log with Credit Direct Dev Circle.</p>
    </header>

    <div class="stat-strip" id="statStrip"></div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="filterEvents('all',this)">All</button>
      <button class="filter-btn" data-filter="survey" onclick="filterEvents('survey',this)">Surveys</button>
      <button class="filter-btn" data-filter="gift" onclick="filterEvents('gift',this)">Gifts</button>
      <button class="filter-btn" data-filter="feedback" onclick="filterEvents('feedback',this)">Feedback</button>
      <button class="filter-btn" data-filter="system" onclick="filterEvents('system',this)">System</button>
    </div>

    <section class="section">
      <ul class="timeline" id="timeline"></ul>
    </section>
  </div>

<script src="auth.js"></script>
<script>
  if (!Auth.requireAuth(false)) throw new Error('Redirecting');

  let allEvents = [];
  let currentFilter = 'all';

  const typeLabels = {
    survey_completed: { dot: 'survey', cat: 'survey', text: 'Completed survey', icon: '📋' },
    survey_started: { dot: 'survey', cat: 'survey', text: 'Started survey', icon: '📋' },
    survey_invited: { dot: 'system', cat: 'system', text: 'Invited to survey', icon: '📨' },
    gift_claimed: { dot: 'gift', cat: 'gift', text: 'Claimed gift', icon: '🎁' },
    gift_delivered: { dot: 'gift', cat: 'gift', text: 'Gift delivered', icon: '✅' },
    feedback_submitted: { dot: 'feedback', cat: 'feedback', text: 'Submitted feedback', icon: '💬' },
    complaint_received: { dot: 'alert', cat: 'feedback', text: 'Complaint logged', icon: '⚠️' },
    account_created: { dot: 'system', cat: 'system', text: 'Joined Dev Circle', icon: '🎉' },
    api_key_generated: { dot: 'system', cat: 'system', text: 'Generated API keys', icon: '🔑' },
    first_sandbox_call: { dot: 'system', cat: 'system', text: 'First sandbox API call', icon: '🧪' },
    first_production_call: { dot: 'survey', cat: 'system', text: 'First production API call', icon: '🚀' },
    kyb_completed: { dot: 'system', cat: 'system', text: 'KYB verification completed', icon: '✅' },
    product_requested: { dot: 'system', cat: 'system', text: 'Requested API product', icon: '📦' }
  };

  async function load() {
    try {
      const [profile, engagement] = await Promise.all([
        api.get('/users/profile'),
        api.get('/users/engagement?limit=100')
      ]);

      const user = profile.user;
      const stats = profile.stats;
      allEvents = engagement.history;

      document.getElementById('navAvatar').textContent = user.name.split(' ').map(n => n[0]).join('').toUpperCase();

      document.getElementById('statStrip').innerHTML = `
        <div class="stat-item"><div class="val">${stats.surveys_completed}</div><div class="label">Surveys</div></div>
        <div class="stat-item"><div class="val">${stats.gifts_claimed}</div><div class="label">Gifts</div></div>
        <div class="stat-item"><div class="val">${stats.feedback_submitted}</div><div class="label">Feedback</div></div>
        <div class="stat-item"><div class="val">${stats.streak}</div><div class="label">Current streak</div></div>
        <div class="stat-item"><div class="val">${stats.best_streak}</div><div class="label">Best streak</div></div>
      `;

      renderTimeline();
    } catch (err) {
      showToast('Failed to load: ' + err.message, 'error');
    }
  }

  function filterEvents(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTimeline();
  }

  function renderTimeline() {
    let filtered = allEvents;
    if (currentFilter !== 'all') {
      filtered = allEvents.filter(e => {
        const info = typeLabels[e.type] || { cat: 'system' };
        return info.cat === currentFilter;
      });
    }

    const container = document.getElementById('timeline');
    container.innerHTML = filtered.length ? filtered.map(e => {
      const info = typeLabels[e.type] || { dot: 'system', cat: 'system', text: e.type, icon: '📌' };
      let detail = '';
      try {
        const meta = JSON.parse(e.metadata || '{}');
        if (meta.survey_title) detail = meta.survey_title;
        if (meta.gift) detail = meta.gift;
        if (meta.category) detail = meta.category;
        if (meta.channel) detail = `via ${meta.channel}`;
      } catch {}

      return `
        <li class="timeline-item">
          <div class="timeline-dot ${info.dot}"></div>
          <div class="timeline-body">
            <div class="timeline-head">
              <span class="timeline-type ${info.cat}">${info.icon} ${info.cat}</span>
              <span class="timeline-source">${e.source}</span>
            </div>
            <div class="timeline-text">${info.text}</div>
            ${detail ? `<div class="timeline-detail">${escapeHtml(detail)}</div>` : ''}
            <div class="timeline-time">${formatDate(e.created_at)}</div>
          </div>
        </li>`;
    }).join('') : '<li class="empty">No events found for this filter.</li>';
  }

  load();
</script>
</body>
</html>
