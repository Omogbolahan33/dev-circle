<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Cohort</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <style>
    .topnav { position:sticky;top:0;z-index:100;background:var(--ink);border-bottom:1px solid rgba(160,160,184,0.06);padding:0 var(--sp-6); }
    .topnav-inner { max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px; }
    .topnav-logo { font-family:var(--font-display);font-weight:var(--fw-black);font-size:var(--fs-md);letter-spacing:-0.03em;color:var(--white);text-decoration:none; }
    .topnav-logo span { color:var(--cd-blue); }
    .topnav-logo .badge { font-family:var(--font-mono);font-size:10px;color:var(--cd-blue);background:var(--cd-blue-dim);padding:2px 6px;border-radius:var(--r-sm);margin-left:var(--sp-2); }
    .topnav-back { font-size:var(--fs-sm);color:var(--ash);text-decoration:none; }
    .topnav-back:hover { color:var(--white); }

    .page { max-width:960px;margin:0 auto;padding:var(--sp-8) var(--sp-6); }

    .cohort-header { display:flex;align-items:flex-start;gap:var(--sp-4);margin-bottom:var(--sp-6); }
    .cohort-color-dot { width:16px;height:16px;border-radius:50%;margin-top:6px;flex-shrink:0; }
    .cohort-name { font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-2xl);letter-spacing:-0.03em;margin-bottom:var(--sp-1); }
    .cohort-desc { color:var(--ash);font-size:var(--fs-sm);margin-bottom:var(--sp-2); }
    .cohort-meta { font-size:var(--fs-xs);font-family:var(--font-mono);color:var(--ash-dim); }

    .actions-row { display:flex;gap:var(--sp-2);margin-bottom:var(--sp-6);flex-wrap:wrap; }

    .stat-strip { display:flex;gap:var(--sp-6);flex-wrap:wrap;padding:var(--sp-4) 0;margin-bottom:var(--sp-6);border-bottom:1px solid rgba(160,160,184,0.06); }
    .stat-item .val { font-family:var(--font-display);font-weight:var(--fw-black);font-size:var(--fs-xl);letter-spacing:-0.03em; }
    .stat-item .label { font-size:var(--fs-xs);color:var(--ash-dim);margin-top:2px; }

    .section { margin-bottom:var(--sp-8); }
    .section-title { font-family:var(--font-display);font-weight:var(--fw-semibold);font-size:var(--fs-md);letter-spacing:-0.01em;margin-bottom:var(--sp-4); }

    .data-table { width:100%;border-collapse:collapse;font-size:var(--fs-sm); }
    .data-table th { text-align:left;font-family:var(--font-display);font-weight:var(--fw-semibold);font-size:11px;color:var(--ash-dim);text-transform:uppercase;letter-spacing:0.08em;padding:var(--sp-2) var(--sp-3);border-bottom:1px solid rgba(160,160,184,0.06); }
    .data-table td { padding:var(--sp-3);border-bottom:1px solid rgba(160,160,184,0.03);vertical-align:middle; }
    .data-table tr:hover td { background:rgba(160,160,184,0.02); }
    .user-cell { display:flex;align-items:center;gap:var(--sp-3); }
    .user-cell-avatar { width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:var(--fw-bold);flex-shrink:0; }
    .user-cell-name { font-weight:var(--fw-medium); }
    .user-cell-email { font-size:var(--fs-xs);color:var(--ash-dim); }
    .mono-sm { font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ash); }

    .search-bar { display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4); }
    .search-input { flex:1;background:var(--slate);border:1px solid rgba(160,160,184,0.08);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm);color:var(--white); }
    .search-input::placeholder { color:var(--ash-dim); }
    .search-input:focus { border-color:var(--cd-blue);outline:none; }

    .pagination { display:flex;align-items:center;justify-content:space-between;padding:var(--sp-3) 0;font-size:var(--fs-xs);color:var(--ash-dim); }
    .pagination-btns { display:flex;gap:var(--sp-1); }

    .btn { display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);font-family:var(--font-body);font-size:var(--fs-sm);font-weight:var(--fw-medium);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-md);transition:all var(--duration-fast) var(--ease-out);white-space:nowrap;cursor:pointer;border:none; }
    .btn-primary { background:var(--cd-blue);color:var(--white); }
    .btn-primary:hover { background:var(--cd-blue-deep); }
    .btn-secondary { background:none;color:var(--ash);border:1px solid rgba(160,160,184,0.10); }
    .btn-secondary:hover { color:var(--white);border-color:rgba(160,160,184,0.25); }
    .btn-ghost { background:none;color:var(--ash);border:none; }
    .btn-ghost:hover { color:var(--white); }
    .btn-sm { font-size:var(--fs-xs);padding:var(--sp-1) var(--sp-3); }
    .btn-danger { background:none;color:var(--rose);border:1px solid rgba(225,29,72,0.20); }
    .btn-danger:hover { background:var(--rose-dim); }

    .modal-overlay { display:none;position:fixed;inset:0;z-index:999;background:rgba(26,26,46,0.85);align-items:center;justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:var(--slate);border-radius:var(--r-lg);padding:var(--sp-6);max-width:400px;width:90%; }
    .modal-title { font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-lg);margin-bottom:var(--sp-4); }
    .form-group { margin-bottom:var(--sp-4); }
    .form-label { display:block;font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--ash);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:var(--sp-1); }
    .form-input { width:100%;background:var(--ink);border:1px solid rgba(160,160,184,0.10);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);color:var(--white);font-size:var(--fs-sm); }
    .form-input:focus { border-color:var(--cd-blue);outline:none; }

    .empty { text-align:center;padding:var(--sp-6);color:var(--ash-dim);font-size:var(--fs-sm); }

    @media (max-width:768px) { .page{padding:var(--sp-6) var(--sp-4);} .cohort-name{font-size:var(--fs-xl);} .stat-strip{gap:var(--sp-4);} }
  </style>
</head>
<body>

  <nav class="topnav">
    <div class="topnav-inner">
      <a href="admin-dashboard.html" class="topnav-logo">dev<span>.</span>circle <span class="badge">Admin</span></a>
      <a href="admin-dashboard.html" class="topnav-back">← Back</a>
    </div>
  </nav>

  <div class="page" id="cohortPage">
    <div style="text-align:center;padding:var(--sp-16);color:var(--ash)">Loading…</div>
  </div>

  <div class="modal-overlay" id="addMemberModal">
    <div class="modal-box">
      <h3 class="modal-title">Add member to cohort</h3>
      <div class="form-group">
        <label class="form-label">Search by email</label>
        <input type="text" class="form-input" id="addMemberEmail" placeholder="developer@company.ng">
      </div>
      <div id="addMemberResults" style="font-size:var(--fs-sm);margin-bottom:var(--sp-4)"></div>
      <div style="display:flex;gap:var(--sp-3);justify-content:flex-end">
        <button class="btn btn-secondary" onclick="closeModal('addMemberModal')">Cancel</button>
        <button class="btn btn-primary" onclick="addMemberByEmail()">Add</button>
      </div>
    </div>
  </div>

<script src="auth.js"></script>
<script>
  if (!Auth.requireAuth(true)) throw new Error('Redirecting');

  let cohortId = null;

  async function load() {
    const params = new URLSearchParams(window.location.search);
    cohortId = params.get('id');
    if (!cohortId) { window.location.href = 'admin-dashboard.html'; return; }

    try {
      // Get cohort info from cohorts list
      const cohortsData = await api.get('/admin/cohorts');
      const cohort = cohortsData.cohorts.find(c => c.id === cohortId);
      if (!cohort) { document.getElementById('cohortPage').innerHTML = '<div class="empty">Cohort not found</div>'; return; }

      // Get members in this cohort
      const membersData = await api.get(`/admin/members?cohort_id=${cohortId}&limit=100`);

      renderCohort(cohort, membersData);
    } catch (err) {
      document.getElementById('cohortPage').innerHTML = `<div style="text-align:center;padding:var(--sp-16);color:var(--rose)">${err.message}</div>`;
    }
  }

  function renderCohort(cohort, membersData) {
    const { members, pagination } = membersData;

    document.getElementById('cohortPage').innerHTML = `
      <div class="cohort-header">
        <div class="cohort-color-dot" style="background:${cohort.color}"></div>
        <div>
          <div class="cohort-name">${escapeHtml(cohort.name)}</div>
          <div class="cohort-desc">${escapeHtml(cohort.description || 'No description')}</div>
          <div class="cohort-meta">${cohort.type} · ${cohort.member_count} members · Created ${formatDate(cohort.created_at)}</div>
        </div>
      </div>

      <div class="actions-row">
        <button class="btn btn-sm btn-secondary" onclick="showAddMemberModal()">+ Add member</button>
        <button class="btn btn-sm btn-secondary" onclick="exportCohort()">↓ Export CSV</button>
        <button class="btn btn-sm btn-primary" onclick="blastCohort()">✦ Message blast</button>
        ${cohort.type !== 'system' ? '<button class="btn btn-sm btn-danger" onclick="deleteCohort()">Delete cohort</button>' : ''}
      </div>

      <div class="stat-strip">
        <div class="stat-item"><div class="val">${cohort.member_count}</div><div class="label">Members</div></div>
        <div class="stat-item"><div class="val">${members.filter(m => m.api_status === 'production').length}</div><div class="label">Production</div></div>
        <div class="stat-item"><div class="val">${members.filter(m => m.kyb_completed).length}</div><div class="label">KYB done</div></div>
      </div>

      <section class="section">
        <div class="search-bar">
          <input type="search" class="search-input" id="memberSearch" placeholder="Search within cohort…" oninput="debounceSearch()">
        </div>
        <table class="data-table">
          <thead><tr><th>Member</th><th>Status</th><th>Surveys</th><th>Streak</th><th>Last active</th><th></th></tr></thead>
          <tbody id="membersBody">
            ${members.map(m => {
              const initials = m.name.split(' ').map(n => n[0]).join('').toUpperCase();
              const statusColor = m.api_status === 'production' ? 'var(--teal)' : 'var(--cd-gold)';
              return `<tr>
                <td><div class="user-cell"><div class="user-cell-avatar" style="background:${statusColor}18;color:${statusColor}">${initials}</div><div><div class="user-cell-name">${escapeHtml(m.name)}</div><div class="user-cell-email">${escapeHtml(m.email)}</div></div></div></td>
                <td><span class="state-label state-${m.api_status}">● ${m.api_status}</span></td>
                <td class="mono-sm">${m.surveys_completed}/${m.surveys_invited}</td>
                <td class="mono-sm">${m.engagement_streak}</td>
                <td class="mono-sm">${formatDate(m.last_active_at)}</td>
                <td><button class="btn btn-sm btn-ghost" onclick="removeMember('${m.id}','${escapeHtml(m.name)}')">Remove</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <div class="pagination">
          <span>${pagination.total} members</span>
        </div>
      </section>
    `;
  }

  let searchTimeout;
  function debounceSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(searchMembers, 300); }
  async function searchMembers() {
    const search = document.getElementById('memberSearch').value;
    const data = await api.get(`/admin/members?cohort_id=${cohortId}&limit=100${search ? '&search=' + encodeURIComponent(search) : ''}`);
    // Re-render just the table body
    const tbody = document.getElementById('membersBody');
    tbody.innerHTML = data.members.map(m => {
      const initials = m.name.split(' ').map(n => n[0]).join('').toUpperCase();
      const statusColor = m.api_status === 'production' ? 'var(--teal)' : 'var(--cd-gold)';
      return `<tr>
        <td><div class="user-cell"><div class="user-cell-avatar" style="background:${statusColor}18;color:${statusColor}">${initials}</div><div><div class="user-cell-name">${escapeHtml(m.name)}</div><div class="user-cell-email">${escapeHtml(m.email)}</div></div></div></td>
        <td><span class="state-label state-${m.api_status}">● ${m.api_status}</span></td>
        <td class="mono-sm">${m.surveys_completed}/${m.surveys_invited}</td>
        <td class="mono-sm">${m.engagement_streak}</td>
        <td class="mono-sm">${formatDate(m.last_active_at)}</td>
        <td><button class="btn btn-sm btn-ghost" onclick="removeMember('${m.id}','${escapeHtml(m.name)}')">Remove</button></td>
      </tr>`;
    }).join('');
  }

  function showAddMemberModal() { document.getElementById('addMemberModal').classList.add('open'); document.getElementById('addMemberEmail').focus(); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  async function addMemberByEmail() {
    const email = document.getElementById('addMemberEmail').value.trim();
    if (!email) { showToast('Enter an email', 'warning'); return; }
    try {
      // Find user by search
      const search = await api.get(`/admin/members?search=${encodeURIComponent(email)}&limit=1`);
      if (!search.members.length) { showToast('User not found', 'error'); return; }
      const user = search.members[0];

      await api.post(`/admin/cohorts/${cohortId}/members`, { user_ids: [user.id] });
      closeModal('addMemberModal');
      document.getElementById('addMemberEmail').value = '';
      showToast(`${user.name} added to cohort`);
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function removeMember(userId, name) {
    if (!confirm(`Remove ${name} from this cohort?`)) return;
    try {
      await api.del(`/admin/cohorts/${cohortId}/members/${userId}`);
      showToast(`${name} removed`);
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function deleteCohort() {
    if (!confirm('Delete this cohort? Members will not be deleted.')) return;
    try {
      await api.del(`/admin/cohorts/${cohortId}`);
      showToast('Cohort deleted');
      window.location.href = 'admin-dashboard.html';
    } catch (err) { showToast(err.message, 'error'); }
  }

  function blastCohort() {
    // Redirect to admin dashboard with blast modal pre-filled
    localStorage.setItem('blast_cohort_id', cohortId);
    window.location.href = 'admin-dashboard.html';
  }

  async function exportCohort() {
    try {
      const res = await fetch(`${API_BASE}/admin/export?format=csv&cohort_id=${cohortId}`, { headers: Auth.headers() });
      const blob = await res.blob();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cohort-export.csv'; a.click();
      showToast('Exported');
    } catch { showToast('Export failed', 'error'); }
  }

  document.querySelectorAll('.modal-overlay').forEach(m => { m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }); });

  load();
</script>
</body>
</html>
