<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — New Survey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <style>
    .topnav { position:sticky;top:0;z-index:100;background:var(--ink);border-bottom:1px solid rgba(160,160,184,0.06);padding:0 var(--sp-6); }
    .topnav-inner { max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px; }
    .topnav-logo { font-family:var(--font-display);font-weight:var(--fw-black);font-size:var(--fs-md);letter-spacing:-0.03em;color:var(--white);text-decoration:none; }
    .topnav-logo span { color:var(--cd-blue); }
    .topnav-logo .badge { font-family:var(--font-mono);font-size:10px;color:var(--cd-blue);background:var(--cd-blue-dim);padding:2px 6px;border-radius:var(--r-sm);margin-left:var(--sp-2); }
    .topnav-back { font-size:var(--fs-sm);color:var(--ash);text-decoration:none; }
    .topnav-back:hover { color:var(--white); }

    .page { max-width:720px;margin:0 auto;padding:var(--sp-8) var(--sp-6); }
    .page-header { margin-bottom:var(--sp-8); }
    .page-title { font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-2xl);letter-spacing:-0.03em;margin-bottom:var(--sp-1); }
    .page-subtitle { color:var(--ash);font-size:var(--fs-sm); }

    .section { margin-bottom:var(--sp-8); }
    .section-title { font-family:var(--font-display);font-weight:var(--fw-semibold);font-size:var(--fs-md);letter-spacing:-0.01em;margin-bottom:var(--sp-4); }

    .form-group { margin-bottom:var(--sp-4); }
    .form-label { display:block;font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--ash);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:var(--sp-1); }
    .form-input { width:100%;background:var(--slate);border:1px solid rgba(160,160,184,0.08);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);color:var(--white);font-size:var(--fs-sm);transition:border-color var(--duration-fast) var(--ease-out); }
    .form-input::placeholder { color:var(--ash-dim); }
    .form-input:focus { border-color:var(--cd-blue);outline:none; }
    select.form-input { cursor:pointer; }
    textarea.form-input { min-height:60px;font-family:var(--font-body);resize:vertical; }
    .form-row { display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4); }

    .question-card {
      background:var(--slate);border:1px solid rgba(160,160,184,0.06);border-radius:var(--r-lg);
      padding:var(--sp-4);margin-bottom:var(--sp-3);position:relative;
    }
    .question-card .q-num { font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--cd-blue);margin-bottom:var(--sp-2); }
    .question-card .q-remove { position:absolute;top:var(--sp-3);right:var(--sp-3);background:none;border:none;color:var(--ash-dim);cursor:pointer;font-size:var(--fs-md); }
    .question-card .q-remove:hover { color:var(--rose); }

    .options-list { margin-top:var(--sp-2); }
    .option-row { display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-1); }
    .option-row input { flex:1;background:var(--ink);border:1px solid rgba(160,160,184,0.08);border-radius:var(--r-md);padding:var(--sp-1) var(--sp-2);color:var(--white);font-size:var(--fs-xs); }
    .option-row input:focus { border-color:var(--cd-blue);outline:none; }
    .option-row button { background:none;border:none;color:var(--ash-dim);cursor:pointer;font-size:var(--fs-sm); }
    .option-row button:hover { color:var(--rose); }

    .btn { display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);font-family:var(--font-body);font-size:var(--fs-sm);font-weight:var(--fw-medium);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-md);transition:all var(--duration-fast) var(--ease-out);white-space:nowrap;cursor:pointer;border:none; }
    .btn-primary { background:var(--cd-blue);color:var(--white); }
    .btn-primary:hover { background:var(--cd-blue-deep); }
    .btn-secondary { background:none;color:var(--ash);border:1px solid rgba(160,160,184,0.10); }
    .btn-secondary:hover { color:var(--white);border-color:rgba(160,160,184,0.25); }
    .btn-ghost { background:none;color:var(--ash);border:none; }
    .btn-ghost:hover { color:var(--white); }
    .btn-sm { font-size:var(--fs-xs);padding:var(--sp-1) var(--sp-3); }
    .btn-gold { background:var(--cd-gold);color:var(--ink);font-weight:var(--fw-semibold); }
    .btn-gold:hover { background:var(--cd-gold-deep); }

    .save-bar { display:flex;gap:var(--sp-3);padding-top:var(--sp-4);border-top:1px solid rgba(160,160,184,0.06);margin-top:var(--sp-4); }

    @media (max-width:640px) {
      .page { padding:var(--sp-6) var(--sp-4); }
      .page-title { font-size:var(--fs-xl); }
      .form-row { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <nav class="topnav">
    <div class="topnav-inner">
      <a href="admin-dashboard.html" class="topnav-logo">dev<span>.</span>circle <span class="badge">Admin</span></a>
      <a href="admin-dashboard.html" class="topnav-back">← Back</a>
    </div>
  </nav>

  <div class="page">
    <header class="page-header">
      <h1 class="page-title">Create survey</h1>
      <p class="page-subtitle">Design a survey to send to developers. Add questions below.</p>
    </header>

    <section class="section">
      <h2 class="section-title">Details</h2>
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" class="form-input" id="sTitle" placeholder="e.g. API Documentation Feedback">
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-input" id="sDesc" placeholder="Brief description for respondents"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Target</label>
          <select class="form-input" id="sTarget" onchange="toggleCohortTarget()">
            <option value="all">All members</option>
            <option value="cohort">Specific cohort</option>
          </select>
        </div>
        <div class="form-group" id="cohortTargetGroup" style="display:none">
          <label class="form-label">Cohort</label>
          <select class="form-input" id="sCohortId"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Channel</label>
          <select class="form-input" id="sChannel">
            <option value="in_portal">In-Portal</option>
            <option value="email">Email</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="1-on-1">1-on-1</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Time estimate (minutes)</label>
        <input type="number" class="form-input" id="sTime" value="5" min="1" max="30" style="width:100px">
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Questions</h2>
      <div id="questionsContainer"></div>
      <div style="display:flex;gap:var(--sp-2);margin-top:var(--sp-3)">
        <button class="btn btn-sm btn-secondary" onclick="addQuestion('rating')">+ Rating</button>
        <button class="btn btn-sm btn-secondary" onclick="addQuestion('choice')">+ Choice</button>
        <button class="btn btn-sm btn-secondary" onclick="addQuestion('text')">+ Text</button>
      </div>
    </section>

    <div class="save-bar">
      <button class="btn btn-primary" onclick="createSurvey('draft')">Save as draft</button>
      <button class="btn btn-gold" onclick="createSurvey('active')">Publish</button>
      <a href="admin-dashboard.html" class="btn btn-secondary">Cancel</a>
    </div>
  </div>

<script src="auth.js"></script>
<script>
  if (!Auth.requireAuth(true)) throw new Error('Redirecting');

  let questionCount = 0;

  function toggleCohortTarget() {
    document.getElementById('cohortTargetGroup').style.display = document.getElementById('sTarget').value === 'cohort' ? 'block' : 'none';
  }

  async function loadCohorts() {
    try {
      const data = await api.get('/admin/cohorts');
      document.getElementById('sCohortId').innerHTML = data.cohorts.map(c => `<option value="${c.id}">${escapeHtml(c.name)} (${c.member_count})</option>`).join('');
    } catch {}
  }

  function addQuestion(type) {
    questionCount++;
    const container = document.getElementById('questionsContainer');
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-${questionCount}`;

    let body = '';
    if (type === 'rating') {
      body = `
        <div class="form-group">
          <label class="form-label">Question text</label>
          <input type="text" class="form-input q-text" placeholder="e.g. How clear is the documentation?">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Scale</label>
            <select class="form-input q-scale"><option value="5">1–5</option><option value="7">1–7</option><option value="10">1–10</option></select>
          </div>
          <div class="form-group">
            <label class="form-label">Low label</label>
            <input type="text" class="form-input q-label-low" placeholder="e.g. Unclear">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">High label</label>
          <input type="text" class="form-input q-label-high" placeholder="e.g. Very clear">
        </div>`;
    } else if (type === 'choice') {
      body = `
        <div class="form-group">
          <label class="form-label">Question text</label>
          <input type="text" class="form-input q-text" placeholder="e.g. What brought you here?">
        </div>
        <div class="form-group">
          <label class="form-label">Options</label>
          <div class="options-list">
            <div class="option-row"><input type="text" placeholder="Option 1"><button onclick="this.parentElement.remove()">×</button></div>
            <div class="option-row"><input type="text" placeholder="Option 2"><button onclick="this.parentElement.remove()">×</button></div>
          </div>
          <button class="btn btn-sm btn-ghost" onclick="addOption(this)" style="margin-top:var(--sp-1)">+ Add option</button>
        </div>`;
    } else if (type === 'text') {
      body = `
        <div class="form-group">
          <label class="form-label">Question text</label>
          <input type="text" class="form-input q-text" placeholder="e.g. Any additional feedback?">
        </div>
        <div class="form-group">
          <label class="form-label"><input type="checkbox" class="q-optional" style="margin-right:var(--sp-1)"> Optional</label>
        </div>`;
    }

    card.innerHTML = `
      <div class="q-num">Q${questionCount} · ${type}</div>
      <button class="q-remove" onclick="this.parentElement.remove()">×</button>
      <input type="hidden" class="q-type" value="${type}">
      ${body}
    `;

    container.appendChild(card);
  }

  function addOption(btn) {
    const list = btn.previousElementSibling;
    const row = document.createElement('div');
    row.className = 'option-row';
    const count = list.children.length + 1;
    row.innerHTML = `<input type="text" placeholder="Option ${count}"><button onclick="this.parentElement.remove()">×</button>`;
    list.appendChild(row);
  }

  function getQuestions() {
    return Array.from(document.querySelectorAll('.question-card')).map((card, i) => {
      const type = card.querySelector('.q-type').value;
      const text = card.querySelector('.q-text').value.trim();
      const q = { id: `q${i + 1}`, type, text };

      if (type === 'rating') {
        q.scale = parseInt(card.querySelector('.q-scale').value);
        const low = card.querySelector('.q-label-low').value;
        const high = card.querySelector('.q-label-high').value;
        if (low || high) q.labels = [low, '', '', '', high];
      } else if (type === 'choice') {
        q.options = Array.from(card.querySelectorAll('.option-row input')).map(inp => inp.value.trim()).filter(Boolean);
      } else if (type === 'text') {
        q.optional = card.querySelector('.q-optional').checked;
      }

      return q;
    });
  }

  async function createSurvey(status) {
    const title = document.getElementById('sTitle').value.trim();
    if (!title) { showToast('Title required', 'warning'); return; }

    const questions = getQuestions();
    if (!questions.length) { showToast('Add at least one question', 'warning'); return; }
    if (questions.some(q => !q.text)) { showToast('All questions need text', 'warning'); return; }
    if (questions.some(q => q.type === 'choice' && (!q.options || q.options.length < 2))) { showToast('Choice questions need at least 2 options', 'warning'); return; }

    const targetType = document.getElementById('sTarget').value;
    const body = {
      title,
      description: document.getElementById('sDesc').value.trim(),
      questions,
      target_type: targetType,
      target_ids: targetType === 'cohort' ? [document.getElementById('sCohortId').value] : [],
      engagement_mode: document.getElementById('sChannel').value,
      time_estimate_min: parseInt(document.getElementById('sTime').value) || 5,
      status
    };

    try {
      await api.post('/admin/surveys', body);
      showToast(`Survey ${status === 'active' ? 'published' : 'saved as draft'}`);
      setTimeout(() => window.location.href = 'admin-dashboard.html', 1000);
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  loadCohorts();
</script>
</body>
</html>
