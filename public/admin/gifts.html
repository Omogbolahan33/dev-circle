<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Rewards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">Rewards</h1>
          <p class="page-subtitle">What developers can claim for taking part. Recognition should feel earned and specific, so keep the catalogue small and the value real.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-sm btn-primary" onclick="openCreate()">New reward</button>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-status="">All</button>
        <button class="tab" data-status="available">Available</button>
        <button class="tab" data-status="claimed">Claimed</button>
        <button class="tab" data-status="delivered">Delivered</button>
      </nav>
    </header>

    <div class="app-body">
      <div class="table-shell">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Reward</th>
                <th>Value</th>
                <th>State</th>
                <th class="hide-sm">Audience</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<aside class="drawer" id="giftDrawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">New reward</div>
      <div class="drawer-sub">Members claim these from their Rewards page</div>
    </div>
    <button class="icon-btn" onclick="Shell.closeDrawer('giftDrawer')">×</button>
  </div>
  <div class="drawer-body">
    <div class="field">
      <label class="label">Name</label>
      <input type="text" class="input" id="gName" placeholder="e.g. ₦5,000 airtime credit">
    </div>
    <div class="field">
      <label class="label">Description</label>
      <textarea class="input" id="gDesc" placeholder="What it is, and anything the member should know."></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="label">Value</label>
        <input type="number" class="input" id="gValue" placeholder="5000">
      </div>
      <div class="field">
        <label class="label">Currency</label>
        <select class="input" id="gCurrency">
          <option value="NGN">NGN</option>
          <option value="USD">USD</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label class="label">Limit to cohorts</label>
      <select class="input" id="gCohorts" multiple size="5"></select>
      <p class="hint">Leave nothing selected to offer this to every member.</p>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn btn-secondary" onclick="Shell.closeDrawer('giftDrawer')">Cancel</button>
    <button class="btn btn-primary" onclick="createGift()">Create reward</button>
  </div>
</aside>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/survey-theme.js"></script>
<script src="/assets/js/brand.js"></script>
<script>
  Shell.admin('gifts');

  let gifts = [];
  let cohorts = [];
  let statusFilter = '';

  async function load() {
    document.getElementById('rows').innerHTML = skeletonRows(4, 5);
    try {
      const [giftData, cohortData] = await Promise.all([
        api.get('/admin/gifts'),
        api.get('/admin/cohorts').catch(() => ({ cohorts: [] }))
      ]);
      gifts = giftData.gifts;
      cohorts = cohortData.cohorts;

      document.getElementById('gCohorts').innerHTML = cohorts
        .map(c => `<option value="${c.id}">${escapeHtml(c.name)} (${c.member_count})</option>`).join('');

      render();
    } catch (err) {
      document.getElementById('rows').innerHTML =
        `<tr><td colspan="5">${emptyState({ title: 'Could not load rewards', text: err.message })}</td></tr>`;
    }
  }

  function render() {
    const list = gifts.filter(g => !statusFilter || g.status === statusFilter);
    const tbody = document.getElementById('rows');

    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="5">${emptyState({
        title: statusFilter ? `Nothing ${statusFilter}` : 'No rewards yet',
        text: 'Create something worth claiming — airtime, credits, hardware — and members who engage can claim it.',
        action: '<button class="btn btn-sm btn-primary" onclick="openCreate()">Create a reward</button>'
      })}</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(g => {
      const targets = (g.target_cohort_ids || [])
        .map(id => cohorts.find(c => c.id === id))
        .filter(Boolean);

      return `
        <tr>
          <td>
            <div class="identity-meta">
              <div class="identity-name">${escapeHtml(g.name)}</div>
              <div class="identity-sub">${escapeHtml(g.description || 'No description')}</div>
            </div>
          </td>
          <td class="mono tnum nowrap">${money(g.value, g.currency)}</td>
          <td>${badge(g.status, g.status === 'available' ? 'active' : g.status === 'claimed' ? 'warn' : 'inactive')}</td>
          <td class="hide-sm">
            ${targets.length
              ? targets.map(c => `<span class="tag" style="background:${c.color}1F;color:${c.color}">${escapeHtml(c.name)}</span>`).join(' ')
              : '<span class="dim text-xs">Everyone</span>'}
          </td>
          <td class="col-actions">
            <div class="row-actions">
              ${g.status === 'claimed' ? `<button class="btn btn-sm btn-ghost" onclick="markDelivered('${g.id}')">Mark delivered</button>` : ''}
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  function openCreate() {
    ['gName', 'gDesc', 'gValue'].forEach(id => { document.getElementById(id).value = ''; });
    Shell.openDrawer('giftDrawer');
  }

  async function createGift() {
    const name = document.getElementById('gName').value.trim();
    if (!name) { showToast('Name required', 'warning'); return; }

    const targets = Array.from(document.getElementById('gCohorts').selectedOptions).map(o => o.value);

    try {
      await api.post('/admin/gifts', {
        name,
        description: document.getElementById('gDesc').value.trim(),
        value: parseFloat(document.getElementById('gValue').value) || 0,
        currency: document.getElementById('gCurrency').value,
        target_cohort_ids: targets
      });
      Shell.closeDrawer('giftDrawer');
      showToast(`"${name}" created`);
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  async function markDelivered(id) {
    try {
      await api.post(`/admin/gifts/${id}/deliver`, {});
      showToast('Marked as delivered');
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  document.querySelectorAll('.tab[data-status]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      statusFilter = tab.dataset.status;
      render();
    });
  });

  load();
</script>
</body>
</html>
