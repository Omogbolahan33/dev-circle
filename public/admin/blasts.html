<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{brand.product}} — Broadcasts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    /* A broadcast is a message, so the message body leads — status and
       audience are the annotations around it. */
    .blast { padding: var(--sp-5) 0; border-bottom: 1px solid var(--line-faint); cursor: pointer; }
    .blast:last-child { border-bottom: none; }
    .blast-head { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-2); flex-wrap: wrap; }
    .blast-subject { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-base); }
    .blast-body { font-size: var(--fs-sm); color: var(--ash); line-height: var(--lh-loose); margin-bottom: var(--sp-3); }
    .blast-meta { display: flex; gap: var(--sp-3); flex-wrap: wrap; font-size: var(--fs-xs); color: var(--ash-dim); }
    .list { max-width: 780px; }

    .delivery-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line-faint); font-size: var(--fs-sm); }
    .delivery-row:last-child { border-bottom: none; }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">Broadcasts</h1>
          <p class="page-subtitle">Everything sent to members, and what actually reached them. Compose a new one from Members or from a cohort.</p>
        </div>
        <div class="page-actions">
          <a href="/admin/members.html" class="btn btn-sm btn-primary">Compose</a>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-status="">All</button>
        <button class="tab" data-status="sent">Sent</button>
        <button class="tab" data-status="draft">Draft</button>
        <button class="tab" data-status="failed">Failed</button>
      </nav>
    </header>

    <div class="app-body">
      <div class="list" id="list">
        <div class="blast"><div class="skeleton" style="width:40%;height:14px;margin-bottom:10px"></div><div class="skeleton" style="width:80%"></div></div>
        <div class="blast"><div class="skeleton" style="width:34%;height:14px;margin-bottom:10px"></div><div class="skeleton" style="width:72%"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- Per-recipient outcome: who received it, who was skipped, and why. -->
<aside class="drawer drawer-lg" id="deliveryDrawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title" id="dSubject">Delivery log</div>
      <div class="drawer-sub" id="dMeta"></div>
    </div>
    <button class="icon-btn" onclick="Shell.closeDrawer('deliveryDrawer')">×</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/survey-theme.js"></script>
<script src="/assets/js/brand.js"></script>
<script>
  Shell.admin('blasts');

  const CHANNELS = { email: 'Email', whatsapp: 'WhatsApp', sms: 'SMS', in_portal: 'In-portal', all: 'All channels' };
  const TARGETS = { all: 'All members', cohort: 'Cohort', specific: 'Selected members' };

  let blasts = [];
  let statusFilter = '';

  async function load() {
    document.getElementById('list').innerHTML =
      '<div class="blast"><div class="skeleton" style="width:40%;height:14px;margin-bottom:10px"></div><div class="skeleton" style="width:80%"></div></div>';
    try {
      const data = await api.get('/admin/blasts');
      blasts = data.blasts;
      render();
    } catch (err) {
      document.getElementById('list').innerHTML = emptyState({ title: 'Could not load broadcasts', text: err.message });
    }
  }

  function render() {
    const list = blasts.filter(b => !statusFilter || b.status === statusFilter);
    const el = document.getElementById('list');

    if (!list.length) {
      el.innerHTML = emptyState({
        title: statusFilter ? `Nothing ${statusFilter}` : 'No broadcasts yet',
        text: 'Broadcasts go out from the Members list or from a cohort, so the audience is chosen before the message is written.',
        action: '<a href="/admin/members.html" class="btn btn-sm btn-primary">Compose one</a>'
      });
      return;
    }

    el.innerHTML = list.map(b => `
      <article class="blast" onclick="openDeliveries('${b.id}')">
        <div class="blast-head">
          <span class="blast-subject">${escapeHtml(b.subject || 'No subject')}</span>
          ${badge(b.status, b.status === 'sent' ? 'active' : b.status === 'failed' ? 'danger' : 'warn')}
        </div>
        <p class="blast-body">${escapeHtml(b.content.length > 220 ? b.content.slice(0, 220) + '…' : b.content)}</p>
        <div class="blast-meta">
          <span>${CHANNELS[b.channel] || b.channel}</span>
          <span>${TARGETS[b.target_type] || b.target_type}</span>
          <span>${formatDate(b.sent_at || b.created_at)}</span>
        </div>
      </article>`).join('');
  }

  // The honest record: delivered, skipped for consent, held for quiet hours.
  async function openDeliveries(id) {
    const blast = blasts.find(b => b.id === id);
    document.getElementById('dSubject').textContent = blast.subject || 'No subject';
    document.getElementById('dMeta').textContent =
      `${CHANNELS[blast.channel] || blast.channel} · ${formatDate(blast.sent_at || blast.created_at)}`;
    document.getElementById('dBody').innerHTML = '<div class="row"><span class="spinner"></span></div>';
    Shell.openDrawer('deliveryDrawer');

    try {
      const data = await api.get(`/admin/blasts/${id}/deliveries`);
      const rows = data.deliveries || [];

      if (!rows.length) {
        document.getElementById('dBody').innerHTML = emptyState({
          title: 'Not sent yet',
          text: 'This broadcast has no delivery records.'
        });
        return;
      }

      const counts = rows.reduce((acc, r) => { acc[r.status] = (acc[r.status] || 0) + 1; return acc; }, {});

      document.getElementById('dBody').innerHTML = `
        <div class="figures" style="gap:var(--sp-6);padding-bottom:var(--sp-4);margin-bottom:var(--sp-4)">
          ${Object.entries(counts).map(([status, n]) =>
            `<div><div class="figure-value">${n}</div><div class="figure-label">${escapeHtml(status)}</div></div>`).join('')}
        </div>
        ${rows.map(r => `
          <div class="delivery-row">
            <span class="truncate" style="flex:1">${escapeHtml(r.user_name || r.user_id)}</span>
            <span class="text-xs muted">${escapeHtml(r.channel)}</span>
            ${badge(r.status, r.status === 'delivered' ? 'active' : r.status === 'failed' ? 'danger' : 'warn')}
            ${r.reason ? `<span class="dim text-xs">${escapeHtml(r.reason)}</span>` : ''}
          </div>`).join('')}`;
    } catch (err) {
      document.getElementById('dBody').innerHTML = emptyState({ title: 'Could not load deliveries', text: err.message });
    }
  }

  document.querySelectorAll('.tab[data-status]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      statusFilter = tab.dataset.status;
      render();
    });
  });

  load();
</script>
</body>
</html>
