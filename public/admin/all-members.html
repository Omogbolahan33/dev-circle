<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <title>Dev Circle — All members</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    .directory-toolbar { display:flex; gap:var(--sp-3); align-items:center; flex-wrap:wrap; margin-bottom:var(--sp-4); }
    .directory-search { flex:1 1 260px; min-width:180px; }
    .directory-filter { width:auto; min-width:180px; }
    .directory-count { color:var(--text-3); font-size:var(--fs-sm); margin-left:auto; }
    .member-list { display:grid; gap:var(--sp-3); }
    .member-card { display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,300px); gap:var(--sp-4); align-items:center; padding:var(--sp-4); background:var(--surface-2); border:1px solid var(--line-faint); border-radius:var(--r-lg); }
    .member-identity { min-width:0; }
    .member-name { color:var(--text-1); font-weight:var(--fw-semibold); overflow-wrap:anywhere; }
    .member-email { color:var(--text-3); font-size:var(--fs-sm); overflow-wrap:anywhere; }
    .member-meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:var(--sp-2); }
    .circle-chip { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:999px; background:var(--surface-3); color:var(--text-2); font-size:11px; }
    .circle-chip.archived { color:var(--text-3); text-decoration:line-through; }
    .no-circle { color:var(--cd-gold); font-size:var(--fs-xs); }
    .member-state { color:var(--text-3); font-size:11px; text-transform:capitalize; }
    .assign-form { display:flex; gap:var(--sp-2); min-width:0; }
    .assign-form .input { min-width:0; flex:1; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .empty-members { padding:var(--sp-8); text-align:center; color:var(--text-3); }
    .directory-pagination { display:flex; justify-content:center; align-items:center; gap:var(--sp-3); padding:var(--sp-4) 0; }
    @media(max-width:650px) {
      .member-card { grid-template-columns:1fr; gap:var(--sp-3); padding:var(--sp-3); }
      .directory-count { width:100%; margin-left:0; }
      .directory-search,.directory-filter { width:100%; flex-basis:100%; }
      .assign-form { width:100%; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="app-main">
    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">All members</h1>
          <p class="page-subtitle">Every member account, with its circle memberships. Add an existing member to another active circle without creating a duplicate account.</p>
        </div>
      </div>
    </header>
    <main class="app-body">
      <div class="directory-toolbar">
        <label class="search-box directory-search">
          <span class="icon" data-icon="search" data-icon-size="14"></span>
          <input class="input" id="search" type="search" placeholder="Search name, email, or company" autocomplete="off">
        </label>
        <select class="input directory-filter" id="membershipFilter" aria-label="Filter by circle membership">
          <option value="all">All accounts</option>
          <option value="unassigned">No circle assigned</option>
          <option value="assigned">Has a circle</option>
        </select>
        <span class="directory-count" id="count" aria-live="polite"></span>
      </div>
      <div class="member-list" id="members" aria-live="polite">
        <div class="member-card"><div class="skeleton" style="height:48px"></div><div class="skeleton" style="height:38px"></div></div>
        <div class="member-card"><div class="skeleton" style="height:48px"></div><div class="skeleton" style="height:38px"></div></div>
      </div>
      <nav class="directory-pagination" id="pagination" aria-label="Member pages"></nav>
    </main>
  </div>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
  Shell.admin('all-members');

  const PAGE_SIZE = 30;
  let page = 1;
  let pages = 1;
  let circles = [];
  let searchTimer = null;

  async function load(nextPage = 1) {
    page = nextPage;
    const list = document.getElementById('members');
    list.innerHTML = '<div class="member-card"><div class="skeleton" style="height:48px"></div><div class="skeleton" style="height:38px"></div></div>';
    const query = new URLSearchParams({ page, limit: PAGE_SIZE });
    const term = document.getElementById('search').value.trim();
    const membership = document.getElementById('membershipFilter').value;
    if (term) query.set('search', term);
    if (membership !== 'all') query.set('membership', membership);

    try {
      const [result, circleResult] = await Promise.all([
        api.get(`/admin/circles/all-members?${query}`),
        circles.length ? Promise.resolve({ circles }) : api.get('/admin/circles/all')
      ]);
      circles = circleResult.circles.filter(circle => circle.status === 'active');
      pages = result.pagination.pages;
      document.getElementById('count').textContent = `${result.pagination.total.toLocaleString()} account${result.pagination.total === 1 ? '' : 's'} · includes accounts with no circle`;
      renderMembers(result.members);
      renderPagination(result.pagination);
    } catch (err) {
      list.innerHTML = `<div class="empty-members">${emptyState({
        title: err.status === 403 ? 'Global admin access required' : 'Could not load members',
        text: err.message || 'Check your access and try again.'
      })}</div>`;
      document.getElementById('pagination').innerHTML = '';
    }
  }

  function renderMembers(members) {
    const list = document.getElementById('members');
    if (!members.length) {
      list.innerHTML = '<div class="empty-members">No accounts match this search.</div>';
      return;
    }
    list.innerHTML = members.map(member => {
      const assigned = new Set(member.circles.map(circle => circle.id));
      const chips = member.circles.length
        ? member.circles.map(circle => `<span class="circle-chip ${circle.status === 'archived' ? 'archived' : ''}" title="${escapeHtml(circle.status)} circle">${escapeHtml(circle.name)}${circle.status === 'archived' ? ' · archived' : ''}</span>`).join('')
        : '<span class="no-circle">No circle assigned</span>';
      const choices = circles.filter(circle => !assigned.has(circle.id));
      const assign = choices.length
        ? `<form class="assign-form" data-assign-form="${member.id}">
             <label class="sr-only" for="circle-${member.id}">Assign ${escapeHtml(member.email)} to a circle</label>
             <select class="input" id="circle-${member.id}" name="circle_id" required>
               <option value="">Choose a circle…</option>
               ${choices.map(circle => `<option value="${circle.id}">${escapeHtml(circle.name)}</option>`).join('')}
             </select>
             <button class="btn btn-sm btn-primary" type="submit">Assign</button>
           </form>`
        : '<span class="dim text-xs">No other active circles available</span>';
      return `<article class="member-card">
        <div class="member-identity">
          <div class="member-name">${escapeHtml(member.name || 'Unnamed member')}</div>
          <div class="member-email">${escapeHtml(member.email)}</div>
          <div class="member-meta"><span class="member-state">${escapeHtml(member.status || 'unknown')}</span>${chips}</div>
        </div>
        ${assign}
      </article>`;
    }).join('');
  }

  function renderPagination(pagination) {
    const el = document.getElementById('pagination');
    if (pagination.pages <= 1) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <button class="btn btn-sm btn-secondary" ${pagination.page <= 1 ? 'disabled' : ''} onclick="load(${pagination.page - 1})">Previous</button>
      <span class="text-sm muted">Page ${pagination.page} of ${pagination.pages}</span>
      <button class="btn btn-sm btn-secondary" ${pagination.page >= pagination.pages ? 'disabled' : ''} onclick="load(${pagination.page + 1})">Next</button>`;
  }

  document.getElementById('search').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => load(1), 250);
  });
  document.getElementById('membershipFilter').addEventListener('change', () => load(1));
  document.getElementById('members').addEventListener('submit', async event => {
    const form = event.target.closest('[data-assign-form]');
    if (!form) return;
    event.preventDefault();
    const button = form.querySelector('button[type="submit"]');
    const circleId = new FormData(form).get('circle_id');
    if (!circleId) return;
    button.disabled = true;
    try {
      await api.post('/admin/circles/all-members/assign', {
        user_id: form.dataset.assignForm,
        circle_id: circleId
      });
      showToast('Member assigned to circle');
      await load(page);
    } catch (err) {
      button.disabled = false;
      showToast(err.message || 'Could not assign member', 'error');
    }
  });

  load();
</script>
</body>
</html>
