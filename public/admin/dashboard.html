<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    /* The story on the left, the standing distributions on the right. */
    .overview { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--sp-6); align-items: start; }
    @media (max-width: 1080px) { .overview { grid-template-columns: minmax(0, 1fr); } }

    .bar-row { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-2) var(--sp-3); align-items: center; margin-bottom: var(--sp-3); }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label { font-size: var(--fs-sm); display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
    .bar-count { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ash); }
    .bar-track { grid-column: 1 / -1; height: 4px; background: var(--tint-2); border-radius: var(--r-full); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: var(--r-full); }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">Overview</h1>
          <p class="page-subtitle">Engagement across the Credit Direct developer ecosystem.</p>
        </div>
        <div class="page-actions">
          <a href="/admin/members.html" class="btn btn-sm btn-secondary">View members</a>
          <a href="/admin/survey-new.html" class="btn btn-sm btn-primary">New survey</a>
        </div>
      </div>
      <nav class="tabs">
        <a href="/admin/dashboard.html" class="tab active">Overview</a>
        <a href="/admin/analytics.html" class="tab">Analytics</a>
        <a href="/admin/activity.html" class="tab">Activity</a>
      </nav>
    </header>

    <div class="app-body">

      <div class="stat-grid mb-6" id="stats">
        <div class="stat"><div class="stat-label">Members</div><div class="stat-value"><span class="skeleton" style="display:inline-block;width:60px;height:26px"></span></div></div>
        <div class="stat"><div class="stat-label">Engagement</div><div class="stat-value"><span class="skeleton" style="display:inline-block;width:60px;height:26px"></span></div></div>
        <div class="stat"><div class="stat-label">Surveys</div><div class="stat-value"><span class="skeleton" style="display:inline-block;width:60px;height:26px"></span></div></div>
        <div class="stat"><div class="stat-label">Cohorts</div><div class="stat-value"><span class="skeleton" style="display:inline-block;width:60px;height:26px"></span></div></div>
      </div>

      <div class="overview">

        <section class="card card-flush">
          <div class="card-head">
            <span class="card-title">Recent activity</span>
            <a href="/admin/activity.html" class="section-link">View all →</a>
          </div>
          <div class="card-body">
            <div class="timeline" id="activity">
              <div class="tl-item"><div class="skeleton" style="width:70%"></div></div>
              <div class="tl-item"><div class="skeleton" style="width:55%"></div></div>
              <div class="tl-item"><div class="skeleton" style="width:62%"></div></div>
            </div>
          </div>
        </section>

        <div class="stack">
          <section class="card">
            <div class="row mb-4">
              <span class="card-title">Cohort distribution</span>
              <span class="spacer"></span>
              <a href="/admin/cohorts.html" class="section-link">Manage →</a>
            </div>
            <div id="cohortBars"><div class="skeleton" style="width:100%;height:40px"></div></div>
          </section>

          <section class="card">
            <div class="row mb-4">
              <span class="card-title">API maturity</span>
            </div>
            <div id="statusBars"></div>
          </section>

          <section class="card">
            <div class="row mb-4">
              <span class="card-title">Open feedback</span>
              <span class="spacer"></span>
              <a href="/admin/feedback.html" class="section-link">Triage →</a>
            </div>
            <div id="feedbackPreview" class="stack-tight"></div>
          </section>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/survey-theme.js"></script>
<script src="/assets/js/brand.js"></script>
<script src="/assets/js/activity.js"></script>
<script>
  Shell.admin('dashboard');

  async function load() {
    try {
      const dashboard = await api.get('/admin/dashboard');

      renderStats(dashboard.stats);
      renderActivity(dashboard.recent_activity);
      renderCohorts(dashboard.cohort_breakdown);
      renderStatus(dashboard.status_breakdown, dashboard.stats.total_members);
      renderFeedback(dashboard.open_feedback || []);
    } catch (err) {
      showToast('Failed to load overview: ' + err.message, 'error');
    }
  }

  function renderStats(s) {
    document.getElementById('stats').innerHTML = `
      <div class="stat">
        <div class="stat-label">Members</div>
        <div class="stat-value tnum">${s.total_members.toLocaleString()}</div>
        <div class="stat-foot">${s.new_this_week ? `<span class="up">+${s.new_this_week}</span> this week` : 'No new members this week'}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Engagement rate</div>
        <div class="stat-value tnum">${s.engagement_rate}<span class="unit">%</span></div>
        <div class="stat-foot">${s.surveys_completed} of ${s.surveys_sent} surveys completed</div>
      </div>
      <div class="stat">
        <div class="stat-label">Surveys sent</div>
        <div class="stat-value tnum">${s.surveys_sent.toLocaleString()}</div>
        <div class="stat-foot">Across all cohorts</div>
      </div>
      <div class="stat">
        <div class="stat-label">Cohorts</div>
        <div class="stat-value tnum">${s.active_cohorts}</div>
        <div class="stat-foot">Segments in use</div>
      </div>`;
  }

  function renderActivity(items) {
    const el = document.getElementById('activity');
    if (!items.length) {
      el.innerHTML = emptyState({
        title: 'No activity yet',
        text: 'Engagement events appear here as members respond, claim rewards, and go live.'
      });
      return;
    }

    let lastDay = null;
    el.innerHTML = items.slice(0, 14).map(a => {
      const info = activityInfo(a.type);
      const day = activityDayLabel(a.created_at);
      const divider = day !== lastDay ? `<div class="tl-divider">${day}</div>` : '';
      lastDay = day;
      return `
        ${divider}
        <div class="tl-item">
          <div class="tl-dot ${info.tone}"></div>
          <div class="tl-head">
            <a class="tl-title" href="/admin/member.html?id=${a.user_id}">${escapeHtml(a.user_name || 'System')}</a>
            <span class="muted text-sm">${info.text}</span>
            <span class="tl-time">${formatDate(a.created_at)}</span>
          </div>
        </div>`;
    }).join('');
  }

  function renderCohorts(cohorts) {
    const el = document.getElementById('cohortBars');
    if (!cohorts.length) { el.innerHTML = '<div class="dim text-sm">No cohorts yet.</div>'; return; }
    const max = Math.max(...cohorts.map(c => c.member_count), 1);
    el.innerHTML = cohorts.slice(0, 6).map(c => `
      <div class="bar-row">
        <span class="bar-label truncate"><span class="tag" style="background:${c.color}22;color:${c.color}">${escapeHtml(c.name)}</span></span>
        <span class="bar-count">${c.member_count}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${(c.member_count / max) * 100}%;background:${c.color}"></span></span>
      </div>`).join('');
  }

  function renderStatus(breakdown, total) {
    // Sandbox reads gold, production reads teal — the same logic the badges use.
    const colors = { production: 'var(--teal)', sandbox: 'var(--cd-gold)' };
    document.getElementById('statusBars').innerHTML = breakdown.map(s => `
      <div class="bar-row">
        <span class="bar-label">${badge(s.api_status, s.api_status)}</span>
        <span class="bar-count">${s.count} · ${Math.round((s.count / (total || 1)) * 100)}%</span>
        <span class="bar-track"><span class="bar-fill" style="width:${(s.count / (total || 1)) * 100}%;background:${colors[s.api_status] || 'var(--ash-dim)'}"></span></span>
      </div>`).join('') || '<div class="dim text-sm">No members yet.</div>';
  }

  function renderFeedback(items) {
    const el = document.getElementById('feedbackPreview');
    if (!items.length) { el.innerHTML = '<div class="dim text-sm">Nothing waiting for triage.</div>'; return; }
    el.innerHTML = items.map(f => `
      <a href="/admin/feedback.html?id=${f.id}" class="row" style="gap:var(--sp-3);text-decoration:none">
        ${avatar(f.user_name, f.source === 'feex' ? '' : 'avatar-gold')}
        <span class="truncate" style="flex:1">
          <span class="text-sm" style="color:var(--white)">${escapeHtml(f.content.slice(0, 48))}${f.content.length > 48 ? '…' : ''}</span>
          <span class="dim text-xs" style="display:block">${escapeHtml(f.user_name)} · ${formatDate(f.created_at)}</span>
        </span>
      </a>`).join('');
  }

  load();
</script>
</body>
</html>
