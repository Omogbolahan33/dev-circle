<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — API reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <!-- Swagger UI ships with the app rather than from a CDN, so the reference
       works offline and stays inside the Content-Security-Policy. -->
  <link rel="stylesheet" href="/vendor/swagger-ui/swagger-ui.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    /* ── Quick start ──────────────────────────────────────────
       Swagger UI's own snippets only appear once a call has been executed,
       which is no help to somebody who has not made their first one. This
       block is the four lines they actually need, in their language. */
    .quickstart { max-width: var(--max-content); margin-bottom: var(--sp-6); }
    .quickstart .card-body { padding-top: var(--sp-4); }
    .snippet {
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      line-height: var(--lh-loose);
      color: var(--text);
      background: var(--surface-0);
      border: 1px solid var(--line-faint);
      border-radius: var(--r-md);
      padding: var(--sp-4);
      margin: 0;
      white-space: pre;
      overflow-x: auto;
    }
    .snippet-bar { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
    .snippet-bar .spacer { flex: 1; }

    /* ── Sandbox banner ───────────────────────────────────────
       Which database "Try it out" is about to hit is the single most important
       thing on this page, so it is stated at the top and colour-coded, not
       tucked into a settings menu. */
    .mode-bar {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      flex-wrap: wrap;
      max-width: var(--max-content);
      margin-bottom: var(--sp-5);
      padding: var(--sp-4) var(--sp-5);
      border-radius: var(--r-lg);
      border: 1px solid var(--line-faint);
      background: var(--surface-2);
      transition: border-color var(--duration-fast) var(--ease-out);
    }
    .mode-bar.live { border-color: var(--rose); background: var(--rose-dim); }
    .mode-bar .grow { flex: 1; min-width: 220px; }
    .mode-title { font-weight: var(--fw-semibold); display: flex; align-items: center; gap: var(--sp-2); }
    .mode-text { font-size: var(--fs-xs); color: var(--ash); line-height: var(--lh-normal); margin-top: 2px; }
    .mode-bar.live .mode-text { color: var(--rose-ink); }

    .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-full); overflow: hidden; }
    .segmented button {
      padding: var(--sp-2) var(--sp-4);
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      background: transparent;
      color: var(--ash);
      border: none;
      cursor: pointer;
    }
    .segmented button.on { background: var(--cd-blue); color: var(--on-accent); }
    .segmented button.on[data-mode="live"] { background: var(--rose); }

    /* ── Swagger UI, wearing the product's clothes ────────────
       Swagger's stylesheet is built for a white page. These map its surfaces,
       type and lines onto our tokens, which flip with the theme — so the
       reference reads as part of the console in both. */
    .swagger-wrap {
      background: var(--surface-2);
      border: 1px solid var(--line-faint);
      border-radius: var(--r-lg);
      overflow: hidden;
      max-width: var(--max-content);
    }

    .swagger-ui, .swagger-ui .info li, .swagger-ui .info p, .swagger-ui .info table,
    .swagger-ui .opblock-description-wrapper p, .swagger-ui .opblock-external-docs-wrapper p,
    .swagger-ui .opblock-title_normal p, .swagger-ui .renderedMarkdown p,
    .swagger-ui .parameter__name, .swagger-ui table thead tr td, .swagger-ui table thead tr th,
    .swagger-ui .response-col_status, .swagger-ui .response-col_links, .swagger-ui label,
    .swagger-ui .tab li, .swagger-ui .opblock .opblock-section-header h4,
    .swagger-ui .opblock .opblock-section-header > label {
      color: var(--text);
      font-family: var(--font-body);
    }

    .swagger-ui .info .title, .swagger-ui h1, .swagger-ui h2, .swagger-ui h3,
    .swagger-ui h4, .swagger-ui h5, .swagger-ui .opblock-tag {
      color: var(--text);
      font-family: var(--font-display);
    }

    .swagger-ui .info { margin: var(--sp-8) 0 var(--sp-6); }
    .swagger-ui .scheme-container, .swagger-ui .wrapper { background: transparent; box-shadow: none; }
    .swagger-ui .scheme-container { border-bottom: 1px solid var(--line-faint); padding: var(--sp-4) 0; }

    .swagger-ui .opblock-tag { border-bottom-color: var(--line-faint); }
    .swagger-ui .opblock-tag small { color: var(--text-2); }
    .swagger-ui .opblock-tag:hover { background: var(--tint-1); }

    .swagger-ui .opblock {
      background: var(--surface-3);
      border-color: var(--line);
      box-shadow: none;
      margin: 0 0 var(--sp-3);
    }
    .swagger-ui .opblock .opblock-summary { border-color: var(--line); }
    .swagger-ui .opblock .opblock-summary-path,
    .swagger-ui .opblock .opblock-summary-path__deprecated,
    .swagger-ui .opblock .opblock-summary-operation-id {
      color: var(--text);
      font-family: var(--font-mono);
    }
    .swagger-ui .opblock .opblock-summary-description { color: var(--text-2); }
    .swagger-ui .opblock-body { background: var(--surface-2); }

    .swagger-ui .opblock .opblock-section-header {
      background: var(--tint-1);
      box-shadow: none;
      border-bottom: 1px solid var(--line-faint);
    }

    .swagger-ui .parameters-col_description p, .swagger-ui .markdown p,
    .swagger-ui .renderedMarkdown li, .swagger-ui .response-col_description__inner p {
      color: var(--text-2);
    }
    .swagger-ui .parameter__type, .swagger-ui .prop-type,
    .swagger-ui .parameter__extension, .swagger-ui .parameter__in {
      color: var(--blue-ink);
      font-family: var(--font-mono);
    }
    .swagger-ui .parameter__enum { color: var(--text-3); }

    .swagger-ui table tbody tr td { border-color: var(--line-faint); color: var(--text-2); }
    .swagger-ui .responses-inner { padding: var(--sp-4); }

    /* ── Documentation folds away once you have a real answer ──
       Before you send anything, the documented responses are the whole point.
       The moment one comes back they become reference material sitting directly
       under it, in the same shape, and the two get confused. So they collapse
       behind their own heading, which turns into the control that brings them
       back. No element is inserted to do it — Swagger's tree is React's, and
       adding nodes to it invites a reconciliation crash — only a class and an
       attribute, which React leaves alone. */
    .swagger-ui .opblock.docs-collapsed .responses-inner > table.responses-table { display: none; }

    .swagger-ui .responses-inner h4.doc-heading {
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: var(--sp-3);
    }
    .swagger-ui .responses-inner h4.doc-heading::after {
      content: attr(data-doc-hint);
      font-family: var(--font-body);
      font-size: var(--fs-xs);
      font-weight: var(--fw-medium);
      letter-spacing: 0;
      color: var(--blue-ink);
      background: var(--cd-blue-dim);
      border: 1px solid var(--cd-blue-40);
      border-radius: var(--r-full);
      padding: 1px 9px;
    }
    .swagger-ui .responses-inner h4.doc-heading:hover::after { border-color: var(--cd-blue); }

    /* And the live one gets the accent, so the eye lands on the answer. */
    .swagger-ui .live-responses-table {
      border-left: 2px solid var(--cd-blue);
      padding-left: var(--sp-4);
    }

    /* Code blocks.
       Swagger prints these as white-on-charcoal and its syntax highlighting is
       tuned for that ground — the string green is a pale mint that only reads
       on something dark. Repainting the block to our light surface therefore
       makes every response body and every example vanish into the paper, which
       is exactly what it did. So the blocks keep their own dark ground, nudged
       to ours only in dark mode where that is safe. */
       Swagger sets the ground inline on the blocks it highlights, so overriding
       it here only ever half-worked — response bodies kept theirs while the
       request URL took ours, and the two no longer matched. We style the frame
       and leave the ground alone. */
    .swagger-ui .microlight, .swagger-ui pre.microlight,
    .swagger-ui .highlight-code > .microlight, .swagger-ui .model-example pre {
      border: 1px solid var(--line-faint);
      border-radius: var(--r-md);
    }

    /* Prose code, which we do own: the ink variants carry a colour that clears
       contrast on each theme's background rather than one gold for both. */
    .swagger-ui .markdown code, .swagger-ui .renderedMarkdown code {
      background: var(--tint-2);
      color: var(--gold-ink);
      font-family: var(--font-mono);
      padding: 1px 5px;
      border-radius: var(--r-sm);
    }
    .swagger-ui .markdown pre, .swagger-ui .renderedMarkdown pre {
      background: var(--surface-0);
      border: 1px solid var(--line-faint);
      border-radius: var(--r-md);
      color: var(--text);
    }
    /* A fenced block already has a ground; its code must not paint a second one */
    .swagger-ui .markdown pre code, .swagger-ui .renderedMarkdown pre code {
      background: none;
      color: inherit;
      padding: 0;
    }

    /* Models and schemas. */
    .swagger-ui section.models { border-color: var(--line); background: var(--surface-3); }
    .swagger-ui section.models .model-container { background: var(--tint-1); }
    .swagger-ui .model-title, .swagger-ui .model, .swagger-ui .model-toggle:after { color: var(--text); }
    .swagger-ui .model .property.primitive, .swagger-ui .prop-format { color: var(--text-3); }

    /* Controls. */
    .swagger-ui input[type=text], .swagger-ui input[type=password], .swagger-ui input[type=email],
    .swagger-ui textarea, .swagger-ui select {
      background: var(--surface-4);
      color: var(--text);
      border-color: var(--line);
      font-family: var(--font-body);
    }
    .swagger-ui textarea { font-family: var(--font-mono); }
    .swagger-ui .filter .operation-filter-input {
      background: var(--surface-4);
      border-color: var(--line);
      color: var(--text);
    }
    .swagger-ui .btn { color: var(--text); border-color: var(--line-strong); }
    .swagger-ui .btn.execute { background: var(--cd-blue); border-color: var(--cd-blue); color: var(--on-accent); }
    .swagger-ui .btn.authorize { color: var(--teal); border-color: var(--teal); }
    .swagger-ui .btn.authorize svg { fill: var(--teal); }
    .swagger-ui .dialog-ux .modal-ux { background: var(--surface-3); border-color: var(--line); }
    .swagger-ui .dialog-ux .modal-ux-header h3, .swagger-ui .dialog-ux .modal-ux-content h4,
    .swagger-ui .dialog-ux .modal-ux-content p { color: var(--text); }
    .swagger-ui .copy-to-clipboard { background: var(--tint-3); }

    /* The vendor extension we use to say which permission gates an endpoint. */
    .swagger-ui .opblock-summary-description + .view-line-link { display: none; }
    .swagger-ui .renderedMarkdown strong { color: var(--gold-ink); }

    /* Swagger draws its own top bar and info block; ours already says what the
       page is, so its title and version badge would only repeat us. */
    .swagger-ui .info .title small.version-stamp { display: none; }
    .swagger-ui .info hgroup.main { display: none; }

    /* Dark mode needs the arrows and toggles lifted off Swagger's black. */
    :root[data-theme="dark"] .swagger-ui svg:not(.authorize):not(.locked):not(.unlocked) { fill: var(--text-2); }
    :root[data-theme="dark"] .swagger-ui .opblock-summary-control:focus { outline-color: var(--cd-blue); }
    :root[data-theme="dark"] .swagger-ui .expand-methods svg,
    :root[data-theme="dark"] .swagger-ui .expand-operation svg { fill: var(--text-2); }

    @media (max-width: 720px) {
      .swagger-ui .opblock-summary-path { word-break: break-all; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">API reference</h1>
          <p class="page-subtitle">Every Dev Circle endpoint, with payloads, responses and a live console. Share it with anybody building against the platform.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-sm btn-secondary" onclick="copySpecUrl()">Copy spec URL</button>
          <button class="btn btn-sm btn-primary" onclick="downloadSpec()">Download OpenAPI</button>
        </div>
      </div>
    </header>

    <div class="app-body">

      <div class="mode-bar hide" id="modeBar">
        <div class="grow">
          <div class="mode-title" id="modeTitle"></div>
          <div class="mode-text" id="modeText"></div>
        </div>
        <div class="segmented" id="modeToggle">
          <button data-mode="sandbox" class="on" onclick="setMode('sandbox')">Sandbox</button>
          <button data-mode="live" onclick="setMode('live')">Live data</button>
        </div>
        <button class="btn btn-sm btn-secondary" id="resetSandboxBtn" onclick="resetSandbox()">Reset sandbox</button>
      </div>

      <section class="card quickstart hide" id="quickstart">
        <div class="card-head">
          <h2 class="card-title">Quick start</h2>
          <span class="spacer"></span>
          <span class="text-xs dim" id="specMeta"></span>
        </div>
        <div class="card-body">
          <div class="snippet-bar">
            <button class="chip active" data-lang="curl">cURL</button>
            <button class="chip" data-lang="javascript">JavaScript</button>
            <button class="chip" data-lang="node">Node.js</button>
            <button class="chip" data-lang="python">Python</button>
            <span class="spacer"></span>
            <button class="btn btn-sm btn-ghost" onclick="copyQuickstart()">Copy</button>
          </div>
          <pre class="snippet" id="quickstartCode"></pre>
        </div>
      </section>

      <div id="state"></div>
      <div class="swagger-wrap hide" id="swaggerWrap"><div id="swagger"></div></div>
    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/survey-theme.js"></script>
<script src="/assets/js/brand.js"></script>
<script src="/vendor/swagger-ui/swagger-ui-bundle.js"></script>
<script>
  Shell.admin('api-docs');

  const SPEC_PATH = '/admin/docs/openapi.json';
  const SPEC_URL = window.location.origin + '/api' + SPEC_PATH;
  const SANDBOX_HEADER = 'X-Devcircle-Sandbox';
  let spec = null;

  // ─── Which data are we about to hit? ────────────────────────
  // Sandbox by default, deliberately. Somebody exploring an API reference is
  // not expecting to have deleted a cohort or messaged the member base, and
  // the failure is silent — you only find out afterwards. Live is a choice
  // that has to be made on purpose, and it is remembered only for the tab.

  const MODE_KEY = 'devcircle_docs_mode';
  let mode = sessionStorage.getItem(MODE_KEY) === 'live' ? 'live' : 'sandbox';
  let sandboxAvailable = false;

  function setMode(next) {
    if (next === 'sandbox' && !sandboxAvailable) {
      return showToast('The sandbox is not available to you', 'error');
    }
    mode = next;
    sessionStorage.setItem(MODE_KEY, next);
    renderMode();
  }

  function renderMode() {
    const bar = document.getElementById('modeBar');
    const live = mode === 'live';

    bar.classList.toggle('live', live);
    bar.classList.remove('hide');

    document.getElementById('modeTitle').innerHTML = live
      ? `${badge('live data', 'danger')} Requests hit the real platform`
      : `${badge('sandbox', 'active')} Requests hit a throwaway copy`;

    // Operations open ready to send, which means Swagger's toggle reads
    // "Cancel" from the start rather than "Try it out". That reads as an
    // instruction to somebody looking for the usual button, and pressing it
    // drops the panel back to samples — so the flow is spelled out here.
    const howTo = ' Open an operation and press Execute — it is already live. The button marked Cancel returns it to samples.';

    document.getElementById('modeText').textContent = (live
      ? 'Try it out will create, change and delete real records, and messages will actually be sent. Switch back to the sandbox unless you mean it.'
      : 'Everything works — the same validation, the same permissions, the same errors — against invented people. Nothing is dispatched, and you can reset it at any time.') + howTo;

    document.querySelectorAll('#modeToggle button').forEach(button => {
      button.classList.toggle('on', button.dataset.mode === mode);
    });

    document.getElementById('resetSandboxBtn').classList.toggle('hide', live || !sandboxAvailable);
  }

  async function resetSandbox() {
    const ok = await Shell.confirm({
      title: 'Reset the sandbox?',
      text: 'The sandbox database is deleted and rebuilt from demo data. Anything you created while exploring is gone. The live database is untouched.',
      ok: 'Reset sandbox'
    });
    if (!ok) return;

    try {
      const result = await api('/admin/sandbox/reset', {
        method: 'POST',
        headers: { ...Auth.headers(), [SANDBOX_HEADER]: '1' },
        body: '{}'
      });
      showToast(result.message);
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  // ─── Request snippets ───────────────────────────────────────
  // Swagger UI resolves a snippet generator by looking for a function named
  // requestSnippetGenerator_<key> on the system. Registering our own is how the
  // "Try it out" panel offers JavaScript, Node and Python beside its cURL.

  // The request arrives as an Immutable Map, so it is flattened once here and
  // every generator works with plain values.
  function readRequest(request) {
    const headers = {};
    const raw = request.get('headers');
    if (raw && typeof raw.entries === 'function') {
      for (const [key, value] of raw.entries()) headers[key] = value;
    }

    let body = request.get('body');
    if (body && typeof body.toJS === 'function') body = body.toJS();

    return {
      url: request.get('url'),
      method: (request.get('method') || 'GET').toUpperCase(),
      headers,
      body
    };
  }

  // The body is a string for JSON operations and an object for form data.
  // Either way we want a value we can print as a literal.
  function bodyValue(body) {
    if (body === undefined || body === null || body === '') return undefined;
    if (typeof body === 'object') return body;
    try { return JSON.parse(body); } catch { return String(body); }
  }

  function jsLiteral(value, indent = 2) {
    return JSON.stringify(value, null, indent).split('\n').join('\n' + ' '.repeat(indent));
  }

  // JSON is very nearly Python already — only the three literals differ.
  function pyLiteral(value, indent = 4) {
    const json = JSON.stringify(value, null, 4);
    if (json === undefined) return 'None';
    return json
      .replace(/: true\b/g, ': True')
      .replace(/: false\b/g, ': False')
      .replace(/: null\b/g, ': None')
      .split('\n').join('\n' + ' '.repeat(indent));
  }

  function headerLiteral(headers, printer, indent) {
    const kept = { ...headers };
    delete kept['Content-Length'];
    return printer(kept, indent);
  }

  function javascriptSnippet(request, { node = false } = {}) {
    const { url, method, headers, body } = request;
    const payload = bodyValue(body);
    const lines = [];

    if (node) {
      lines.push('// Node 18+ has fetch built in.', '');
    }

    lines.push(`const response = await fetch(${JSON.stringify(url)}, {`);
    lines.push(`  method: ${JSON.stringify(method)},`);
    lines.push(`  headers: ${headerLiteral(headers, jsLiteral, 2)}${payload === undefined ? '' : ','}`);
    if (payload !== undefined) {
      lines.push(typeof payload === 'string'
        ? `  body: ${JSON.stringify(payload)}`
        : `  body: JSON.stringify(${jsLiteral(payload, 2)})`);
    }
    lines.push('});', '');
    lines.push('if (!response.ok) {');
    lines.push('  const { error } = await response.json();');
    lines.push('  throw new Error(error);');
    lines.push('}', '');
    lines.push('const data = await response.json();');

    return lines.join('\n');
  }

  function pythonSnippet(request) {
    const { url, method, headers, body } = request;
    const payload = bodyValue(body);
    const lines = ['import requests', ''];

    lines.push(`response = requests.${method.toLowerCase()}(`);
    lines.push(`    ${JSON.stringify(url)},`);
    lines.push(`    headers=${headerLiteral(headers, pyLiteral, 4)},`);
    if (payload !== undefined) {
      lines.push(typeof payload === 'string'
        ? `    data=${JSON.stringify(payload)},`
        : `    json=${pyLiteral(payload, 4)},`);
    }
    lines.push(')', '');
    lines.push('response.raise_for_status()');
    lines.push('data = response.json()');

    return lines.join('\n');
  }

  const SnippetPlugin = () => ({
    fn: {
      requestSnippetGenerator_javascript_fetch: r => javascriptSnippet(readRequest(r)),
      requestSnippetGenerator_node_fetch: r => javascriptSnippet(readRequest(r), { node: true }),
      requestSnippetGenerator_python_requests: r => pythonSnippet(readRequest(r))
    }
  });

  // ─── Quick start ────────────────────────────────────────────
  // A whole first call — sign in, then use the token — rather than a fragment.

  const QUICKSTART = {
    curl: `# 1. Sign in. A developer gives the last six digits of their phone
#    number; Credit Direct staff give a password instead.
curl -X POST '${window.location.origin}/api/auth/login' \\
  -H 'Content-Type: application/json' \\
  -d '{"identifier":"chidi@paystack.africa","digits":"550142"}'

# 2. Call anything with the token
curl '${window.location.origin}/api/users/profile' \\
  -H 'Authorization: Bearer <token>'`,

    javascript: `const BASE = '${window.location.origin}/api';

async function call(path, { method = 'GET', token, body } = {}) {
  const response = await fetch(BASE + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(token && { Authorization: 'Bearer ' + token })
    },
    body: body && JSON.stringify(body)
  });

  const data = await response.json();
  if (!response.ok) throw new Error(data.error);
  return data;
}

// Sign in, then use the token on everything that follows.
const { token } = await call('/auth/login', {
  method: 'POST',
  body: { identifier: 'chidi@paystack.africa', digits: '550142' }
});

const profile = await call('/users/profile', { token });`,

    node: `// Node 18+ — an integration authenticating with a scoped API key.
const BASE = '${window.location.origin}/api';
const API_KEY = process.env.DEVCIRCLE_API_KEY;

async function report(event) {
  const response = await fetch(BASE + '/integrations/events', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': API_KEY
    },
    body: JSON.stringify(event)
  });

  const data = await response.json();
  if (!response.ok) throw new Error(data.error);
  return data;
}

await report({
  event_type: 'first_sandbox_call',
  user_identifier: 'chidi@paystack.africa',
  user_identifier_type: 'email',
  data: { endpoint: '/v1/loans/eligibility' }
});`,

    python: `import os
import requests

BASE = "${window.location.origin}/api"
API_KEY = os.environ["DEVCIRCLE_API_KEY"]

response = requests.post(
    f"{BASE}/integrations/events",
    headers={"x-api-key": API_KEY},
    json={
        "event_type": "first_sandbox_call",
        "user_identifier": "chidi@paystack.africa",
        "user_identifier_type": "email",
        "data": {"endpoint": "/v1/loans/eligibility"},
    },
)

response.raise_for_status()
print(response.json())`
  };

  let quickstartLang = 'curl';

  function renderQuickstart() {
    document.getElementById('quickstartCode').textContent = QUICKSTART[quickstartLang];
  }

  function copyQuickstart() {
    navigator.clipboard.writeText(QUICKSTART[quickstartLang])
      .then(() => showToast('Copied'))
      .catch(() => showToast('Could not copy', 'error'));
  }

  function copySpecUrl() {
    navigator.clipboard.writeText(SPEC_URL)
      .then(() => showToast('Spec URL copied'))
      .catch(() => showToast('Could not copy', 'error'));
  }

  function downloadSpec() {
    if (!spec) return showToast('The specification has not loaded yet', 'error');

    const blob = new Blob([JSON.stringify(spec, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'devcircle-openapi.json';
    link.click();
    URL.revokeObjectURL(url);
  }

  document.querySelectorAll('.chip[data-lang]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-lang]').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      quickstartLang = chip.dataset.lang;
      renderQuickstart();
    });
  });

  // ─── Load and render ────────────────────────────────────────

  // ─── Fold the documentation once a real response arrives ────
  // Swagger renders the live result and the documented responses one above the
  // other, both as a table of status codes with example bodies. While you are
  // testing, only the top one is the answer. This collapses the lower one the
  // first time a call comes back, and hands the heading over as the toggle.

  function syncDocumentedResponses() {
    document.querySelectorAll('#swagger .opblock.is-open').forEach(block => {
      const inner = block.querySelector('.responses-inner');
      if (!inner) return;

      // The documented table sits directly under .responses-inner; the live one
      // is nested a couple of levels deeper alongside the snippets.
      const documented = inner.querySelector(':scope > table.responses-table');
      if (!documented) return;

      const live = inner.querySelector('.live-responses-table');
      const heading = [...inner.querySelectorAll('h4')]
        .find(h => h.textContent.trim() === 'Responses');

      // Nothing sent yet — or the result was cleared. The documentation is all
      // there is, so put it back and forget the fold.
      if (!live) {
        block.classList.remove('docs-collapsed');
        delete block.dataset.docsFolded;
        if (heading) {
          heading.classList.remove('doc-heading');
          heading.removeAttribute('data-doc-hint');
        }
        return;
      }

      if (!heading) return;
      heading.classList.add('doc-heading');

      // Fold on the first response only. After that the reader's choice stands,
      // however many times they execute.
      if (!block.dataset.docsFolded) {
        block.dataset.docsFolded = 'yes';
        block.classList.add('docs-collapsed');
      }

      const collapsed = block.classList.contains('docs-collapsed');
      const count = documented.querySelectorAll('tbody tr.response').length;
      const hint = collapsed
        ? `show ${count} documented response${count === 1 ? '' : 's'}`
        : 'hide documented responses';

      if (heading.dataset.docHint !== hint) heading.dataset.docHint = hint;
    });
  }

  function watchDocumentedResponses() {
    const root = document.getElementById('swagger');

    root.addEventListener('click', event => {
      const heading = event.target.closest('.doc-heading');
      if (!heading) return;
      heading.closest('.opblock').classList.toggle('docs-collapsed');
      syncDocumentedResponses();
    });

    // childList only: our own work changes classes and attributes, which this
    // deliberately does not observe, so it cannot retrigger itself.
    let queued = false;
    new MutationObserver(() => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; syncDocumentedResponses(); });
    }).observe(root, { childList: true, subtree: true });
  }

  function countOperations(paths) {
    const METHODS = ['get', 'post', 'put', 'patch', 'delete'];
    return Object.values(paths || {})
      .reduce((total, item) => total + METHODS.filter(m => item[m]).length, 0);
  }

  async function load() {
    const state = document.getElementById('state');
    state.innerHTML = '<div class="empty"><div class="empty-text">Loading the specification…</div></div>';

    try {
      spec = await api.get(SPEC_PATH);
    } catch (err) {
      // The reference is a map of the whole admin surface, so a role without
      // docs.read is told what it is missing rather than shown a blank page.
      state.innerHTML = emptyState({
        title: 'You cannot view the API reference',
        text: `${err.message} Ask an administrator for the "docs.read" permission.`
      });
      return;
    }

    state.innerHTML = '';
    document.getElementById('specMeta').textContent =
      `OpenAPI ${spec.openapi} · v${spec.info.version} · ${countOperations(spec.paths)} endpoints`;
    document.getElementById('quickstart').classList.remove('hide');
    document.getElementById('swaggerWrap').classList.remove('hide');

    // Whether the sandbox is usable is the server's answer, not a guess from
    // the stored permission list — a reader without it falls back to live and
    // is told so plainly.
    try {
      const status = await api.get('/admin/sandbox');
      sandboxAvailable = status.enabled;
    } catch {
      sandboxAvailable = false;
    }
    if (!sandboxAvailable) mode = 'live';
    renderMode();

    SwaggerUIBundle({
      spec,
      dom_id: '#swagger',
      presets: [SwaggerUIBundle.presets.apis],
      plugins: [SnippetPlugin],
      layout: 'BaseLayout',

      deepLinking: true,
      docExpansion: 'none',
      filter: true,
      displayRequestDuration: true,
      persistAuthorization: true,
      tryItOutEnabled: true,
      defaultModelsExpandDepth: 1,
      defaultModelExpandDepth: 3,
      // The permission each endpoint is gated on rides on x-permission, so the
      // extensions have to be on screen for that to be worth carrying.
      showExtensions: true,
      showCommonExtensions: true,

      requestSnippetsEnabled: true,
      requestSnippets: {
        defaultExpanded: true,
        languages: null,
        generators: {
          curl_bash: { title: 'cURL', syntax: 'bash' },
          javascript_fetch: { title: 'JavaScript', syntax: 'javascript' },
          node_fetch: { title: 'Node.js', syntax: 'javascript' },
          python_requests: { title: 'Python', syntax: 'python' }
        }
      },

      // "Try it out" runs as whoever is reading, without them pasting a token —
      // unless they authorised explicitly, in which case that wins. The sandbox
      // header rides along on every request while the toggle is set, so the
      // snippets Swagger generates are the ones that reproduce what just ran.
      requestInterceptor: request => {
        const token = Auth.getToken();
        const hasAuth = request.headers.Authorization || request.headers.authorization;
        if (token && !hasAuth) request.headers.Authorization = 'Bearer ' + token;
        // Health is a liveness probe, not a sandbox operation. Sending the
        // header made Try-it-out 500 while the live session was mirrored.
        const url = String(request.url || '');
        const health = /\/api\/health\/?(?:\?|$)/.test(url) || /\/health\/?(?:\?|$)/.test(url);
        if (mode === 'sandbox' && !health) request.headers[SANDBOX_HEADER] = '1';
        return request;
      }
    });

    watchDocumentedResponses();
  }

  renderQuickstart();
  load();
</script>
