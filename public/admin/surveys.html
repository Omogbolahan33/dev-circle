<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Surveys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">Surveys</h1>
          <p class="page-subtitle">Questions put to developers, and what came back.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-sm btn-secondary" onclick="openImportPicker()">Import responses</button>
          <a href="/admin/survey-new.html" class="btn btn-sm btn-primary">New survey</a>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-status="">All</button>
        <button class="tab" data-status="active">Active</button>
        <button class="tab" data-status="draft">Draft</button>
        <button class="tab" data-status="closed">Closed</button>
      </nav>
    </header>

    <div class="app-body">
      <div class="table-shell">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Survey</th>
                <th>Status</th>
                <th class="hide-sm">Audience</th>
                <th class="hide-sm">Mode</th>
                <th>Responses</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ─── Which survey to import into ────────────────────── -->
<!-- Answers are imported against a definition — the questions are what a
     sheet's columns line up with — so the survey is chosen before anything
     else. A picker rather than a second copy of the import form: it hands over
     to that survey's own drawer, which is built from that survey's questions. -->
<aside class="drawer" id="pickDrawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">Import responses</div>
      <div class="drawer-sub">Answers already collected — on paper, in Google Forms, anywhere else</div>
    </div>
    <button class="icon-btn" onclick="Shell.closeDrawer('pickDrawer')">×</button>
  </div>
  <div class="drawer-body" id="pickBody"></div>
  <div class="drawer-foot">
    <button class="btn btn-secondary" onclick="Shell.closeDrawer('pickDrawer')">Cancel</button>
    <button class="btn btn-primary" id="pickGo" onclick="goToImport()">Continue</button>
  </div>
</aside>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
  Shell.admin('surveys');

  let surveys = [];
  let statusFilter = '';

  const MODES = { '1-on-1': '1-on-1', email: 'Email', whatsapp: 'WhatsApp', in_portal: 'In-portal' };

  async function load() {
    document.getElementById('rows').innerHTML = skeletonRows(4, 6);
    try {
      const data = await api.get('/admin/surveys');
      surveys = data.surveys;
      render();
    } catch (err) {
      document.getElementById('rows').innerHTML =
        `<tr><td colspan="6">${emptyState({ title: 'Could not load surveys', text: err.message })}</td></tr>`;
    }
  }

  function render() {
    const list = surveys.filter(s => !statusFilter || s.status === statusFilter);
    const tbody = document.getElementById('rows');

    // Tab counts tell you where the work is before you click.
    document.querySelectorAll('.tab[data-status]').forEach(tab => {
      const n = tab.dataset.status ? surveys.filter(s => s.status === tab.dataset.status).length : surveys.length;
      tab.innerHTML = `${tab.dataset.status ? tab.dataset.status[0].toUpperCase() + tab.dataset.status.slice(1) : 'All'}<span class="count">${n}</span>`;
    });

    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="6">${emptyState({
        title: statusFilter ? `No ${statusFilter} surveys` : 'No surveys yet',
        text: 'A survey asks a cohort a short set of questions and records the answers against each member\'s engagement history. A round already run elsewhere starts the same way — write its questions here, then bring the answers in from the spreadsheet.',
        action: '<a href="/admin/survey-new.html" class="btn btn-sm btn-primary">Write the first one</a>'
      })}</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(s => {
      const rate = s.response_count ? Math.round((s.completed_count / s.response_count) * 100) : 0;
      const nq = Number(s.question_count || 0);
      const audience = s.target_type === 'all' ? 'Everyone'
        : s.target_type === 'anonymous' ? 'Anyone with the link'
        : s.target_type === 'cohort' ? `${s.target_ids.length} cohort${s.target_ids.length === 1 ? '' : 's'}`
        : `${s.target_ids.length} member${s.target_ids.length === 1 ? '' : 's'}`;

      return `
        <tr class="row-link" onclick="window.location.href='/admin/survey-responses.html?id=${s.id}'">
          <td>
            <div class="identity-meta">
              <div class="identity-name">${escapeHtml(s.title)}</div>
              <div class="identity-sub">${nq} question${nq === 1 ? '' : 's'} · ~${s.time_estimate_min} min${
                s.has_branching ? ' · branching' : ''}</div>
            </div>
          </td>
          <td>${badge(s.status, s.status === 'active' ? 'active' : s.status === 'draft' ? 'warn' : 'inactive')}</td>
          <td class="hide-sm text-xs muted">${audience}</td>
          <td class="hide-sm text-xs muted">${MODES[s.engagement_mode] || s.engagement_mode}</td>
          <td class="nowrap">
            <span class="mono tnum">${s.completed_count}/${s.response_count}</span>
            ${s.response_count ? `<span class="dim text-xs"> · ${rate}%</span>` : ''}
          </td>
          <td class="col-actions" onclick="event.stopPropagation()">
            <div class="row-actions">
              ${s.status === 'active' && s.target_type === 'anonymous' ? `
                <button class="btn btn-sm btn-ghost" onclick="copyLink('${s.public_path}')">Copy link</button>` : ''}
              ${s.status === 'active' && s.target_type !== 'anonymous' ? `
                <button class="btn btn-sm btn-ghost" onclick="invite('${s.id}')">Invite</button>
                <button class="btn btn-sm btn-ghost" onclick="remind('${s.id}')">Remind</button>` : ''}
              <a class="btn btn-sm btn-ghost" href="/admin/survey-new.html?id=${s.id}">Edit</a>
              <button class="btn btn-sm btn-ghost" onclick="duplicate('${s.id}', this)">Duplicate</button>
              <a class="btn btn-sm btn-ghost" href="/admin/survey-responses.html?id=${s.id}">Responses</a>
              <a class="btn btn-sm btn-ghost" href="/admin/survey-responses.html?id=${s.id}&import=1">Import</a>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  // Invites go out through the member's consented channel; the response
  // reports who was actually reachable.
  // A link survey has no invitation to send: handing the link out is the whole
  // of the distribution, so that is the action offered in its place.
  async function copyLink(path) {
    try {
      await navigator.clipboard.writeText(location.origin + path);
      showToast('Link copied — anyone holding it can answer, no account needed');
    } catch {
      showToast(location.origin + path, 'warning');
    }
  }

  async function invite(id) {
    const ok = await Shell.confirm({
      title: 'Send invitations?',
      text: 'Everyone in the survey audience who has consented will be invited on their preferred channel.',
      ok: 'Send invites',
      danger: false
    });
    if (!ok) return;

    try {
      const res = await api.post(`/admin/surveys/${id}/invite`, {});
      showToast(`${res.invited} invited${res.skipped ? ` · ${res.skipped} skipped` : ''}`);
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  // Running the same round again means starting from the last one, not
  // rewriting forty questions from memory — a retyped copy is never quite the
  // original, and two rounds that differ are two rounds you cannot compare.
  // The copy opens in the builder, because it is a draft that wants a name and
  // a date before it goes anywhere.
  async function duplicate(id, button) {
    const label = button.textContent;
    button.disabled = true;
    button.textContent = 'Copying…';
    try {
      const res = await api.post(`/admin/surveys/${id}/duplicate`, {});
      showToast(`Copied as a draft — ${res.questions} question${res.questions === 1 ? '' : 's'}`);
      window.location.href = `/admin/survey-new.html?id=${res.survey.id}`;
    } catch (err) {
      showToast(err.message, 'error');
      button.disabled = false;
      button.textContent = label;
    }
  }

  async function remind(id) {
    try {
      const res = await api.post(`/admin/surveys/${id}/remind`, {});
      showToast(`${res.reminded} reminded${res.skipped ? ` · ${res.skipped} skipped` : ''}`);
    } catch (err) { showToast(err.message, 'error'); }
  }

  // ─── Importing a round run elsewhere ────────────────────
  // The sheet is landed against a survey, so this asks which one and then
  // hands over. Offered here rather than only as a row action because a row
  // action is revealed by hovering the row, which is right for acting on a
  // survey you are already looking at and useless for the thing you came to
  // this page to start.
  function openImportPicker() {
    const body = document.getElementById('pickBody');
    const go = document.getElementById('pickGo');

    // Nothing to import against. The questions have to exist for a column to
    // mean anything, and saying so beats an empty dropdown.
    if (!surveys.length) {
      go.style.display = 'none';
      body.innerHTML = emptyState({
        title: 'Write the questions first',
        text: 'A sheet is imported against a survey — its questions are what the columns line up with. Recreate the questions the round asked, save it as a draft, then come back and bring the answers in.',
        action: '<a href="/admin/survey-new.html" class="btn btn-sm btn-primary">Write it</a>'
      });
      Shell.openDrawer('pickDrawer');
      return;
    }

    go.style.display = '';
    body.innerHTML = `
      <div class="field">
        <label class="label" for="pickSurvey">Which survey did they answer?</label>
        <select class="input" id="pickSurvey">
          ${surveys.map(s => `<option value="${s.id}">${escapeHtml(s.title)} · ${s.status}</option>`).join('')}
        </select>
        <div class="hint">
          The next screen carries the blank sheet to fill in, built from this survey's own
          questions — a column per question, with an example row showing the format each expects.
        </div>
      </div>
      <div class="hint mt-4">
        Run this round before? Duplicate last time's survey from the list and import into the
        copy — the questions match, so last round's export imports straight into it.
      </div>`;

    Shell.openDrawer('pickDrawer');
  }

  function goToImport() {
    window.location.href =
      `/admin/survey-responses.html?id=${document.getElementById('pickSurvey').value}&import=1`;
  }

  document.querySelectorAll('.tab[data-status]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      statusFilter = tab.dataset.status;
      render();
    });
  });

  load();
</script>
</body>
</html>
