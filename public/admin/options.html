<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <title>Dev Circle — Answer lists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    .lists { display: flex; flex-direction: column; gap: var(--sp-4); }

    .list-head { display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; }
    .list-name { font-weight: var(--fw-semibold); color: var(--text-1); }
    .list-key { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-3); }
    /* Beside the name rather than under it, and truncated — it is a note on
       the field, not a paragraph about it. The full text is the title. */
    .list-hint {
      font-size: var(--fs-xs); color: var(--text-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 42ch; min-width: 0;
    }
    @media (max-width: 720px) { .list-hint { display: none; } }

    /* One option per line. A textarea rather than a row of inputs because
       these lists are pasted as often as they are typed — a sector list
       arrives from a spreadsheet column, and thirty-seven states are not
       something anybody enters one field at a time. */
    .list-box {
      width: 100%;
      min-height: 120px;
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      line-height: var(--lh-loose);
      resize: vertical;
    }

    .list-foot {
      display: flex; align-items: center; gap: var(--sp-3);
      flex-wrap: wrap; margin-top: var(--sp-3);
    }
    /* A number, not a sentence — the label above it already says what it
       counts. Gold while it differs from what is saved. */
    .list-count { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-3); }
    .dirty { color: var(--gold-ink); font-weight: var(--fw-semibold); }

    /* Saved. The card says so itself for a moment instead of a toast. */
    @keyframes list-saved {
      0%   { border-color: var(--teal); box-shadow: 0 0 0 3px var(--tint-success, rgba(13, 148, 136, 0.12)); }
      100% { border-color: var(--line-faint); box-shadow: 0 0 0 0 transparent; }
    }
    .card.saved { animation: list-saved var(--duration-normal) var(--ease-out) forwards; animation-duration: 900ms; }
    @media (prefers-reduced-motion: reduce) { .card.saved { animation: none; } }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">Answer lists</h1>
          <p class="page-subtitle">What forms and profiles offer as answers.</p>
        </div>
        <div class="page-actions">
          <a href="/admin/onboarding.html" class="btn btn-sm btn-secondary">Onboarding forms</a>
        </div>
      </div>
    </header>

    <div class="lists" id="lists">
      <div class="card"><div class="skeleton" style="height:120px;width:100%"></div></div>
      <div class="card"><div class="skeleton" style="height:120px;width:100%"></div></div>
    </div>

  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/brand.js"></script>
<script>
  Shell.admin('onboarding');

  let fields = [];

  async function load() {
    try {
      fields = (await api.get('/admin/options')).fields;
      render();
    } catch (err) {
      document.getElementById('lists').innerHTML =
        emptyState({ title: 'Could not load the lists', text: err.message });
    }
  }

  // A textarea holds one option per line. Blank lines and repeats are dropped
  // on the way in by the server, which is the same rule wherever a list is set
  // — so the box can stay forgiving about what gets pasted into it.
  const toLines = options => options.join('\n');
  const fromLines = text => text.split('\n').map(l => l.trim()).filter(Boolean);

  // Saving says so by the card acknowledging it, rather than by a toast
  // sliding in over the next one somebody is about to edit.
  function flash(field) {
    const card = document.querySelector(`[data-field="${field}"]`);
    if (!card) return;
    card.classList.remove('saved');
    void card.offsetWidth;
    card.classList.add('saved');
  }

  function render() {
    document.getElementById('lists').innerHTML = fields.map(f => `
      <section class="card" data-field="${escapeHtml(f.field)}">
        <div class="list-head">
          <span class="list-name">${escapeHtml(f.label)}</span>
          <span class="list-key">${escapeHtml(f.field)}</span>
          ${f.hint ? `<span class="list-hint" title="${escapeHtml(f.hint)}">${escapeHtml(f.hint)}</span>` : ''}
          <span class="spacer"></span>
          ${f.customised ? badge('customised', 'warn') : badge('standard', '')}
        </div>

        <textarea class="input list-box mt-3" data-options spellcheck="false"
          aria-label="${escapeHtml(f.label)} options, one per line">${escapeHtml(toLines(f.options))}</textarea>

        <div class="list-foot">
          <button type="button" class="btn btn-sm btn-primary" data-save data-icon="check" data-icon-size="13">Save</button>
          ${f.customised
            ? '<button type="button" class="btn btn-sm btn-ghost" data-reset data-icon="arrowLeft" data-icon-size="13">Reset</button>'
            : ''}
          <span class="spacer"></span>
          <span class="list-count" data-count>${f.options.length}</span>
        </div>
      </section>`).join('');

    for (const card of document.querySelectorAll('[data-field]')) bind(card);
    Shell.icons(document.getElementById('lists'));
  }

  function bind(card) {
    const field = card.dataset.field;
    const box = card.querySelector('[data-options]');
    const count = card.querySelector('[data-count]');
    const entry = fields.find(f => f.field === field);

    box.addEventListener('input', () => {
      count.textContent = fromLines(box.value).length;
      // Unsaved is worth showing: a list edited and left is a list that still
      // asks yesterday's question. A colour, not a sentence.
      count.classList.toggle('dirty', toLines(entry.options) !== box.value.trim());
    });

    card.querySelector('[data-save]').addEventListener('click', async e => {
      await busy(e.currentTarget, 'Saving…', async () => {
        try {
          const saved = await api.put(`/admin/options/${field}`, { options: fromLines(box.value) });
          Object.assign(entry, { options: saved.options, customised: true });
          render();
          flash(field);
        } catch (err) { showToast(err.message, 'error'); }
      });
    });

    card.querySelector('[data-reset]')?.addEventListener('click', async e => {
      const ok = await Shell.confirm({
        title: `Reset ${entry.label.toLowerCase()}?`,
        text: 'Back to the standard list.',
        ok: 'Reset'
      });
      if (!ok) return;

      await busy(e.currentTarget, 'Resetting…', async () => {
        try {
          const reset = await api.del(`/admin/options/${field}`);
          Object.assign(entry, { options: reset.options, customised: false });
          render();
          flash(field);
        } catch (err) { showToast(err.message, 'error'); }
      });
    });
  }

  load();
</script>
</body>
</html>
