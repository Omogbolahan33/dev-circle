<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Event log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    /* This page is for debugging an integration, so the payload is the point.
       Rows stay compact until you open one. */
    .event { padding: var(--sp-3) 0; border-bottom: 1px solid var(--line-faint); }
    .event:last-child { border-bottom: none; }
    .event-head { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
    .event-type { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--white); }
    .event-source { font-size: var(--fs-xs); }
    .payload {
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--ash);
      background: var(--surface-0);
      border: 1px solid var(--line-faint);
      border-radius: var(--r-md);
      padding: var(--sp-3);
      margin-top: var(--sp-3);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 240px;
      overflow: auto;
    }
    .list { max-width: 860px; }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">Event log</h1>
          <p class="page-subtitle">Everything the connected systems have sent us — Customer.io, Feex, the landing page and the Developer Hub.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-sm btn-secondary" onclick="refresh(this)">Refresh</button>
        </div>
      </div>
    </header>

    <div class="app-body">
      <div class="toolbar">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="pending">Unprocessed</button>
        <button class="chip" data-filter="customer_io">Customer.io</button>
        <button class="chip" data-filter="feex">Feex</button>
        <button class="chip" data-filter="landing_page">Landing page</button>
        <span class="result-count" id="count"></span>
      </div>

      <div class="list" id="list">
        <div class="skeleton" style="width:100%;height:14px;margin-bottom:14px"></div>
        <div class="skeleton" style="width:88%;height:14px;margin-bottom:14px"></div>
        <div class="skeleton" style="width:94%;height:14px;margin-bottom:14px"></div>
        <div class="skeleton" style="width:76%;height:14px;margin-bottom:14px"></div>
        <div class="skeleton" style="width:90%;height:14px;margin-bottom:14px"></div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/survey-theme.js"></script>
<script src="/assets/js/brand.js"></script>
<script>
  Shell.admin('integrations');

  let events = [];
  let filter = 'all';

  async function load() {
    try {
      const data = await api.get('/admin/integration-events?limit=100');
      events = data.events;
      render();
    } catch (err) {
      document.getElementById('list').innerHTML = emptyState({ title: 'Could not load events', text: err.message });
    }
  }

  async function refresh(btn) {
    await busy(btn, 'Refreshing…', () => load());
  }

  function render() {
    let list = events;
    if (filter === 'pending') list = events.filter(e => !e.processed);
    else if (filter !== 'all') list = events.filter(e => e.source === filter);

    document.getElementById('count').textContent = `${list.length} event${list.length === 1 ? '' : 's'}`;

    const el = document.getElementById('list');
    if (!list.length) {
      el.innerHTML = emptyState({
        title: 'No events',
        text: filter === 'all'
          ? 'Nothing has been ingested yet. Events arrive when Customer.io, Feex or the landing page post to the integration endpoints.'
          : 'Nothing matches this filter.'
      });
      return;
    }

    el.innerHTML = list.map((e, i) => {
      let payload = e.payload || '';
      try { payload = JSON.stringify(JSON.parse(e.payload), null, 2); } catch { /* show it raw */ }

      return `
        <article class="event">
          <div class="event-head" onclick="togglePayload(${i})" style="cursor:pointer">
            <span class="badge ${e.source === 'feex' ? 'badge-warn' : e.source === 'customer_io' ? 'badge-info' : 'badge-violet'}">${escapeHtml(e.source)}</span>
            <span class="event-type">${escapeHtml(e.event_type)}</span>
            <span class="spacer"></span>
            ${e.processed ? badge('processed', 'active') : badge('pending', 'warn')}
            <span class="text-xs dim nowrap">${formatDate(e.created_at)}</span>
          </div>
          ${e.error ? `<div class="error-text">${escapeHtml(e.error)}</div>` : ''}
          ${payload ? `<pre class="payload hide" id="payload-${i}">${escapeHtml(payload)}</pre>` : ''}
        </article>`;
    }).join('');
  }

  function togglePayload(i) {
    document.getElementById(`payload-${i}`)?.classList.toggle('hide');
  }

  document.querySelectorAll('.chip[data-filter]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      filter = chip.dataset.filter;
      render();
    });
  });

  load();
</script>
</body>
</html>
