<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <title>Dev Circle — Communications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    /* Two columns: the list of things that get sent, and the one being
       edited. On a phone the editor takes over once something is picked. */
    .comms { display: grid; grid-template-columns: 300px 1fr; gap: var(--sp-6); align-items: start; }
    @media (max-width: 900px) { .comms { grid-template-columns: 1fr; } }

    .flow-list { display: flex; flex-direction: column; gap: 2px; }
    .flow {
      display: block; width: 100%; text-align: left; cursor: pointer;
      padding: var(--sp-3) var(--sp-3); border: 0; border-radius: var(--r-md);
      background: transparent; color: var(--text-2); font: inherit;
    }
    .flow:hover { background: var(--surface-2); color: var(--text); }
    .flow.on { background: var(--surface-2); color: var(--text); }
    .flow-name { display: flex; align-items: center; gap: var(--sp-2); font-weight: var(--fw-semibold); }
    .flow-note { font-size: var(--fs-xs); color: var(--text-3); margin-top: 2px; }
    .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--cd-gold); flex: none; }

    .editor { display: flex; flex-direction: column; gap: var(--sp-5); min-width: 0; }
    .field label { display: block; font-size: var(--fs-sm); font-weight: var(--fw-semibold); margin-bottom: var(--sp-2); }
    .field .hint { margin-top: var(--sp-2); }
    textarea.input { min-height: 90px; resize: vertical; font-family: inherit; line-height: 1.55; }
    textarea.code { min-height: 200px; font-family: var(--font-mono); font-size: var(--fs-xs); }

    .vars { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
    .var {
      font-family: var(--font-mono); font-size: 11px; cursor: pointer;
      padding: 2px 7px; border-radius: var(--r-sm);
      background: var(--blue-dim); color: var(--blue-ink); border: 0;
    }
    .var:hover { background: var(--cd-blue); color: #fff; }

    .advanced summary { cursor: pointer; font-size: var(--fs-sm); color: var(--text-2); padding: var(--sp-2) 0; }
    .advanced[open] summary { margin-bottom: var(--sp-3); }

    .preview-frame {
      width: 100%; height: 620px; border: 1px solid var(--line); border-radius: var(--r-md);
      background: #fff; display: block;
    }
    .subject-line {
      font-size: var(--fs-sm); padding: var(--sp-3); background: var(--surface-2);
      border-radius: var(--r-md); margin-bottom: var(--sp-3);
    }
    .subject-line strong { color: var(--text); }
    .row-actions { display: flex; gap: var(--sp-3); flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">Communications</h1>
          <p class="page-subtitle">What this workspace's automated email says. Anything left blank keeps the wording the platform ships.</p>
        </div>
      </div>
    </header>

    <div class="app-body">
      <div id="body"><div class="skeleton" style="height:320px"></div></div>
    </div>

  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
  // ─── Communications ───────────────────────────────────────
  // What this workspace's automated mail says. Every field is an override and
  // every field is optional: what is left blank keeps whatever the platform
  // ships, which is why an untouched workflow shows placeholder text rather
  // than a copy of the default sitting in an input waiting to drift.

  let state = { workflows: [], current: null, brand: null, circle: null, limits: {} };

  async function load() {
    try {
      const data = await api.get('/admin/email-templates');
      state = { ...state, ...data };
      state.current = state.current || state.workflows[0]?.key;
      render();
    } catch (err) {
      document.getElementById('body').innerHTML =
        emptyState({ title: 'Could not load', text: err.message });
    }
  }

  function render() {
    const flow = state.workflows.find(w => w.key === state.current);
    document.getElementById('body').innerHTML = `
      <div class="comms">
        <div class="card" style="padding:var(--sp-3)">
          <div class="flow-list">
            ${state.workflows.map(w => `
              <button class="flow ${w.key === state.current ? 'on' : ''}" data-flow="${w.key}">
                <span class="flow-name">${escapeHtml(w.label)}${w.customised ? '<span class="pip" title="This workspace has changed this one"></span>' : ''}</span>
                <span class="flow-note">${escapeHtml(w.description)}</span>
              </button>`).join('')}
          </div>
        </div>
        <div class="card">${flow ? editor(flow) : ''}</div>
      </div>`;

    document.querySelectorAll('[data-flow]').forEach(el => {
      el.onclick = () => { state.current = el.dataset.flow; render(); };
    });
    document.getElementById('previewBtn')?.addEventListener('click', preview);
    document.getElementById('saveBtn')?.addEventListener('click', save);
    document.getElementById('resetBtn')?.addEventListener('click', reset);
    document.getElementById('uploadInput')?.addEventListener('change', upload);
    document.querySelectorAll('.var').forEach(el => {
      el.onclick = () => insertVariable(el.dataset.token);
    });
    preview();
  }

  function editor(flow) {
    const o = flow.override || {};
    return `
      <div class="editor">
        <div>
          <h2 class="section-title">${escapeHtml(flow.label)}</h2>
          <p class="section-sub">${escapeHtml(flow.description)}
            ${flow.customised ? '' : ' Nothing here is set, so this sends exactly what the platform ships.'}</p>
        </div>

        <div class="field">
          <label for="subject">Subject line</label>
          <input class="input" id="subject" maxlength="${state.limits.subject || 200}"
                 value="${escapeHtml(o.subject || '')}"
                 placeholder="${escapeHtml(flow.defaultSubject)}">
          <p class="hint">Leave empty to keep the one above.</p>
          <div class="vars">
            ${flow.variables.map(v => `<button class="var" data-token="{{${v}}}">{{${v}}}</button>`).join('')}
          </div>
        </div>

        <div class="field">
          <label for="intro">Opening — before what the template says</label>
          <textarea class="input" id="intro" maxlength="${state.limits.intro || 2000}"
                    placeholder="Optional. A line or two in your own words.">${escapeHtml(o.intro || '')}</textarea>
        </div>

        <div class="field">
          <label for="outro">Closing — after the button</label>
          <textarea class="input" id="outro" maxlength="${state.limits.outro || 2000}"
                    placeholder="Optional. A sign-off, a contact, a caveat.">${escapeHtml(o.outro || '')}</textarea>
        </div>

        <details class="advanced" ${o.body_html ? 'open' : ''}>
          <summary>Replace the whole body</summary>
          <p class="hint" style="margin-bottom:var(--sp-3)">
            Paste or upload HTML to replace what the template writes. The header, the
            button and the footer stay — the footer carries the link people use to
            change what they hear from you, so it is not yours to remove. Scripts and
            event handlers are stripped on save.
          </p>
          <textarea class="input code" id="body" placeholder="&lt;p&gt;Your own markup, using {{variables}}.&lt;/p&gt;">${escapeHtml(o.body_html || '')}</textarea>
          <div class="row-actions" style="margin-top:var(--sp-3)">
            <input type="file" id="uploadInput" accept=".html,.htm,text/html" class="hide">
            <button class="btn btn-sm btn-secondary" onclick="document.getElementById('uploadInput').click()">Upload an .html file</button>
            <span class="hint" id="uploadNote"></span>
          </div>
        </details>

        <div class="row-actions">
          <button class="btn btn-primary" id="saveBtn">Save</button>
          <button class="btn btn-secondary" id="previewBtn">Preview</button>
          ${flow.customised ? '<button class="btn btn-ghost danger" id="resetBtn">Revert to the default</button>' : ''}
        </div>

        <div>
          <div class="subject-line" id="previewSubject"></div>
          <iframe class="preview-frame" id="previewFrame" title="Email preview" sandbox=""></iframe>
        </div>
      </div>`;
  }

  function draft() {
    return {
      subject: document.getElementById('subject')?.value.trim() || null,
      intro: document.getElementById('intro')?.value.trim() || null,
      outro: document.getElementById('outro')?.value.trim() || null,
      body_html: document.getElementById('body')?.value.trim() || null
    };
  }

  function insertVariable(token) {
    const el = document.getElementById('subject');
    if (!el) return;
    const at = el.selectionStart ?? el.value.length;
    el.value = el.value.slice(0, at) + token + el.value.slice(el.selectionEnd ?? at);
    el.focus();
    el.selectionStart = el.selectionEnd = at + token.length;
  }

  async function preview() {
    const frame = document.getElementById('previewFrame');
    if (!frame) return;
    try {
      const res = await api.post(`/admin/email-templates/${state.current}/preview`, draft());
      document.getElementById('previewSubject').innerHTML =
        `Subject: <strong>${escapeHtml(res.subject)}</strong>`;
      // srcdoc with a sandboxed frame: the preview is rendered markup, and it
      // is shown the way a mail client would rather than injected into a page
      // that has a session on it.
      frame.srcdoc = res.html;
    } catch (err) {
      document.getElementById('previewSubject').textContent = err.message;
    }
  }

  async function save() {
    const btn = document.getElementById('saveBtn');
    await busy(btn, 'Saving…', async () => {
      try {
        const res = await api.put(`/admin/email-templates/${state.current}`, draft());
        showToast(res.message);
        await load();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  }

  async function reset() {
    if (!await Shell.confirm({
      title: 'Revert to the default?',
      text: 'This workspace goes back to the wording the platform ships. What you typed here is gone; the default was never a copy, so nothing else changes.'
    })) return;
    try {
      const res = await api.del(`/admin/email-templates/${state.current}`);
      showToast(res.message);
      await load();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function upload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 200_000) {
      showToast('That file is larger than this will hold (200KB)', 'error');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      document.getElementById('body').value = String(reader.result || '');
      document.getElementById('uploadNote').textContent = `${file.name} loaded — preview it, then save.`;
      preview();
    };
    reader.onerror = () => showToast('Could not read that file', 'error');
    reader.readAsText(file);
    e.target.value = '';
  }

  Shell.admin('communications');
  load();
</script>
</body>
</html>
