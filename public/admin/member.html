<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <title>{{brand.product}} — Member</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    .member-id { display: flex; align-items: center; gap: var(--sp-4); }
    .member-name { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-2xl); letter-spacing: -0.03em; }
    .member-meta { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--fs-sm); color: var(--ash); margin-top: var(--sp-1); }

    .panel { display: none; }
    .panel.active { display: block; }

    .quote {
      padding: var(--sp-4) 0;
      border-bottom: 1px solid var(--line-faint);
    }
    .quote:last-child { border-bottom: none; }
    .quote-text { font-size: var(--fs-sm); line-height: var(--lh-loose); margin-bottom: var(--sp-2); }
    .quote-meta { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--fs-xs); color: var(--ash-dim); }

    /* Consent is a compliance surface: state is spelled out, never implied. */
    .consent-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-2) 0; font-size: var(--fs-sm); }
    .consent-row .channel { text-transform: capitalize; color: var(--ash); }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="breadcrumb">
        <a href="/admin/members.html">Members</a>
        <span class="sep">/</span>
        <span id="crumbName">…</span>
      </div>

      <div class="page-head-row">
        <div class="member-id" id="identity">
          <div class="skeleton" style="width:56px;height:56px;border-radius:50%"></div>
          <div>
            <div class="skeleton" style="width:180px;height:22px;margin-bottom:8px"></div>
            <div class="skeleton" style="width:240px"></div>
          </div>
        </div>
        <div class="page-actions" id="actions"></div>
      </div>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-panel="everything">Everything</button>
        <button class="tab" data-panel="activity">Activity</button>
        <button class="tab" data-panel="surveys">Surveys</button>
        <button class="tab" data-panel="feedback">Feedback</button>
        <button class="tab" data-panel="rewards">Rewards</button>
        <button class="tab" data-panel="deliveries">Messages</button>
      </nav>
    </header>

    <div class="app-body">
      <div class="split">

        <!-- Identity rail: who this person is, and what we are allowed to do. -->
        <aside class="rail">
          <section class="card">
            <div class="card-title mb-4">Details</div>
            <div class="kv" id="details">
              <div class="kv-row"><span class="kv-key">Phone</span><span class="kv-val"><div class="skeleton" style="width:120px;height:12px"></div></span></div>
              <div class="kv-row"><span class="kv-key">Sector</span><span class="kv-val"><div class="skeleton" style="width:90px;height:12px"></div></span></div>
              <div class="kv-row"><span class="kv-key">State</span><span class="kv-val"><div class="skeleton" style="width:70px;height:12px"></div></span></div>
            </div>
          </section>

          <section class="card">
            <div class="card-title mb-4">Cohorts</div>
            <div class="row wrap" style="gap:var(--sp-2)" id="cohorts"><div class="skeleton" style="width:80px;height:22px"></div><div class="skeleton" style="width:60px;height:22px"></div></div>
          </section>

          <section class="card">
            <div class="card-title mb-4">Consent</div>
            <div id="consent"><div class="skeleton" style="width:60%;height:12px;margin-bottom:10px"></div><div class="skeleton" style="width:45%;height:12px"></div></div>
          </section>

          <section class="card">
            <div class="card-title mb-4">Preferences</div>
            <div class="kv" id="preferences"><div class="kv-row"><span class="kv-key">Channels</span><span class="kv-val"><div class="skeleton" style="width:100px;height:12px"></div></span></div></div>
          </section>
        </aside>

        <!-- Everything this developer did and said, in one stream. Reading
             it across three tabs and stitching the order together in your head
             was what made a person hard to see whole. -->
        <div>
          <div class="panel active" id="panel-everything">
            <div class="ev-summary" id="everythingSummary"><div class="skeleton" style="width:55%;height:14px"></div></div>
            <div class="ev-stream" id="everything"><div class="skeleton" style="width:100%;height:60px;margin-bottom:14px"></div><div class="skeleton" style="width:88%;height:60px"></div></div>
          </div>

          <div class="panel" id="panel-activity">
            <div class="timeline" id="activity"><div class="skeleton" style="width:70%;height:14px;margin-bottom:12px"></div><div class="skeleton" style="width:55%;height:14px"></div></div>
          </div>

          <div class="panel" id="panel-surveys">
            <div class="table-shell">
              <div class="table-scroll">
                <table class="data-table">
                  <thead><tr><th>Survey</th><th>State</th><th>When</th></tr></thead>
                  <tbody id="surveys"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="panel" id="panel-feedback">
            <div id="feedback"></div>
          </div>

          <div class="panel" id="panel-rewards">
            <div class="table-shell">
              <div class="table-scroll">
                <table class="data-table">
                  <thead><tr><th>Reward</th><th>Value</th><th>Claimed</th><th>Delivered</th></tr></thead>
                  <tbody id="rewards"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="panel" id="panel-deliveries">
            <div class="table-shell">
              <div class="table-scroll">
                <table class="data-table">
                  <thead><tr><th>Message</th><th>Channel</th><th>Outcome</th><th>When</th></tr></thead>
                  <tbody id="deliveries"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/survey-theme.js"></script>
<script src="/assets/js/brand.js"></script>
<script src="/assets/js/activity.js"></script>
<script>
  Shell.admin('members');

  const memberId = param('id');
  if (!memberId) window.location.href = '/admin/members.html';

  let member = null;

  async function load() {
    try {
      const data = await api.get(`/admin/members/${memberId}`);
      member = data;
      renderIdentity(data);
      renderRail(data);
      renderActivity(data.engagement);
      renderSurveys(data.survey_responses);
      renderFeedback(data.feedback);
      loadEverything(memberId);
      renderRewards(data.gifts);
      renderDeliveries(data.deliveries);
    } catch (err) {
      document.querySelector('.app-body').innerHTML = emptyState({ title: 'Could not load this member', text: err.message });
    }
  }

  function renderIdentity({ user: u, engagement }) {
    document.getElementById('crumbName').textContent = u.name;
    document.title = `{{brand.product}} — ${u.name}`;

    // Rings show engagement depth at a glance, the way orbit levels do.
    document.getElementById('identity').innerHTML = `
      ${orbitAvatar(u.name, orbitLevel(u.engagement_streak), 'avatar-lg' + (u.api_status === 'production' ? ' avatar-teal' : ' avatar-gold'))}
      <div>
        <div class="member-name">${escapeHtml(u.name)}</div>
        <div class="member-meta">
          <span>${escapeHtml(u.email)}</span>
          ${u.company ? `<span>·</span><span>${escapeHtml(u.company)}</span>` : ''}
          ${badge(u.api_status, u.api_status)}
          ${u.kyb_completed ? badge('KYB done', 'active') : badge('KYB pending', 'warn')}
          ${u.status !== 'active' ? badge(u.status, 'suspended') : ''}
          ${u.engagement_streak ? `<span class="streak">${u.engagement_streak}d streak</span>` : ''}
        </div>
      </div>`;

    document.getElementById('actions').innerHTML = `
      <button class="btn btn-sm btn-secondary" onclick="signOutEverywhere(this)">Sign out everywhere</button>
      <button class="btn btn-sm ${u.status === 'active' ? 'btn-danger' : 'btn-primary'}"
              onclick="toggleStatus('${u.status}', this)">${u.status === 'active' ? 'Deactivate' : 'Activate'}</button>`;
  }

  function renderRail({ user: u, cohorts, consent }) {
    document.getElementById('details').innerHTML = `
      <div class="kv-row">
        <span class="kv-key">Phone</span>
        <span class="kv-val">
          ${u.phone
            ? escapeHtml(u.phone)
            : '<span style="color:var(--rose-ink)">None — they cannot sign in</span>'}
          <button class="btn btn-sm btn-ghost" onclick="editPhone()">${u.phone ? 'Change' : 'Add'}</button>
        </span>
      </div>
      <div class="kv-row"><span class="kv-key">Sector</span><span class="kv-val">${escapeHtml(u.work_sector || '—')}</span></div>
      <div class="kv-row"><span class="kv-key">State</span><span class="kv-val">${escapeHtml(u.location_state || '—')}</span></div>
      <div class="kv-row"><span class="kv-key">Products</span><span class="kv-val">${(u.api_products || []).length ? (u.api_products).map(p => escapeHtml(p)).join(', ') : '—'}</span></div>
      <div class="kv-row"><span class="kv-key">Hub ID</span><span class="kv-val mono text-xs">${escapeHtml(u.dev_hub_user_id || 'Not linked')}</span></div>
      <div class="kv-row"><span class="kv-key">Joined</span><span class="kv-val">${formatDate(u.created_at)}</span></div>
      <div class="kv-row"><span class="kv-key">Last active</span><span class="kv-val">${formatDate(u.last_active_at)}</span></div>
      <div class="kv-row"><span class="kv-key">Best streak</span><span class="kv-val">${u.best_streak || 0} days</span></div>`;

    document.getElementById('cohorts').innerHTML = cohorts.length
      ? cohorts.map(c => `<a class="tag" style="background:${c.color}1F;color:${c.color}" href="/admin/cohort-detail.html?id=${c.id}">${escapeHtml(c.name)}</a>`).join('')
      : '<span class="dim text-sm">Not in any cohort</span>';

    const tone = { granted: 'var(--emerald)', withdrawn: 'var(--rose)', pending: 'var(--cd-gold)' };
    document.getElementById('consent').innerHTML = consent.length
      ? consent.map(c => `
        <div class="consent-row">
          <span class="channel">${escapeHtml(c.channel.replace('_', '-'))}</span>
          <span style="color:${tone[c.status]}">${c.status}</span>
        </div>`).join('')
      : '<span class="dim text-sm">No consent on record</span>';

    const days = (u.preferred_days || []).length ? u.preferred_days.join(', ') : 'Any day';
    const channels = (u.preferred_channels || []).length ? u.preferred_channels.join(', ') : 'No preference';
    document.getElementById('preferences').innerHTML = `
      <div class="kv-row"><span class="kv-key">Channels</span><span class="kv-val">${escapeHtml(channels)}</span></div>
      <div class="kv-row"><span class="kv-key">Days</span><span class="kv-val">${escapeHtml(days)}</span></div>
      <div class="kv-row"><span class="kv-key">Hours</span><span class="kv-val mono text-xs">${escapeHtml(u.preferred_time_start || '—')}–${escapeHtml(u.preferred_time_end || '—')}</span></div>`;
  }

  function renderActivity(events) {
    const el = document.getElementById('activity');
    if (!events.length) {
      el.innerHTML = emptyState({ title: 'No activity recorded', text: 'Events land here as this member integrates, responds and claims rewards.' });
      return;
    }

    let lastDay = null;
    el.innerHTML = events.map(e => {
      const info = activityInfo(e.type);
      const day = activityDayLabel(e.created_at);
      const divider = day !== lastDay ? `<div class="tl-divider">${day}</div>` : '';
      lastDay = day;
      const from = e.source && !['dev_circle', 'system'].includes(e.source)
        ? `<span class="badge">${escapeHtml(e.source.replace('_', '.'))}</span>` : '';
      return `
        ${divider}
        <div class="tl-item">
          <div class="tl-dot ${info.tone}"></div>
          <div class="tl-head">
            <span class="tl-title">${info.text.charAt(0).toUpperCase() + info.text.slice(1)}</span>
            ${from}
            <span class="tl-time">${formatDate(e.created_at)}</span>
          </div>
        </div>`;
    }).join('');
  }

  function renderSurveys(responses) {
    document.getElementById('surveys').innerHTML = responses.length
      ? responses.map(r => `
        <tr class="row-link" onclick="window.location.href='/admin/survey-responses.html?id=${r.survey_id}'">
          <td>${escapeHtml(r.survey_title)}</td>
          <td>${r.completed_at ? badge('completed', 'active') : badge('invited', 'inactive')}</td>
          <td class="text-xs muted">${formatDate(r.completed_at || r.created_at)}</td>
        </tr>`).join('')
      : `<tr><td colspan="3">${emptyState({ title: 'No surveys yet', text: 'This member has not been invited to a survey.' })}</td></tr>`;
  }

  const FEEDBACK_SOURCES = {
    dev_circle: 'Said in {{brand.product}}', survey: 'Answered in a survey',
    feex: 'Raised through Feex', customer_io: 'Via Customer.io'
  };

  // One list, whatever the source: what they wrote unprompted, what they
  // answered in a survey, and what they raised through support.
  function renderFeedback(items) {
    document.getElementById('feedback').innerHTML = items.length
      ? items.map(f => `
        <div class="quote">
          ${f.prompt ? `<p class="quote-prompt">${escapeHtml(f.prompt)}</p>` : ''}
          <p class="quote-text">${escapeHtml(f.content)}</p>
          <div class="quote-meta">
            <span>${FEEDBACK_SOURCES[f.source] || f.source}</span>
            ${f.source === 'survey' && f.survey_title ? `<span>${escapeHtml(f.survey_title)}</span>` : ''}
            ${f.source !== 'survey' && f.category ? `<span>${escapeHtml(f.category)}</span>` : ''}
            ${f.source === 'survey' ? '' : badge(f.status, f.status === 'open' ? 'warn' : f.status === 'resolved' ? 'active' : 'inactive')}
            ${f.external_ticket_id ? `<span class="mono">${escapeHtml(f.external_ticket_id)}</span>` : ''}
            <span>${formatDate(f.created_at)}</span>
          </div>
        </div>`).join('')
      : emptyState({ title: 'Nothing said yet', text: 'What this member writes in {{brand.product}}, answers in a survey, or raises through Feex collects here.' });
  }

  function renderRewards(gifts) {
    document.getElementById('rewards').innerHTML = gifts.length
      ? gifts.map(g => `
        <tr>
          <td>${escapeHtml(g.name)}</td>
          <td class="mono">${money(g.value, g.currency)}</td>
          <td class="text-xs muted">${formatDate(g.claimed_at)}</td>
          <td>${g.delivered_at ? `<span class="text-xs muted">${formatDate(g.delivered_at)}</span>` : badge('pending', 'warn')}</td>
        </tr>`).join('')
      : `<tr><td colspan="4">${emptyState({ title: 'No rewards claimed', text: 'Rewards this member claims will be listed here with their delivery state.' })}</td></tr>`;
  }

  // Why a message did or did not arrive — the honest record behind a broadcast.
  function renderDeliveries(deliveries) {
    document.getElementById('deliveries').innerHTML = deliveries.length
      ? deliveries.map(d => `
        <tr>
          <td class="text-xs">${escapeHtml((d.source_type || '').replace('_', ' '))}</td>
          <td class="text-xs muted">${escapeHtml(d.channel)}</td>
          <td>
            ${badge(d.status, d.status === 'delivered' ? 'active' : d.status === 'failed' ? 'danger' : 'warn')}
            ${d.reason ? `<span class="dim text-xs"> ${escapeHtml(d.reason)}</span>` : ''}
          </td>
          <td class="text-xs muted">${formatDate(d.created_at)}</td>
        </tr>`).join('')
      : `<tr><td colspan="4">${emptyState({ title: 'No messages sent', text: 'Broadcasts, invitations and reminders sent to this member are logged here.' })}</td></tr>`;
  }

  // ─── Actions ────────────────────────────────────────────
  async function toggleStatus(current, btn) {
    const next = current === 'active' ? 'inactive' : 'active';
    const ok = await Shell.confirm({
      title: next === 'inactive' ? 'Deactivate this member?' : 'Reactivate this member?',
      text: next === 'inactive'
        ? 'They keep their history but cannot sign in, and drop out of broadcasts and survey audiences.'
        : 'They regain access to {{brand.product}} and re-enter survey audiences.',
      ok: next === 'inactive' ? 'Deactivate' : 'Activate',
      danger: next === 'inactive'
    });
    if (!ok) return;

    await busy(btn, next === 'inactive' ? 'Deactivating…' : 'Activating…', async () => {
      try {
        await api.put(`/admin/members/${memberId}`, { status: next });
        showToast(`Member ${next === 'active' ? 'activated' : 'deactivated'}`);
        load();
      } catch (err) { showToast(err.message, 'error'); }
    });
  }

  // ─── The number they sign in with ─────────────────────────
  // Not an ordinary contact detail. A member signs in with their email address
  // and the last six digits of this, so an account with no number on it is an
  // account nobody can get into — and this is the only way to fix that.
  //
  // Members reach that state through four doors that have never required a
  // number: Developer Hub SSO, the landing-page ingest, a spreadsheet import,
  // and an administrator typing somebody in.
  async function editPhone() {
    const current = member?.user?.phone || '';
    const given = window.prompt(
      'Phone number for this member.\n\n' +
      'Its last six digits are what they sign in with, alongside their email ' +
      'address — so changing it changes their credential. Tell them.',
      current
    );
    if (given === null) return;

    try {
      await api.put(`/admin/members/${memberId}`, { phone: given.trim() });
      showToast(given.trim() ? 'Phone number saved — that is what they sign in with now' : 'Phone number cleared');
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  // Members hold no password — they sign in with their address and the last six
  // digits of their number — so the recovery action is ending their live
  // sessions, not issuing a credential.
  async function signOutEverywhere(btn) {
    const ok = await Shell.confirm({
      title: 'Sign this member out everywhere?',
      text: 'Every device they are signed in on stops working immediately. They can sign back in ' +
            'with their email address and the last six digits of their phone number.',
      ok: 'Sign out'
    });
    if (!ok) return;

    await busy(btn, 'Signing out…', async () => {
      try {
        await api.post(`/admin/members/${memberId}/sign-out`, {});
        showToast('Signed out of every device');
      } catch (err) { showToast(err.message, 'error'); }
    });
  }

  // ─── Tabs ───────────────────────────────────────────────
  // ─── Everything ─────────────────────────────────────────
  const EVENT_WORDS = {
    account_created: 'Joined {{brand.product}}',
    api_key_generated: 'Generated an API key',
    first_sandbox_call: 'First sandbox call',
    first_production_call: 'Went live in production',
    kyb_completed: 'Completed KYB',
    product_requested: 'Asked for another API product',
    survey_invited: 'Invited to a survey',
    survey_started: 'Started a survey',
    survey_completed: 'Completed a survey',
    survey_reminded: 'Reminded about a survey',
    feedback_submitted: 'Sent feedback',
    complaint_received: 'Raised a complaint',
    complaint_resolved: 'Complaint closed in Feex',
    gift_claimed: 'Claimed a reward',
    gift_delivered: 'Reward delivered',
    message_sent: 'We messaged them',
    message_read: 'Read a message',
    consent_granted: 'Granted consent',
    consent_withdrawn: 'Withdrew consent'
  };

  const SAID_WHERE = {
    dev_circle: 'unprompted, in {{brand.product}}',
    survey: 'in a survey',
    external_survey: 'in a form run elsewhere',
    feex: 'through Feex support',
    customer_io: 'via Customer.io'
  };

  async function loadEverything(id) {
    const stream = document.getElementById('everything');
    try {
      const data = await api.get(`/admin/members/${id}/timeline`);
      const c = data.counts;

      document.getElementById('everythingSummary').innerHTML = `
        <span><strong>${c.said}</strong> thing${c.said === 1 ? '' : 's'} said</span>
        <span><strong>${c.questions_answered}</strong> question${c.questions_answered === 1 ? '' : 's'} answered</span>
        <span><strong>${c.did}</strong> milestone${c.did === 1 ? '' : 's'}</span>
        <span><strong>${c.sent}</strong> message${c.sent === 1 ? '' : 's'} sent to them</span>`;

      if (!data.timeline.length) {
        stream.innerHTML = emptyState({ title: 'Nothing yet', text: 'What this developer does and says will collect here.' });
        return;
      }

      stream.innerHTML = data.timeline.map(e => {
        if (e.kind === 'said') {
          // What they wrote is the thing worth reading, so it gets the weight
          return `
            <div class="ev ev-said">
              <div class="ev-when">${formatDate(e.at)}</div>
              <div class="ev-body">
                ${e.prompt ? `<div class="ev-prompt">${escapeHtml(e.prompt)}</div>` : ''}
                <p class="ev-quote">${escapeHtml(e.content)}</p>
                <div class="ev-meta">
                  <span>${SAID_WHERE[e.source] || e.source}</span>
                  ${e.detail ? `<span>${escapeHtml(e.detail)}</span>` : ''}
                  ${e.ticket ? `<span class="mono">${escapeHtml(e.ticket)}</span>` : ''}
                  ${e.question_id ? `<a href="/admin/feedback.html#q-${e.question_id}">see everyone's answers</a>` : ''}
                </div>
              </div>
            </div>`;
        }

        const label = e.kind === 'sent'
          ? `We sent a ${escapeHtml(e.label)} by ${escapeHtml(e.channel)}`
          : (EVENT_WORDS[e.type] || escapeHtml(e.label));

        return `
          <div class="ev ev-${e.kind}">
            <div class="ev-when">${formatDate(e.at)}</div>
            <div class="ev-body">
              <div class="ev-line">${label}${e.detail ? ` <span class="ev-detail">${escapeHtml(e.detail)}</span>` : ''}</div>
            </div>
          </div>`;
      }).join('');
    } catch (err) {
      stream.innerHTML = emptyState({ title: 'Could not load', text: err.message });
    }
  }

  document.querySelectorAll('.tab[data-panel]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
  });

  load();
</script>
</body>
</html>
