<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Roles &amp; access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    .panel { display: none; }
    .panel.active { display: block; }

    .role { padding: var(--sp-5) 0; border-bottom: 1px solid var(--line-faint); }
    .role:last-child { border-bottom: none; }
    .role-head { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-2); }
    .role-name { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-base); }
    .role-desc { font-size: var(--fs-sm); color: var(--ash); margin-bottom: var(--sp-3); }
    .perms { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

    /* Permission picker: grouped by area so a role is assembled by capability,
       not by scanning a flat list of dotted keys. */
    .perm-group-label { font-size: var(--fs-xs); color: var(--ash-dim); text-transform: uppercase; letter-spacing: 0.08em; margin: var(--sp-4) 0 var(--sp-2); }
    .perm-option { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2); border-radius: var(--r-md); cursor: pointer; font-size: var(--fs-sm); }
    .perm-option:hover { background: rgba(160, 160, 184, 0.05); }
    .list { max-width: 780px; }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">Roles &amp; access</h1>
          <p class="page-subtitle">What each kind of operator is allowed to do. Permissions here are the same ones the API enforces.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-sm btn-primary" onclick="openCreate()">New role</button>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab active" data-panel="roles">Roles</button>
        <button class="tab" data-panel="admins">Administrators</button>
      </nav>
    </header>

    <div class="app-body">
      <div class="panel active" id="panel-roles">
        <div class="list" id="roles"></div>
      </div>

      <div class="panel" id="panel-admins">
        <div class="table-shell">
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Administrator</th><th>Role</th><th>Status</th><th>Added</th></tr></thead>
              <tbody id="admins"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<aside class="drawer" id="roleDrawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">New role</div>
      <div class="drawer-sub">Pick the capabilities this role should carry</div>
    </div>
    <button class="icon-btn" onclick="Shell.closeDrawer('roleDrawer')">×</button>
  </div>
  <div class="drawer-body">
    <div class="field">
      <label class="label">Name</label>
      <input type="text" class="input" id="rName" placeholder="e.g. Engagement lead">
    </div>
    <div class="field">
      <label class="label">Description</label>
      <input type="text" class="input" id="rDesc" placeholder="Who holds this role, and why">
    </div>
    <div class="field">
      <label class="label">Permissions</label>
      <div id="permPicker"></div>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn btn-secondary" onclick="Shell.closeDrawer('roleDrawer')">Cancel</button>
    <button class="btn btn-primary" onclick="createRole()">Create role</button>
  </div>
</aside>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
  Shell.admin('roles');

  // The catalogue comes from the server, which is also what enforces these
  // permissions — a hardcoded copy here would drift out of sync and let
  // someone build a role around a permission that no longer gates anything.
  let PERM_LABELS = { '*': 'Full access' };
  let PERM_GROUPS = {};

  async function loadPermissions() {
    const data = await api.get('/admin/permissions');
    PERM_LABELS = { '*': 'Full access' };
    data.permissions.forEach(p => { PERM_LABELS[p.key] = p.label; });
    PERM_GROUPS = { 'Full access': [{ key: '*', label: 'Full access' }], ...data.grouped };
  }

  async function loadRoles() {
    const data = await api.get('/admin/roles');
    const el = document.getElementById('roles');

    el.innerHTML = data.roles.length ? data.roles.map(r => `
      <article class="role">
        <div class="role-head">
          <span class="role-name">${escapeHtml(r.name)}</span>
          ${r.is_system ? badge('system', 'info') : ''}
          <span class="spacer"></span>
          <span class="dim text-xs">${r.permissions.length} permission${r.permissions.length === 1 ? '' : 's'}</span>
        </div>
        <p class="role-desc">${escapeHtml(r.description || 'No description')}</p>
        <div class="perms">
          ${r.permissions.map(p => `<span class="tag${p === '*' ? ' badge-info' : ''}">${escapeHtml(PERM_LABELS[p] || p)}</span>`).join('')}
        </div>
      </article>`).join('')
      : emptyState({
          title: 'No roles yet',
          text: 'A role bundles permissions so you can hand someone exactly the access they need.',
          action: '<button class="btn btn-sm btn-primary" onclick="openCreate()">Create a role</button>'
        });
  }

  async function loadAdmins() {
    try {
      const data = await api.get('/admin/admins');
      document.getElementById('admins').innerHTML = data.admins.length
        ? data.admins.map(a => `
          <tr>
            <td>${identityCell(a.name, a.email)}</td>
            <td class="text-sm">${escapeHtml(a.role_name || '—')}</td>
            <td>${badge(a.status, a.status === 'active' ? 'active' : 'inactive')}</td>
            <td class="text-xs muted">${formatDate(a.created_at)}</td>
          </tr>`).join('')
        : `<tr><td colspan="4">${emptyState({ title: 'No administrators listed' })}</td></tr>`;
    } catch (err) {
      document.getElementById('admins').innerHTML =
        `<tr><td colspan="4">${emptyState({ title: 'Could not load administrators', text: err.message })}</td></tr>`;
    }
  }

  function openCreate() {
    document.getElementById('rName').value = '';
    document.getElementById('rDesc').value = '';

    document.getElementById('permPicker').innerHTML = Object.entries(PERM_GROUPS).map(([group, perms]) => `
      <div class="perm-group-label">${escapeHtml(group)}</div>
      ${perms.map(p => `
        <label class="perm-option" data-perm="${escapeHtml(p.key)}">
          <span class="check"></span>
          <span>${escapeHtml(p.label)}</span>
        </label>`).join('')}`).join('');

    document.querySelectorAll('.perm-option').forEach(opt => {
      opt.addEventListener('click', e => {
        e.preventDefault();
        opt.querySelector('.check').classList.toggle('on');
        opt.querySelector('.check').textContent = opt.querySelector('.check').classList.contains('on') ? '✓' : '';
      });
    });

    Shell.openDrawer('roleDrawer');
  }

  async function createRole() {
    const name = document.getElementById('rName').value.trim();
    if (!name) { showToast('Name required', 'warning'); return; }

    const permissions = Array.from(document.querySelectorAll('.perm-option'))
      .filter(el => el.querySelector('.check').classList.contains('on'))
      .map(el => el.dataset.perm);

    if (!permissions.length) { showToast('Select at least one permission', 'warning'); return; }

    try {
      await api.post('/admin/roles', {
        name,
        description: document.getElementById('rDesc').value.trim(),
        permissions
      });
      Shell.closeDrawer('roleDrawer');
      showToast(`Role "${name}" created`);
      loadRoles();
    } catch (err) { showToast(err.message, 'error'); }
  }

  document.querySelectorAll('.tab[data-panel]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
  });

  // Permissions must load before roles render, since role chips label
  // themselves from the catalogue.
  loadPermissions()
    .then(() => Promise.all([loadRoles(), loadAdmins()]))
    .catch(err => showToast(err.message, 'error'));
</script>
</body>
</html>
