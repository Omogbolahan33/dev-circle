<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Roles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <style>
    .topnav { position:sticky;top:0;z-index:100;background:var(--ink);border-bottom:1px solid rgba(160,160,184,0.06);padding:0 var(--sp-6); }
    .topnav-inner { max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px; }
    .topnav-logo { font-family:var(--font-display);font-weight:var(--fw-black);font-size:var(--fs-md);letter-spacing:-0.03em;color:var(--white);text-decoration:none; }
    .topnav-logo span { color:var(--cd-blue); }
    .topnav-logo .badge { font-family:var(--font-mono);font-size:10px;color:var(--cd-blue);background:var(--cd-blue-dim);padding:2px 6px;border-radius:var(--r-sm);margin-left:var(--sp-2); }
    .topnav-back { font-size:var(--fs-sm);color:var(--ash);text-decoration:none; }
    .topnav-back:hover { color:var(--white); }

    .page { max-width:960px;margin:0 auto;padding:var(--sp-8) var(--sp-6); }
    .page-header { margin-bottom:var(--sp-8); }
    .page-title { font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-2xl);letter-spacing:-0.03em;margin-bottom:var(--sp-1); }
    .page-subtitle { color:var(--ash);font-size:var(--fs-sm); }
    .page-actions { display:flex;gap:var(--sp-2);margin-top:var(--sp-4); }

    .section { margin-bottom:var(--sp-10); }
    .section-title { font-family:var(--font-display);font-weight:var(--fw-semibold);font-size:var(--fs-md);letter-spacing:-0.01em;margin-bottom:var(--sp-4); }

    .role-card {
      background:var(--slate);border:1px solid rgba(160,160,184,0.06);border-radius:var(--r-lg);
      padding:var(--sp-5);margin-bottom:var(--sp-3);
    }
    .role-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-2); }
    .role-name { font-family:var(--font-display);font-weight:var(--fw-semibold);font-size:var(--fs-md); }
    .role-desc { font-size:var(--fs-sm);color:var(--ash);margin-bottom:var(--sp-3); }
    .role-meta { font-size:var(--fs-xs);color:var(--ash-dim);font-family:var(--font-mono); }

    .perm-grid { display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-top:var(--sp-2); }
    .perm-tag {
      font-size:10px;font-family:var(--font-mono);padding:2px 8px;border-radius:var(--r-sm);
      background:rgba(160,160,184,0.06);color:var(--ash);
    }
    .perm-tag.wildcard { background:var(--cd-blue-dim);color:var(--cd-blue); }

    .btn { display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);font-family:var(--font-body);font-size:var(--fs-sm);font-weight:var(--fw-medium);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-md);transition:all var(--duration-fast) var(--ease-out);white-space:nowrap;cursor:pointer;border:none; }
    .btn-primary { background:var(--cd-blue);color:var(--white); }
    .btn-primary:hover { background:var(--cd-blue-deep); }
    .btn-secondary { background:none;color:var(--ash);border:1px solid rgba(160,160,184,0.10); }
    .btn-secondary:hover { color:var(--white);border-color:rgba(160,160,184,0.25); }
    .btn-ghost { background:none;color:var(--ash);border:none; }
    .btn-ghost:hover { color:var(--white); }
    .btn-sm { font-size:var(--fs-xs);padding:var(--sp-1) var(--sp-3); }

    .modal-overlay { display:none;position:fixed;inset:0;z-index:999;background:rgba(26,26,46,0.85);align-items:center;justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:var(--slate);border-radius:var(--r-lg);padding:var(--sp-6);max-width:520px;width:90%;max-height:80vh;overflow-y:auto; }
    .modal-title { font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-lg);margin-bottom:var(--sp-5); }
    .form-group { margin-bottom:var(--sp-4); }
    .form-label { display:block;font-size:var(--fs-xs);font-weight:var(--fw-medium);color:var(--ash);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:var(--sp-1); }
    .form-input { width:100%;background:var(--ink);border:1px solid rgba(160,160,184,0.10);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);color:var(--white);font-size:var(--fs-sm); }
    .form-input:focus { border-color:var(--cd-blue);outline:none; }
    textarea.form-input { min-height:60px;font-family:var(--font-body);resize:vertical; }

    .check-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--sp-2); }
    .check-item {
      display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);
      border:1px solid rgba(160,160,184,0.06);border-radius:var(--r-md);cursor:pointer;
      font-size:var(--fs-xs);font-family:var(--font-mono);transition:all var(--duration-fast) var(--ease-out);user-select:none;
    }
    .check-item:hover { border-color:rgba(160,160,184,0.15); }
    .check-item.selected { border-color:var(--cd-blue);background:var(--cd-blue-dim);color:var(--white); }
    .check-item input { display:none; }
    .check-dot { width:12px;height:12px;border-radius:50%;border:2px solid rgba(160,160,184,0.20);transition:all var(--duration-fast) var(--ease-out);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .check-item.selected .check-dot { border-color:var(--cd-blue);background:var(--cd-blue); }
    .check-item.selected .check-dot::after { content:'';width:5px;height:5px;border-radius:50%;background:white; }

    @media (max-width:640px) { .page{padding:var(--sp-6) var(--sp-4);} .page-title{font-size:var(--fs-xl);} .check-grid{grid-template-columns:1fr 1fr;} }
  </style>
</head>
<body>

  <nav class="topnav">
    <div class="topnav-inner">
      <a href="/admin/dashboard.html" class="topnav-logo">dev<span>.</span>circle <span class="badge">Admin</span></a>
      <a href="/admin/dashboard.html" class="topnav-back">← Back</a>
    </div>
  </nav>

  <div class="page">
    <header class="page-header">
      <h1 class="page-title">Roles & permissions</h1>
      <p class="page-subtitle">Define what each admin role can do. Create custom roles for different team functions.</p>
      <div class="page-actions">
        <button class="btn btn-sm btn-primary" onclick="showCreateModal()">+ New role</button>
      </div>
    </header>

    <section class="section">
      <div id="rolesList"></div>
    </section>
  </div>

  <div class="modal-overlay" id="createModal">
    <div class="modal-box">
      <h3 class="modal-title">Create role</h3>
      <div class="form-group">
        <label class="form-label">Name</label>
        <input type="text" class="form-input" id="rName" placeholder="e.g. Survey Manager">
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-input" id="rDesc" placeholder="What this role does"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Permissions</label>
        <div class="check-grid" id="permGrid"></div>
      </div>
      <div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4)">
        <button class="btn btn-secondary" onclick="closeModal('createModal')">Cancel</button>
        <button class="btn btn-primary" onclick="createRole()">Create</button>
      </div>
    </div>
  </div>

<script src="/assets/js/api.js"></script>
<script>
  if (!Auth.requireAuth(true)) throw new Error('Redirecting');

  // The catalogue comes from the server, which is also what enforces these
  // permissions — a hardcoded copy here would drift out of sync and let
  // someone build a role around a permission that no longer gates anything.
  let ALL_PERMS = ['*'];
  let PERM_LABELS = { '*': 'Full access' };
  let PERM_GROUPS = {};

  async function loadPermissions() {
    const data = await api.get('/admin/permissions');
    ALL_PERMS = ['*', ...data.permissions.map(p => p.key)];
    PERM_LABELS = { '*': 'Full access' };
    data.permissions.forEach(p => { PERM_LABELS[p.key] = p.label; });
    PERM_GROUPS = { 'Full access': [{ key: '*', label: 'Full access' }], ...data.grouped };
  }

  async function loadRoles() {
    try {
      const data = await api.get('/admin/roles');
      const container = document.getElementById('rolesList');

      container.innerHTML = data.roles.length ? data.roles.map(r => `
        <div class="role-card">
          <div class="role-header">
            <span class="role-name">${escapeHtml(r.name)}</span>
            ${r.is_system ? '<span class="role-meta">System</span>' : ''}
          </div>
          <div class="role-desc">${escapeHtml(r.description || 'No description')}</div>
          <div class="perm-grid">
            ${r.permissions.map(p => `<span class="perm-tag ${p === '*' ? 'wildcard' : ''}">${PERM_LABELS[p] || p}</span>`).join('')}
          </div>
        </div>
      `).join('') : '<div style="color:var(--ash-dim);text-align:center;padding:var(--sp-8)">No roles created yet.</div>';
    } catch (err) {
      showToast('Failed to load roles', 'error');
    }
  }

  function showCreateModal() {
    document.getElementById('createModal').classList.add('open');
    document.getElementById('rName').focus();

    // Grouped by area so a role is assembled by capability, not by scanning a
    // flat list of dotted keys
    document.getElementById('permGrid').innerHTML = Object.entries(PERM_GROUPS).map(([group, perms]) => `
      <div style="grid-column:1/-1;font-size:var(--fs-xs);color:var(--ash-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:var(--sp-2)">${group}</div>
      ${perms.map(p => `
        <label class="check-item" data-perm="${p.key}" onclick="this.classList.toggle('selected')">
          <div class="check-dot"></div>
          ${p.label}
        </label>`).join('')}
    `).join('');
  }

  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  async function createRole() {
    const name = document.getElementById('rName').value.trim();
    if (!name) { showToast('Name required', 'warning'); return; }

    const permissions = Array.from(document.querySelectorAll('.check-item.selected')).map(el => el.dataset.perm);
    if (!permissions.length) { showToast('Select at least one permission', 'warning'); return; }

    try {
      await api.post('/admin/roles', {
        name,
        description: document.getElementById('rDesc').value.trim(),
        permissions
      });
      closeModal('createModal');
      document.getElementById('rName').value = '';
      document.getElementById('rDesc').value = '';
      showToast(`Role "${name}" created`);
      loadRoles();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  document.querySelectorAll('.modal-overlay').forEach(m => { m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }); });

  // Permissions must be loaded before roles render, since role chips label
  // themselves from the catalogue
  loadPermissions().then(loadRoles).catch(err => showToast(err.message, 'error'));
</script>
</body>
</html>
