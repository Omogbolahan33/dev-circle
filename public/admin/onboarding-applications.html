<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Applications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    /* An application is read before it is decided on, so the answers are the
       body of the drawer rather than a summary line. Each one shows the
       question in the words it was asked in — a reviewer judging a stranger
       deserves the wording, not a field name. */
    .qa { padding: var(--sp-4) 0; border-bottom: 1px solid var(--line-faint); }
    .qa:last-child { border-bottom: none; }
    .qa-ask { font-size: var(--fs-sm); color: var(--ash); margin-bottom: var(--sp-2); }
    .qa-said { font-size: var(--fs-base); line-height: var(--lh-loose); }
    .qa-said.blank { color: var(--ash-dim); font-style: italic; }
    /* What this answer became. Only on the answers that are facts about the
       person — the rest are just answers, and marking them all would say
       nothing. */
    .qa-field {
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--cd-blue);
      margin-left: var(--sp-2);
    }
    .known {
      padding: var(--sp-3) var(--sp-4);
      border-radius: var(--r-md);
      background: var(--amber-dim, var(--tint-2));
      font-size: var(--fs-sm);
      line-height: var(--lh-loose);
      margin-bottom: var(--sp-4);
    }
    .whence { font-size: var(--fs-xs); color: var(--ash-dim); line-height: var(--lh-loose); }

    /* Picking several. The column is narrow and the click on it does not open
       the row — a tick and a "show me this one" are different intentions and
       the same pixel cannot mean both. */
    .col-pick { width: 36px; }
    .bulk-bar {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      margin-bottom: var(--sp-3);
      background: var(--cd-blue-dim);
      border: 1px solid var(--cd-blue-40);
      border-radius: var(--r-md);
    }
    .bulk-count { font-size: var(--fs-sm); font-weight: var(--fw-medium); }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">Applications</h1>
          <p class="page-subtitle" id="subtitle">People who filled in an onboarding form. Approving one is what creates the account.</p>
        </div>
        <div class="page-actions">
          <a href="/admin/onboarding.html" class="btn btn-sm btn-secondary">Forms</a>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-status="pending">Waiting</button>
        <button class="tab" data-status="approved">Approved</button>
        <button class="tab" data-status="rejected">Turned down</button>
        <button class="tab" data-status="withdrawn">Superseded</button>
      </nav>
    </header>

    <div class="app-body">
      <!-- Only on screen once something is ticked. A bar of destructive buttons
           sitting above an untouched table invites the mis-click it describes. -->
      <div class="bulk-bar hide" id="bulkBar">
        <span class="bulk-count" id="bulkCount"></span>
        <button class="btn btn-sm btn-ghost" onclick="clearSelection()">Clear</button>
        <span class="spacer"></span>
        <span id="bulkActions"></span>
      </div>

      <div class="table-shell">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th class="col-pick"><span class="check" id="pickAll" onclick="toggleAll()">✓</span></th>
                <th>Applicant</th>
                <th class="hide-sm">Form</th>
                <th class="hide-sm">Came from</th>
                <th>When</th>
                <th class="col-actions"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<aside class="drawer wide" id="oneDrawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title" id="oneName">Application</div>
      <div class="drawer-sub" id="oneSub"></div>
    </div>
    <button class="icon-btn" onclick="Shell.closeDrawer('oneDrawer')">×</button>
  </div>
  <div class="drawer-body" id="oneBody"></div>
  <div class="drawer-foot" id="oneFoot"></div>
</aside>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
  Shell.admin('onboarding');

  let status = 'pending';
  const formId = param('form_id');
  let open = null;

  async function load() {
    document.getElementById('rows').innerHTML = skeletonRows(4, 5);
    try {
      const query = `?status=${status}${formId ? `&form_id=${encodeURIComponent(formId)}` : ''}`;
      const data = await api.get(`/admin/onboarding-applications${query}`);
      render(data);
    } catch (err) {
      document.getElementById('rows').innerHTML =
        `<tr><td colspan="6">${emptyState({ title: 'Could not load applications', text: err.message })}</td></tr>`;
    }
  }

  const EMPTY = {
    pending:   { title: 'Nothing waiting', text: 'Every application has been decided on. New ones land here as they arrive.' },
    approved:  { title: 'Nobody approved yet', text: 'Approving an application creates the member and joins them to this circle.' },
    rejected:  { title: 'Nothing turned down', text: 'An application turned down keeps its answers, so a queue that was worked through can be read back.' },
    withdrawn: { title: 'Nothing superseded', text: 'When somebody applies twice, the earlier application is filed here rather than deleted.' }
  };

  function render(data) {
    const tbody = document.getElementById('rows');

    if (formId) {
      document.getElementById('subtitle').textContent =
        `Applications to one form. ${data.pending} waiting across this circle.`;
    }

    if (!data.applications.length) {
      tbody.innerHTML = `<tr><td colspan="6">${emptyState(EMPTY[status])}</td></tr>`;
      return;
    }

    tbody.innerHTML = data.applications.map(a => `
      <tr class="row-link" onclick="show('${a.id}')" data-id="${a.id}">
        <td class="col-pick" onclick="event.stopPropagation()">
          <span class="check${selected.has(a.id) ? ' on' : ''}" data-pick="${a.id}"></span>
        </td>
        <td>
          <div class="identity-meta">
            <div class="identity-name">${escapeHtml(a.name || 'No name given')}</div>
            <div class="identity-sub">${escapeHtml(a.email || '')}</div>
          </div>
        </td>
        <td class="hide-sm text-xs muted">${escapeHtml(a.form_name)}</td>
        <td class="hide-sm text-xs muted">${
          a.arrived_by === 'import' ? 'a spreadsheet'
            : a.source_origin ? escapeHtml(a.source_origin.replace(/^https?:\/\//, ''))
            : '<span class="dim">its own link</span>'}</td>
        <td class="text-xs muted nowrap">${formatDate(a.submitted_at || a.created_at)}</td>
        <td class="col-actions" onclick="event.stopPropagation()">
          <div class="row-actions">
            ${a.status === 'pending'
              ? `<button class="btn btn-sm btn-ghost" onclick="show('${a.id}')">Review</button>`
              : `<span class="text-xs dim">${escapeHtml(a.decided_by_name || 'system')}${
                   a.decided_at ? ` · ${formatDate(a.decided_at)}` : ''}</span>`}
          </div>
        </td>
      </tr>`).join('');

    tbody.querySelectorAll('[data-pick]').forEach(el => {
      el.addEventListener('click', event => {
        event.stopPropagation();
        togglePick(el.dataset.pick);
      });
    });

    // A selection made on one tab means nothing on another, and an id that has
    // been decided on is no longer on screen to be decided on again.
    const onScreen = new Set(data.applications.map(a => a.id));
    selected = new Set([...selected].filter(id => onScreen.has(id)));
    renderSelection();
  }

// ─── Picking several ──────────────────────────────────────
  // A queue is worked through in passes: a stack of applicants from one
  // partner's list are all the same decision, and clicking through them one at
  // a time is how a reviewer stops reading them.
  //
  // The selection is held here rather than read back off the checkboxes,
  // because the table is redrawn on every load and the ticks would go with it.

  let selected = new Set();

  function renderSelection() {
    const bar = document.getElementById('bulkBar');
    const count = selected.size;

    bar.classList.toggle('hide', count === 0);
    document.getElementById('bulkCount').textContent =
      `${count} selected`;

    // What can be done to them follows the tab you are on: an approved
    // application has no decision left to make, and a rejected one can be
    // reconsidered or put back.
    const actions = {
      pending: `
        <button class="btn btn-sm btn-secondary" onclick="decideSelected('reject')">Turn down</button>
        <button class="btn btn-sm btn-primary" onclick="decideSelected('approve')">Approve</button>`,
      rejected: `
        <button class="btn btn-sm btn-secondary" onclick="decideSelected('reopen')">Put back in the queue</button>
        <button class="btn btn-sm btn-primary" onclick="decideSelected('approve')">Approve after all</button>`,
      approved: '<span class="text-xs dim">Already members — nothing left to decide.</span>',
      withdrawn: '<span class="text-xs dim">Superseded by a later application.</span>'
    };
    document.getElementById('bulkActions').innerHTML = actions[status] || '';

    // The header tick reflects the rows actually on screen.
    const rows = [...document.querySelectorAll('[data-pick]')];
    const all = rows.length > 0 && rows.every(r => selected.has(r.dataset.pick));
    document.getElementById('pickAll')?.classList.toggle('on', all);
  }

  function togglePick(id) {
    if (selected.has(id)) selected.delete(id);
    else selected.add(id);

    document.querySelector(`[data-pick="${id}"]`)?.classList.toggle('on', selected.has(id));
    renderSelection();
  }

  function toggleAll() {
    const rows = [...document.querySelectorAll('[data-pick]')];
    const all = rows.length > 0 && rows.every(r => selected.has(r.dataset.pick));

    for (const row of rows) {
      if (all) selected.delete(row.dataset.pick);
      else selected.add(row.dataset.pick);
      row.classList.toggle('on', !all);
    }
    renderSelection();
  }

  function clearSelection() {
    selected = new Set();
    document.querySelectorAll('[data-pick]').forEach(el => el.classList.remove('on'));
    renderSelection();
  }

  const WORDING = {
    approve: {
      title: n => `Approve ${n} applicant${n === 1 ? '' : 's'}?`,
      text: n => `${n === 1 ? 'They' : 'They all'} become members of this circle, reachable on the ` +
        'channels they consented to, signing in with their email address and the last six digits ' +
        'of their phone number. Any that cannot be approved are reported back rather than ' +
        'stopping the rest.',
      ok: 'Approve', danger: false
    },
    reject: {
      title: n => `Turn down ${n} application${n === 1 ? '' : 's'}?`,
      text: () => 'Nothing is created and nothing is deleted. They keep their answers and carry ' +
        'the decision, and you can still change your mind afterwards.',
      ok: 'Turn down', danger: true
    },
    reopen: {
      title: n => `Put ${n} back in the queue?`,
      text: () => 'The decision on them is cleared and they wait on a fresh one.',
      ok: 'Put back', danger: false
    }
  };

  async function decideSelected(action) {
    const ids = [...selected];
    if (!ids.length) return;

    const words = WORDING[action];
    const ok = await Shell.confirm({
      title: words.title(ids.length),
      text: words.text(ids.length),
      ok: words.ok,
      danger: words.danger
    });
    if (!ok) return;

    try {
      const res = await api.post('/admin/onboarding-applications/decide', { ids, action });
      showToast(res.message, res.failed.length ? 'warning' : 'success');

      // What could not be done stays selected, so the next thing on screen is
      // the list of what still needs attention rather than an empty table and a
      // number in a toast.
      selected = new Set(res.failed.map(f => f.id));
      if (res.failed.length) renderFailures(res.failed);

      load();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function renderFailures(failed) {
    Shell.confirm({
      title: `${failed.length} could not be done`,
      text: failed.map(f => `· ${escapeHtml(f.error)}`).join('\n'),
      ok: 'Close',
      danger: false
    });
  }

  // ─── Reading one ──────────────────────────────────────────
  // Deciding whether to let a stranger into a workspace means reading what
  // they actually said, so the drawer leads with the answers rather than with
  // the two buttons.

  async function show(id) {
    document.getElementById('oneBody').innerHTML = '<div class="row"><span class="spinner"></span></div>';
    document.getElementById('oneFoot').innerHTML = '';
    Shell.openDrawer('oneDrawer');

    try {
      const data = await api.get(`/admin/onboarding-applications/${id}`);
      open = data;
      const a = data.application;

      document.getElementById('oneName').textContent = a.name || 'Application';
      document.getElementById('oneSub').textContent = `${a.email || 'no address'} · ${a.form_name}`;

      const consent = a.consent_channels || [];

      document.getElementById('oneBody').innerHTML = `
        ${data.existing_member ? `
          <div class="known">
            <strong>${escapeHtml(data.existing_member.name)}</strong> already holds this address,
            since ${escapeHtml(String(data.existing_member.created_at).slice(0, 10))}.
            Approving this joins them to this circle rather than making a second account,
            and fills in only what their profile does not already have.
          </div>` : ''}

        ${a.status !== 'pending' ? `
          <div class="known">
            ${badge(a.status, a.status === 'approved' ? 'active' : 'inactive')}
            by ${escapeHtml(a.decided_by_name || 'system')}${a.decided_at ? ` · ${formatDate(a.decided_at)}` : ''}
            ${a.decision_note ? `<div style="margin-top:var(--sp-2)">${escapeHtml(a.decision_note)}</div>` : ''}
          </div>` : ''}

        ${data.asked.map(q => `
          <div class="qa">
            <div class="qa-ask">
              ${escapeHtml(q.text)}
              ${q.maps_to ? `<span class="qa-field">→ ${escapeHtml(q.maps_to)}</span>` : ''}
            </div>
            <div class="qa-said${q.answer_text ? '' : ' blank'}">${
              q.answer_text ? escapeHtml(q.answer_text) : 'Left blank'}</div>
          </div>`).join('')}

        <div class="qa">
          <div class="qa-ask">Consent to be contacted</div>
          <div class="qa-said${consent.length ? '' : ' blank'}">${
            consent.length
              ? escapeHtml(consent.join(', '))
              : 'Nothing ticked — so nothing may be sent on any channel'}</div>
        </div>

        <p class="whence" style="margin-top:var(--sp-4)">
          ${a.arrived_by === 'import'
            ? `Imported from a spreadsheet ${a.submitted_at ? formatDate(a.submitted_at) : ''}${
                a.external_ref ? `, as <span class="mono">${escapeHtml(a.external_ref)}</span>` : ''}.`
            : `Sent in ${a.submitted_at ? formatDate(a.submitted_at) : 'at some point'}${
                a.source_page ? ` from ${escapeHtml(a.source_page)}` : ' at the form\'s own link'}.`}
        </p>`;

      const approveLabel = data.existing_member ? 'Join to this circle' : 'Approve and create the member';

      // A rejection is not final: the reason to reconsider usually turns up
      // after the decision. An approval is, because the member exists.
      const foot = {
        pending: `
          <button class="btn btn-secondary" onclick="decide('reject')">Turn down</button>
          <button class="btn btn-primary" onclick="decide('approve')">${approveLabel}</button>`,
        rejected: `
          <button class="btn btn-secondary" onclick="decide('reopen')">Put back in the queue</button>
          <button class="btn btn-primary" onclick="decide('approve')">Approve after all</button>`,
        withdrawn: `
          <button class="btn btn-secondary" onclick="Shell.closeDrawer('oneDrawer')">Close</button>`
      };

      document.getElementById('oneFoot').innerHTML = foot[a.status] ||
        `<button class="btn btn-secondary" onclick="Shell.closeDrawer('oneDrawer')">Close</button>`;
    } catch (err) {
      document.getElementById('oneBody').innerHTML =
        `<p class="hint" style="color:var(--rose-ink)">${escapeHtml(err.message)}</p>`;
    }
  }

  async function decide(action) {
    const a = open.application;

    // Approving creates an account and joins somebody to this workspace. That
    // is not something to do on a mis-click, and it cannot be undone by
    // clicking again — turning somebody down can.
    const ok = await Shell.confirm({
      title: action === 'approve'
        ? (open.existing_member ? 'Join them to this circle?' : 'Create this member?')
        : action === 'reopen' ? 'Put this back in the queue?'
        : 'Turn this application down?',
      text: action === 'approve'
        ? `${a.name || 'They'} will be a member of this circle, reachable on the channels they ` +
          'consented to. They sign in with the email address on this application and the last ' +
          'six digits of the phone number beside it.' +
          (open.application.profile?.phone ? '' :
            ' This application carries no phone number, so they will not be able to sign in ' +
            'until somebody adds one to their profile.')
        : action === 'reopen'
          ? 'The decision on it is cleared and it waits on a fresh one.'
          : 'Nothing is created and nothing is deleted. The application keeps its answers and ' +
            'carries the decision — and you can still change your mind afterwards.',
      ok: action === 'approve' ? 'Approve' : action === 'reopen' ? 'Put back' : 'Turn down',
      danger: action === 'reject'
    });
    if (!ok) return;

    try {
      const res = await api.post(`/admin/onboarding-applications/${a.id}/${action}`, {});
      showToast(res.message);
      Shell.closeDrawer('oneDrawer');
      load();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  document.getElementById('tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    status = tab.dataset.status;
    selected = new Set();
    load();
  });

  load();
</script>
</body>
</html>
