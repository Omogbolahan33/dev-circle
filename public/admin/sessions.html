<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Sessions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    /* A session is an appointment, so the date block leads the row the way a
       calendar entry does. */
    .session { display: flex; gap: var(--sp-5); padding: var(--sp-5) 0; border-bottom: 1px solid var(--line-faint); }
    .session:last-child { border-bottom: none; }

    .when {
      width: 68px;
      flex-shrink: 0;
      text-align: center;
      padding: var(--sp-2) 0;
      border-right: 1px solid var(--line-faint);
    }
    .when-day { font-size: var(--fs-xs); color: var(--ash-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    .when-date { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-lg); line-height: 1.1; }
    .when-time { font-family: var(--font-mono); font-size: 10px; color: var(--cd-blue); margin-top: 2px; }

    .session-title { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-base); }
    .session-desc { font-size: var(--fs-sm); color: var(--ash); margin-top: var(--sp-1); }
    .session-meta { display: flex; gap: var(--sp-3); flex-wrap: wrap; font-size: var(--fs-xs); color: var(--ash-dim); margin-top: var(--sp-2); }

    /* Availability is the point of this screen: never schedule over the hours
       members told us they are free. */
    .avail { margin-top: var(--sp-3); padding: var(--sp-3); background: var(--surface-2); border-radius: var(--r-md); font-size: var(--fs-xs); }
    .avail-line { color: var(--ash); }
    .avail-line strong { color: var(--white); }
    .avail-warn { color: var(--cd-gold); }
    .avail-warn strong { color: var(--cd-gold); }
    .avail-names { color: var(--ash-dim); margin-top: 2px; }

    .check-item { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); cursor: pointer; padding: var(--sp-1) 0; }
    .list { max-width: 820px; }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="page-head-row">
        <div>
          <h1 class="page-title">Sessions</h1>
          <p class="page-subtitle">Scheduled engagements — office hours, 1-on-1s, group calls. Members see them in their portal and are reminded automatically.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-sm btn-secondary" onclick="runScheduler()">Run scheduler</button>
          <button class="btn btn-sm btn-primary" onclick="openCreate()">Schedule session</button>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab active" data-panel="upcoming">Upcoming</button>
        <button class="tab" data-panel="past">Past</button>
      </nav>
    </header>

    <div class="app-body">
      <div class="list">
        <div id="panel-upcoming"></div>
        <div id="panel-past" class="hide"></div>
      </div>
    </div>
  </div>
</div>

<aside class="drawer drawer-lg" id="createDrawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">Schedule a session</div>
      <div class="drawer-sub">Times are West Africa Time</div>
    </div>
    <button class="icon-btn" onclick="Shell.closeDrawer('createDrawer')">×</button>
  </div>
  <div class="drawer-body">
    <div class="field">
      <label class="label">Title</label>
      <input type="text" class="input" id="sTitle" placeholder="e.g. Sandbox office hours">
    </div>
    <div class="field">
      <label class="label">Description</label>
      <textarea class="input" id="sDesc" placeholder="What will you cover?"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="label">Type</label>
        <select class="input" id="sType">
          <option value="office_hours">Office hours</option>
          <option value="1-on-1">1-on-1</option>
          <option value="group">Group call</option>
          <option value="workshop">Workshop</option>
        </select>
      </div>
      <div class="field">
        <label class="label">Circle</label>
        <select class="input" id="sCircle"></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="label">When (WAT)</label>
        <input type="datetime-local" class="input" id="sWhen" onchange="checkSlot()">
      </div>
      <div class="field">
        <label class="label">Duration (min)</label>
        <input type="number" class="input" id="sDuration" value="30" min="5" max="240">
      </div>
    </div>
    <div class="field">
      <label class="label">Location or link</label>
      <input type="text" class="input" id="sLocation" placeholder="Google Meet, Zoom, or an address">
    </div>
    <div class="field">
      <label class="label">Announce on</label>
      <label class="check-item"><input type="checkbox" value="email" checked> Email</label>
      <label class="check-item"><input type="checkbox" value="whatsapp"> WhatsApp</label>
      <label class="check-item"><input type="checkbox" value="sms"> SMS</label>
      <label class="check-item"><input type="checkbox" value="in_portal" checked> In-portal</label>
    </div>
    <div class="field">
      <label class="label">Reminders before</label>
      <input type="text" class="input" id="sReminders" value="1 day, 1 hour" placeholder="e.g. 2 days, 1 hour, 30">
      <p class="hint">Comma-separated lead times. Reminders go out on the same channels.</p>
    </div>

    <div id="slotCheck"></div>
  </div>
  <div class="drawer-foot">
    <button class="btn btn-secondary" onclick="Shell.closeDrawer('createDrawer')">Cancel</button>
    <button class="btn btn-primary" onclick="createSession()">Schedule</button>
  </div>
</aside>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
  Shell.admin('sessions');

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Timestamps are stored UTC; members and admins both think in WAT (UTC+1)
  function toWat(stored) {
    const utc = new Date(String(stored).replace(' ', 'T') + 'Z');
    return new Date(utc.getTime() + 60 * 60 * 1000);
  }

  function formatLead(minutes) {
    if (minutes >= 1440) { const d = Math.round(minutes / 1440); return `${d} day${d > 1 ? 's' : ''}`; }
    if (minutes >= 60) { const h = Math.round(minutes / 60); return `${h} hour${h > 1 ? 's' : ''}`; }
    return `${minutes} min`;
  }

  // Accepts "2 days, 1 hour, 30" and returns minutes
  function parseLeads(text) {
    return text.split(',').map(part => {
      const m = /(\d+)\s*(day|hour|hr|min)?/i.exec(part.trim());
      if (!m) return null;
      const n = Number(m[1]);
      const unit = (m[2] || 'min').toLowerCase();
      if (unit.startsWith('day')) return n * 1440;
      if (unit.startsWith('h')) return n * 60;
      return n;
    }).filter(n => n && n > 0);
  }

  function sessionRow(s, isPast) {
    const when = toWat(s.scheduled_for);
    const reminders = (s.reminder_offsets || []).map(formatLead).join(', ');

    const actions = isPast || s.status === 'cancelled' ? '' : `
      <div class="row-tight">
        ${s.status === 'scheduled'
          ? `<button class="btn btn-sm btn-primary" onclick="announce('${s.id}', this)">Announce</button>`
          : `<button class="btn btn-sm btn-secondary" onclick="remind('${s.id}', this)">Remind now</button>`}
        <button class="btn btn-sm btn-ghost" onclick="cancelSession('${s.id}', '${escapeHtml(s.title).replace(/'/g, '&#39;')}')">Cancel</button>
      </div>`;

    return `
      <article class="session">
        <div class="when">
          <div class="when-day">${DAYS[when.getUTCDay()]}</div>
          <div class="when-date">${when.getUTCDate()} ${MONTHS[when.getUTCMonth()]}</div>
          <div class="when-time">${String(when.getUTCHours()).padStart(2, '0')}:${String(when.getUTCMinutes()).padStart(2, '0')}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div class="row-tight wrap">
            <span class="session-title">${escapeHtml(s.title)}</span>
            ${badge(s.status, s.status === 'scheduled' ? 'info' : s.status === 'cancelled' ? 'danger' : s.status === 'completed' ? 'inactive' : 'active')}
          </div>
          ${s.description ? `<div class="session-desc">${escapeHtml(s.description)}</div>` : ''}
          <div class="session-meta">
            <span>${escapeHtml((s.type || '').replace(/_/g, ' '))}</span>
            <span>${s.duration_min} min</span>
            ${s.location ? `<span>${escapeHtml(s.location)}</span>` : ''}
            <span>${escapeHtml(s.circle_name || 'Dev Circle')}</span>
            ${reminders ? `<span>reminders: ${reminders}</span>` : ''}
          </div>
          ${isPast ? '' : `<div id="avail-${s.id}"></div>`}
          ${actions ? `<div class="mt-4">${actions}</div>` : ''}
        </div>
      </article>`;
  }

  async function load() {
    try {
      const [sessions, circleData] = await Promise.all([
        api.get('/admin/sessions'),
        api.get('/admin/circles')
      ]);

      const circles = circleData.circles.filter(c => c.status === 'active');
      document.getElementById('sCircle').innerHTML = circles
        .map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

      const now = Date.now();
      const upcoming = sessions.sessions.filter(s =>
        s.status !== 'completed' && toWat(s.scheduled_for).getTime() > now - 3600000);
      const past = sessions.sessions.filter(s => !upcoming.includes(s));

      document.getElementById('panel-upcoming').innerHTML = upcoming.length
        ? upcoming.map(s => sessionRow(s, false)).join('')
        : emptyState({
            title: 'Nothing scheduled',
            text: 'Members see upcoming sessions in their portal and are reminded automatically.',
            action: '<button class="btn btn-sm btn-primary" onclick="openCreate()">Schedule one</button>'
          });

      document.getElementById('panel-past').innerHTML = past.length
        ? past.map(s => sessionRow(s, true)).join('')
        : emptyState({ title: 'No past sessions yet' });

      // Availability is fetched per session so the list itself stays fast
      for (const s of upcoming) loadAvailability(s.id);
    } catch (err) {
      document.getElementById('panel-upcoming').innerHTML =
        emptyState({ title: 'Could not load sessions', text: err.message });
    }
  }

  async function loadAvailability(id) {
    try {
      const a = await api.get(`/admin/sessions/${id}/preview`);
      const box = document.getElementById('avail-' + id);
      if (!box) return;

      const clashNames = a.unavailable.slice(0, 4).map(u => u.name).join(', ');

      box.innerHTML = `
        <div class="avail">
          <div class="avail-line"><strong>${a.available.length}</strong> of ${a.total} are free on ${a.weekday}</div>
          ${a.unavailable.length ? `
            <div class="avail-line avail-warn"><strong>${a.unavailable.length}</strong> have this outside the availability they set</div>
            <div class="avail-names">${escapeHtml(clashNames)}${a.unavailable.length > 4 ? ` +${a.unavailable.length - 4} more` : ''}</div>` : ''}
          ${a.unreachable.length ? `<div class="avail-line avail-warn"><strong>${a.unreachable.length}</strong> can't be reached on the chosen channels</div>` : ''}
        </div>`;
    } catch { /* availability is supplementary — a failure must not blank the row */ }
  }

  // ─── Create ─────────────────────────────────────────────
  function openCreate() {
    document.getElementById('slotCheck').innerHTML = '';
    Shell.openDrawer('createDrawer');
    document.getElementById('sTitle').focus();
  }

  function selectedChannels() {
    return Array.from(document.querySelectorAll('#createDrawer .check-item input:checked')).map(i => i.value);
  }

  // The datetime-local input is WAT in the operator's head; convert to UTC
  function watInputToUtc(value) {
    if (!value) return null;
    const [date, time] = value.split('T');
    const [y, m, d] = date.split('-').map(Number);
    const [hh, mm] = time.split(':').map(Number);
    return new Date(Date.UTC(y, m - 1, d, hh - 1, mm)).toISOString().replace('T', ' ').slice(0, 19);
  }

  // Check the slot against members' stated availability before committing
  async function checkSlot() {
    const when = watInputToUtc(document.getElementById('sWhen').value);
    if (!when) return;

    try {
      const a = await api.post('/admin/sessions/preview', {
        scheduled_for: when,
        circle_id: document.getElementById('sCircle').value,
        target_type: 'all',
        channels: selectedChannels()
      });

      document.getElementById('slotCheck').innerHTML = `
        <div class="avail">
          <div class="avail-line"><strong>${a.available.length}</strong> of ${a.total} members are free on ${a.weekday} at that time</div>
          ${a.unavailable.length ? `<div class="avail-line avail-warn">${a.unavailable.length} said they are not available then</div>` : ''}
          ${a.unreachable.length ? `<div class="avail-line avail-warn">${a.unreachable.length} cannot be reached on those channels</div>` : ''}
        </div>`;
    } catch (err) {
      document.getElementById('slotCheck').innerHTML =
        `<div class="avail"><div class="avail-line avail-warn">${escapeHtml(err.message)}</div></div>`;
    }
  }

  async function createSession() {
    const title = document.getElementById('sTitle').value.trim();
    const when = watInputToUtc(document.getElementById('sWhen').value);

    if (!title) { showToast('Give the session a title', 'warning'); return; }
    if (!when) { showToast('Pick a date and time', 'warning'); return; }

    const channels = selectedChannels();
    if (!channels.length) { showToast('Pick at least one channel', 'warning'); return; }

    try {
      const res = await api.post('/admin/sessions', {
        title,
        description: document.getElementById('sDesc').value.trim() || null,
        type: document.getElementById('sType').value,
        circle_id: document.getElementById('sCircle').value,
        scheduled_for: when,
        duration_min: Number(document.getElementById('sDuration').value) || 30,
        location: document.getElementById('sLocation').value.trim() || null,
        target_type: 'all',
        channels,
        reminder_offsets: parseLeads(document.getElementById('sReminders').value)
      });

      Shell.closeDrawer('createDrawer');
      const p = res.preview;
      showToast(`Scheduled — ${p.available.length} of ${p.total} members are free then`);
      document.getElementById('sTitle').value = '';
      document.getElementById('sDesc').value = '';
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  // ─── Actions ────────────────────────────────────────────
  async function announce(id, button) {
    button.disabled = true;
    try {
      const res = await api.post(`/admin/sessions/${id}/announce`, {});
      showToast(res.message);
      load();
    } catch (err) {
      showToast(err.message, 'error');
      button.disabled = false;
    }
  }

  async function remind(id, button) {
    button.disabled = true;
    try {
      const res = await api.post(`/admin/sessions/${id}/remind`, {});
      showToast(res.message);
    } catch (err) { showToast(err.message, 'error'); }
    button.disabled = false;
  }

  async function cancelSession(id, title) {
    const ok = await Shell.confirm({
      title: `Cancel "${title}"?`,
      text: 'Anyone already invited will be told it is off.',
      ok: 'Cancel session'
    });
    if (!ok) return;

    try {
      const res = await api.del(`/admin/sessions/${id}`);
      showToast(`Cancelled${res.notified ? ` — ${res.notified} member(s) notified` : ''}`);
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  // Fires anything that has come due — reminders and survey nudges.
  async function runScheduler() {
    try {
      const res = await api.post('/admin/sessions/run-scheduler', {});
      const fired = res.reminders.length;
      const nudged = res.survey_reminders.reduce((n, r) => n + r.reminded, 0);
      showToast(fired || nudged
        ? `${fired} session reminder(s), ${nudged} survey nudge(s) sent`
        : 'Nothing was due');
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  document.querySelectorAll('.tab[data-panel]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-upcoming').classList.toggle('hide', tab.dataset.panel !== 'upcoming');
      document.getElementById('panel-past').classList.toggle('hide', tab.dataset.panel !== 'past');
    });
  });

  load();
</script>
</body>
</html>
