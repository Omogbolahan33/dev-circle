<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Survey responses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    .panel { display: none; }
    .panel.active { display: block; }

    .q-block { padding: var(--sp-6) 0; border-bottom: 1px solid var(--line-faint); }
    .q-block:last-child { border-bottom: none; }
    .q-kicker { font-size: var(--fs-xs); color: var(--ash-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: var(--sp-2); }
    .q-ask { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-md); margin-bottom: var(--sp-5); }

    /* Rating distribution: columns because the shape of the answer is the
       finding — a flat spread and a hard bimodal split mean different things. */
    .dist { display: flex; align-items: flex-end; gap: var(--sp-2); height: 110px; }
    .dist-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); height: 100%; justify-content: flex-end; }
    .dist-bar { width: 100%; background: var(--cd-blue); border-radius: var(--r-sm) var(--r-sm) 0 0; min-height: 3px; }
    .dist-n { font-family: var(--font-mono); font-size: 10px; color: var(--ash); }
    .dist-x { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ash-dim); }

    .avg { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-2xl); letter-spacing: -0.03em; margin-bottom: var(--sp-4); }
    .avg .of { font-size: var(--fs-sm); color: var(--ash); font-weight: var(--fw-regular); }

    .choice-row { display: grid; grid-template-columns: minmax(90px, 180px) 1fr auto; gap: var(--sp-3); align-items: center; margin-bottom: var(--sp-3); font-size: var(--fs-sm); }
    .choice-track { height: 6px; background: rgba(160,160,184,0.08); border-radius: var(--r-full); overflow: hidden; }
    .choice-fill { height: 100%; background: var(--cd-blue); border-radius: var(--r-full); }

    .verbatim { padding: var(--sp-3) 0 var(--sp-3) var(--sp-4); border-left: 2px solid var(--cd-clay); margin-bottom: var(--sp-3); font-size: var(--fs-sm); line-height: var(--lh-loose); color: var(--ash); }
    .verbatim .who { display: block; font-size: var(--fs-xs); color: var(--ash-dim); margin-top: var(--sp-2); }
  </style>
</head>
<body>

<div class="app">
  <div class="app-main">

    <header class="page-head">
      <div class="breadcrumb">
        <a href="/admin/surveys.html">Surveys</a>
        <span class="sep">/</span>
        <span id="crumbName">…</span>
      </div>

      <div class="page-head-row">
        <div>
          <h1 class="page-title" id="title">Loading…</h1>
          <p class="page-subtitle" id="subtitle"></p>
        </div>
        <div class="page-actions" id="actions"></div>
      </div>

      <nav class="tabs">
        <button class="tab active" data-panel="summary">Summary</button>
        <button class="tab" data-panel="individual">Individual responses</button>
      </nav>
    </header>

    <div class="app-body">
      <div class="figures" id="figures"></div>

      <div class="panel active" id="panel-summary">
        <div id="analysis"></div>
      </div>

      <div class="panel" id="panel-individual">
        <div class="table-shell">
          <div class="table-scroll">
            <table class="data-table" id="responseTable"></table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
  Shell.admin('surveys');

  const surveyId = param('id');
  if (!surveyId) window.location.href = '/admin/surveys.html';

  async function load() {
    try {
      const data = await api.get(`/admin/surveys/${surveyId}/responses`);
      const survey = data.survey;
      const responses = data.responses;
      const completed = responses.filter(r => r.completed_at);

      document.getElementById('crumbName').textContent = survey.title;
      document.title = `Dev Circle — ${survey.title}`;
      document.getElementById('title').textContent = survey.title;
      document.getElementById('subtitle').textContent =
        [survey.description, survey.engagement_mode, `~${survey.time_estimate_min} min`].filter(Boolean).join(' · ');

      document.getElementById('actions').innerHTML = `
        ${badge(survey.status, survey.status === 'active' ? 'active' : survey.status === 'draft' ? 'warn' : 'inactive')}
        <button class="btn btn-sm btn-secondary" onclick="exportResponses()">Export CSV</button>`;

      const rate = responses.length ? Math.round((completed.length / responses.length) * 100) : 0;
      document.getElementById('figures').innerHTML = `
        <div><div class="figure-value">${responses.length}</div><div class="figure-label">Invited</div></div>
        <div><div class="figure-value">${completed.length}</div><div class="figure-label">Completed</div></div>
        <div><div class="figure-value">${rate}<span class="unit">%</span></div><div class="figure-label">Response rate</div></div>
        <div><div class="figure-value">${survey.questions.length}</div><div class="figure-label">Questions</div></div>`;

      renderAnalysis(survey.questions, completed);
      renderIndividual(survey.questions, completed);
    } catch (err) {
      document.querySelector('.app-body').innerHTML = emptyState({ title: 'Could not load responses', text: err.message });
    }
  }

  function renderAnalysis(questions, completed) {
    const el = document.getElementById('analysis');

    if (!completed.length) {
      el.innerHTML = emptyState({
        title: 'No completed responses yet',
        text: 'Once members submit, each question is summarised here — distributions for ratings, counts for choices, and the raw words for open questions.'
      });
      return;
    }

    el.innerHTML = questions.map((q, i) => {
      const answers = completed.map(r => r.answers[q.id]).filter(a => a !== undefined && a !== null && a !== '');
      let body = '<p class="dim text-sm">No answers to this question.</p>';

      if (answers.length && q.type === 'rating') {
        const scale = q.scale || 5;
        const counts = {};
        for (let v = 1; v <= scale; v++) counts[v] = 0;
        answers.forEach(a => { const v = Math.round(a); if (counts[v] !== undefined) counts[v]++; });

        const max = Math.max(...Object.values(counts), 1);
        const avg = (answers.reduce((s, a) => s + Number(a), 0) / answers.length).toFixed(1);

        body = `
          <div class="avg">${avg}<span class="of"> / ${scale} average</span></div>
          <div class="dist">
            ${Array.from({ length: scale }, (_, k) => {
              const v = k + 1;
              return `
                <div class="dist-col">
                  <span class="dist-n">${counts[v]}</span>
                  <span class="dist-bar" style="height:${(counts[v] / max) * 100}%"></span>
                  <span class="dist-x">${v}</span>
                </div>`;
            }).join('')}
          </div>
          ${q.labels ? `<div class="row text-xs dim mt-2"><span>${escapeHtml(q.labels[0] || '')}</span><span class="spacer"></span><span>${escapeHtml(q.labels[4] || '')}</span></div>` : ''}`;
      }

      if (answers.length && q.type === 'choice') {
        const counts = {};
        answers.forEach(a => { counts[a] = (counts[a] || 0) + 1; });
        const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
        const max = sorted[0][1];

        body = sorted.map(([label, count]) => `
          <div class="choice-row">
            <span class="truncate">${escapeHtml(label)}</span>
            <span class="choice-track"><span class="choice-fill" style="width:${(count / max) * 100}%"></span></span>
            <span class="mono text-xs">${count} · ${Math.round((count / answers.length) * 100)}%</span>
          </div>`).join('');
      }

      if (answers.length && q.type === 'text') {
        // Open answers are quoted, not counted — the words are the finding.
        body = completed
          .filter(r => r.answers[q.id])
          .slice(0, 12)
          .map(r => `
            <blockquote class="verbatim">
              ${escapeHtml(String(r.answers[q.id]))}
              <span class="who">${escapeHtml(r.user_name)}</span>
            </blockquote>`).join('') +
          (answers.length > 12 ? `<p class="dim text-xs">+${answers.length - 12} more</p>` : '');
      }

      return `
        <section class="q-block">
          <div class="q-kicker">Q${i + 1} · ${q.type} · ${answers.length} answered</div>
          <h3 class="q-ask">${escapeHtml(q.text)}</h3>
          ${body}
        </section>`;
    }).join('');
  }

  function renderIndividual(questions, completed) {
    const table = document.getElementById('responseTable');

    if (!completed.length) {
      table.innerHTML = `<tbody><tr><td>${emptyState({ title: 'Nothing submitted yet' })}</td></tr></tbody>`;
      return;
    }

    table.innerHTML = `
      <thead>
        <tr>
          <th>Respondent</th>
          ${questions.map(q => `<th>${escapeHtml(q.text.slice(0, 34))}${q.text.length > 34 ? '…' : ''}</th>`).join('')}
          <th>Submitted</th>
        </tr>
      </thead>
      <tbody>
        ${completed.map(r => `
          <tr class="row-link" onclick="window.location.href='/admin/member.html?id=${r.user_id}'">
            <td>${identityCell(r.user_name, r.user_email)}</td>
            ${questions.map(q => {
              const val = r.answers[q.id];
              if (val === undefined || val === '') return '<td class="dim">—</td>';
              if (q.type === 'rating') return `<td class="mono tnum">${val}/${q.scale || 5}</td>`;
              if (q.type === 'choice') return `<td class="text-sm">${escapeHtml(String(val))}</td>`;
              return `<td class="text-xs muted" style="max-width:240px">${escapeHtml(String(val).slice(0, 90))}${String(val).length > 90 ? '…' : ''}</td>`;
            }).join('')}
            <td class="text-xs muted nowrap">${formatDate(r.completed_at)}</td>
          </tr>`).join('')}
      </tbody>`;
  }

  async function exportResponses() {
    try {
      const res = await fetch(`${API_BASE}/admin/surveys/${surveyId}/export`, { headers: Auth.headers() });
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'survey-responses.csv';
      a.click();
      showToast('Exported');
    } catch { showToast('Export failed', 'error'); }
  }

  document.querySelectorAll('.tab[data-panel]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
  });

  load();
</script>
</body>
</html>
