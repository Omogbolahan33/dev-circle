<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    .greeting { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-2xl); letter-spacing: -0.03em; }
    .greeting-sub { color: var(--ash); font-size: var(--fs-sm); margin-top: var(--sp-1); }

    /* Standing facts about this developer's relationship with Credit Direct.
       Stated once, quietly, rather than as a wall of tiles. */
    .standing {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      flex-wrap: wrap;
      padding: var(--sp-4) 0;
      border-top: 1px solid var(--line-faint);
      border-bottom: 1px solid var(--line-faint);
      margin: var(--sp-6) 0 var(--sp-8);
      font-size: var(--fs-sm);
      color: var(--ash);
    }
    .standing .val { color: var(--white); font-weight: var(--fw-semibold); }
    .standing .divider { width: 1px; height: 14px; background: var(--line); }

    .item {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      padding: var(--sp-4) 0;
      border-bottom: 1px solid var(--line-faint);
      text-decoration: none;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { text-decoration: none; }
    .item-title { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--white); }
    .item-meta { font-size: var(--fs-xs); color: var(--ash-dim); margin-top: 2px; }

    /* A session that lands outside the hours they chose says so plainly. */
    .clash { color: var(--cd-gold); }

    .when-chip {
      font-family: var(--font-mono);
      font-size: var(--fs-xs);
      color: var(--cd-blue);
      background: var(--cd-blue-dim);
      padding: var(--sp-1) var(--sp-2);
      border-radius: var(--r-sm);
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="portal">
  <div class="portal-body">

    <header>
      <h1 class="greeting" id="greeting">Welcome back</h1>
      <p class="greeting-sub" id="greetingSub"></p>
    </header>

    <div class="standing" id="standing"></div>

    <!-- The one thing worth doing next, if there is one. -->
    <div id="nextAction"></div>

    <section class="section" id="sessionsSection" hidden>
      <div class="section-head">
        <h2 class="section-title">Coming up</h2>
      </div>
      <div id="sessions"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Surveys</h2>
        <span class="dim text-xs" id="surveyCount"></span>
      </div>
      <div id="surveys"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Recent activity</h2>
        <a href="/member/engagement.html" class="section-link">Full history →</a>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="section">
      <div class="card">
        <div class="card-title mb-2">Something on your mind?</div>
        <p class="text-sm muted mb-4">
          Tell us what is working and what is not. It goes straight to the team that
          builds the APIs you integrate with — no ticket queue, no forms.
        </p>
        <button class="btn btn-primary" onclick="Shell.openDrawer('feedbackDrawer')">Give feedback</button>
      </div>
    </section>

  </div>
</div>

<aside class="drawer" id="feedbackDrawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title">Give feedback</div>
      <div class="drawer-sub">Straight to the Credit Direct developer team</div>
    </div>
    <button class="icon-btn" onclick="Shell.closeDrawer('feedbackDrawer')">×</button>
  </div>
  <div class="drawer-body">
    <div class="field">
      <label class="label">What is this about?</label>
      <select class="input" id="fbCategory">
        <option value="api">The APIs</option>
        <option value="documentation">Documentation</option>
        <option value="sandbox">Sandbox</option>
        <option value="onboarding">Onboarding &amp; KYB</option>
        <option value="support">Support</option>
        <option value="other">Something else</option>
      </select>
    </div>
    <div class="field">
      <label class="label">Your feedback</label>
      <textarea class="input" id="fbContent" style="min-height:180px" placeholder="Be as direct as you like."></textarea>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn btn-secondary" onclick="Shell.closeDrawer('feedbackDrawer')">Cancel</button>
    <button class="btn btn-primary" onclick="submitFeedback()">Send feedback</button>
  </div>
</aside>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/activity.js"></script>
<script>
  Shell.portal('dashboard');

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function watLabel(stored) {
    const utc = new Date(String(stored).replace(' ', 'T') + 'Z');
    const wat = new Date(utc.getTime() + 3600000);
    return `${wat.getUTCDate()} ${MONTHS[wat.getUTCMonth()]}, ` +
           `${String(wat.getUTCHours()).padStart(2, '0')}:${String(wat.getUTCMinutes()).padStart(2, '0')} WAT`;
  }

  async function load() {
    try {
      const [profile, surveys, engagement, sessions] = await Promise.all([
        api.get('/users/profile'),
        api.get('/users/surveys'),
        api.get('/users/engagement?limit=8'),
        api.get('/users/sessions')
      ]);

      renderHeader(profile);
      renderStanding(profile);
      renderNextAction(profile, surveys.surveys, sessions.sessions);
      renderSessions(sessions.sessions);
      renderSurveys(surveys.surveys);
      renderTimeline(engagement.history);
    } catch (err) {
      showToast('Failed to load: ' + err.message, 'error');
    }
  }

  function renderHeader({ user }) {
    document.getElementById('greeting').textContent = `Welcome back, ${user.name.split(' ')[0]}`;
    document.getElementById('greetingSub').innerHTML =
      `Last active ${user.last_active_at ? formatDate(user.last_active_at) : 'just now'} · <span class="mono">${escapeHtml(user.email)}</span>`;
  }

  function renderStanding({ user, stats }) {
    document.getElementById('standing').innerHTML = `
      ${badge(user.api_status, user.api_status)}
      <span class="divider"></span>
      <span><span class="val">${stats.surveys_completed}</span> survey${stats.surveys_completed === 1 ? '' : 's'} answered</span>
      <span class="divider"></span>
      <span><span class="val">${stats.gifts_claimed}</span> reward${stats.gifts_claimed === 1 ? '' : 's'} claimed</span>
      <span class="divider"></span>
      <span><span class="val">${stats.streak}</span> day streak</span>
      <span class="divider"></span>
      <span>KYB ${user.kyb_completed
        ? '<span class="val" style="color:var(--emerald)">complete</span>'
        : '<span class="val" style="color:var(--cd-gold)">pending</span>'}</span>`;
  }

  // Exactly one call to action, chosen by what actually matters most:
  // consent we never got, then a session today, then a waiting survey.
  function renderNextAction({ consent }, surveys, sessions) {
    const el = document.getElementById('nextAction');
    const pending = consent.filter(c => c.status === 'pending');
    const waiting = surveys.filter(s => !s.completed);

    if (pending.length) {
      el.innerHTML = `
        <div class="next-action">
          <div class="eyebrow">Before we contact you</div>
          <div class="headline">Tell us how we may reach you</div>
          <p class="detail">
            We will not message you on a channel you have not agreed to. Choose the ones
            that suit you — you can withdraw any of them at any time.
          </p>
          <div class="row-tight wrap">
            <button class="btn btn-primary" onclick="grantConsent()">Allow ${pending.map(c => c.channel.replace('_', '-')).join(', ')}</button>
            <a class="btn btn-ghost" href="/member/notifications.html">Choose individually</a>
          </div>
        </div>`;
      return;
    }

    const soon = sessions[0];
    if (soon) {
      el.innerHTML = `
        <div class="next-action">
          <div class="eyebrow">Coming up</div>
          <div class="headline">${escapeHtml(soon.title)}</div>
          <p class="detail">
            ${watLabel(soon.scheduled_for)} · ${soon.duration_min} min${soon.location ? ' · ' + escapeHtml(soon.location) : ''}
            ${soon.clashes_with_availability ? `<br><span class="clash">${escapeHtml(soon.clash_reason)}</span>` : ''}
          </p>
          ${soon.survey_id ? `<a class="btn btn-primary" href="/member/survey.html?id=${soon.survey_id}">Open the survey</a>` : ''}
        </div>`;
      return;
    }

    if (waiting.length) {
      const s = waiting[0];
      el.innerHTML = `
        <div class="next-action">
          <div class="eyebrow">${waiting.length} survey${waiting.length === 1 ? '' : 's'} waiting</div>
          <div class="headline">${escapeHtml(s.title)}</div>
          <p class="detail">${escapeHtml(s.description || 'Your answers shape what we build next.')} About ${s.time_estimate_min} minutes, ${s.questions.length} question${s.questions.length === 1 ? '' : 's'}.</p>
          <a class="btn btn-primary" href="/member/survey.html?id=${s.id}">Start survey</a>
        </div>`;
      return;
    }

    el.innerHTML = '';
  }

  async function grantConsent() {
    try {
      const { consent } = await api.get('/users/profile');
      for (const c of consent.filter(c => c.status === 'pending')) {
        await api.post('/users/consent', { channel: c.channel });
      }
      showToast('Thank you — preferences saved');
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  function renderSessions(sessions) {
    const section = document.getElementById('sessionsSection');
    section.hidden = !sessions.length;
    if (!sessions.length) return;

    document.getElementById('sessions').innerHTML = sessions.slice(0, 4).map(s => `
      <div class="item">
        <span class="when-chip">${watLabel(s.scheduled_for)}</span>
        <div style="flex:1;min-width:0">
          <div class="item-title">${escapeHtml(s.title)}</div>
          <div class="item-meta">
            ${s.duration_min} min${s.location ? ' · ' + escapeHtml(s.location) : ''}
            ${s.clashes_with_availability ? ` · <span class="clash">${escapeHtml(s.clash_reason)}</span>` : ''}
          </div>
        </div>
        ${s.survey_id ? `<a class="btn btn-sm btn-secondary" href="/member/survey.html?id=${s.survey_id}">Open survey</a>` : ''}
      </div>`).join('');
  }

  function renderSurveys(surveys) {
    const waiting = surveys.filter(s => !s.completed);
    const done = surveys.filter(s => s.completed);

    document.getElementById('surveyCount').textContent =
      `${done.length} answered${waiting.length ? ` · ${waiting.length} waiting` : ''}`;

    document.getElementById('surveys').innerHTML = waiting.length
      ? waiting.map(s => `
        <a class="item" href="/member/survey.html?id=${s.id}">
          <div style="flex:1;min-width:0">
            <div class="item-title">${escapeHtml(s.title)}</div>
            <div class="item-meta">~${s.time_estimate_min} min · ${s.questions.length} question${s.questions.length === 1 ? '' : 's'}</div>
          </div>
          <span class="btn btn-sm btn-primary">Start</span>
        </a>`).join('')
      : emptyState({
          title: 'Nothing to answer right now',
          text: done.length
            ? 'You are all caught up. We will let you know when something new comes round.'
            : 'When we have a question for you, it will show up here.'
        });
  }

  function renderTimeline(history) {
    const el = document.getElementById('timeline');
    if (!history.length) {
      el.innerHTML = emptyState({ title: 'Nothing here yet', text: 'Your engagement history builds up as you take part.' });
      return;
    }

    let lastDay = null;
    el.innerHTML = history.map(h => {
      const info = activityInfo(h.type);
      const day = activityDayLabel(h.created_at);
      const divider = day !== lastDay ? `<div class="tl-divider">${day}</div>` : '';
      lastDay = day;

      // Written back to the member in the second person.
      const text = info.text
        .replace(/^was /, 'You were ')
        .replace(/^(joined|completed|started|claimed|received|submitted|logged|made|went|requested)/, 'You $1');

      return `
        ${divider}
        <div class="tl-item">
          <div class="tl-dot ${info.tone}"></div>
          <div class="tl-head">
            <span class="tl-title">${text.charAt(0).toUpperCase() + text.slice(1)}</span>
            <span class="tl-time">${formatDate(h.created_at)}</span>
          </div>
        </div>`;
    }).join('');
  }

  async function submitFeedback() {
    const content = document.getElementById('fbContent').value.trim();
    if (!content) { showToast('Write your feedback first', 'warning'); return; }

    try {
      await api.post('/feedback', { content, category: document.getElementById('fbCategory').value });
      Shell.closeDrawer('feedbackDrawer');
      document.getElementById('fbContent').value = '';
      showToast('Thank you — that went straight to the team');
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  load();
</script>
</body>
</html>
