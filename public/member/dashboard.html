<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <title>Dev Circle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    /* Home is two columns on a desktop: what you have built up on the left,
       what is being asked of you on the right. */
    .home { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--sp-5); align-items: start; }

    /* On a phone the columns are gone, and so is the order they implied. Both
       stacks flatten into the one flow so it can be stated outright: a survey
       waiting on you comes before the record of what you already did. */
    @media (max-width: 880px) {
      .home { display: flex; flex-direction: column; gap: var(--sp-4); }
      .home > .stack { display: contents; }
      #invitesSection { order: 1; }
      #sessionsSection { order: 2; }
      .say-card { order: 3; }
      #activitySection { order: 4; }

      /* And the heat grid does not come at all. In one column it is as wide as
         the screen and therefore as tall, which is most of a phone screen spent
         on twelve weeks of mostly empty squares. The streak and the count it
         carries are both on the engagement page, one tap away — the timeline
         below says the same thing in words. */
      #engagementSection { display: none; }
    }

    .panel-card {
      background: var(--surface-2);
      border: 1px solid var(--line-faint);
      border-radius: var(--r-xl);
      padding: var(--sp-5);
    }
    .home .panel-card { padding:var(--sp-3) 0; border:0; border-top:1px solid var(--line-faint); border-radius:0; background:transparent; }
    #readinessSection { background:linear-gradient(115deg,var(--surface-2),var(--surface-1)); border-color:var(--line-faint); border-radius:var(--r-xl); }
    .section-title { display:flex; align-items:center; gap:var(--sp-2); }
    .section-title-icon { display:inline-flex; align-items:center; color:var(--cd-blue); }
    .panel-title {
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-3);
      font-weight: var(--fw-semibold);
      margin-bottom: var(--sp-3);
    }

    .masthead {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      padding: var(--sp-4) 0 var(--sp-3);
    }
    .masthead-name {
      font-family: var(--font-display);
      font-weight: var(--fw-black);
      font-size: var(--fs-2xl);
      letter-spacing: -0.03em;
      line-height: 1.1;
      /* A nameless member is greeted by their address, which has no spaces */
      overflow-wrap: anywhere;
    }
    .masthead-line {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      flex-wrap: wrap;
      margin-top: var(--sp-1);
      font-size: var(--fs-xs);
      color: var(--text-2);
    }

    /* One visual readiness panel; no nested tiles. */
    #readinessSection { margin-top:var(--sp-4); }
    #nextAction:empty + #readinessSection { margin-top:var(--sp-2); }
    .impact-strip + .home { margin-top:var(--sp-3); }
    .readiness-panel { display:grid; grid-template-columns:minmax(150px,190px) 1fr; gap:var(--sp-5); align-items:center; }
    .readiness-visual { display:grid; place-items:center; }
    .readiness-svg { width:168px; height:168px; overflow:visible; }
    .readiness-track { fill:none; stroke:var(--line); opacity:.45; }
    .readiness-arc { fill:none; stroke-linecap:round; transition:stroke-dashoffset .7s ease; }
    .readiness-center { fill:var(--text-1); font:700 22px var(--font-display); }
    .readiness-center-label { fill:var(--text-3); font:600 8px var(--font-mono); letter-spacing:.1em; }
    .readiness-copy { min-width:0; }
    .readiness-head { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); margin-bottom:var(--sp-3); }
    .readiness-title { margin:0; font:700 var(--fs-md) var(--font-display); }
    .readiness-legend { display:flex; flex-direction:column; }
    .readiness-item { display:grid; grid-template-columns:10px 1fr auto; gap:var(--sp-2); align-items:center; padding:7px 0; border-bottom:1px solid var(--line-faint); }
    .readiness-item:last-child { border-bottom:0; }
    .readiness-swatch { width:8px; height:8px; border-radius:50%; }
    .readiness-item-name { color:var(--text-1); font-size:var(--fs-xs); font-weight:var(--fw-semibold); }
    .readiness-item-note { color:var(--text-3); font-size:10px; }
    .readiness-item-score { color:var(--text-2); font:500 var(--fs-xs) var(--font-mono); }
    .readiness-foot { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); margin-top:var(--sp-3); }
    .readiness-missing { color:var(--text-3); font-size:var(--fs-xs); }
    .readiness-edit { display:inline-flex; align-items:center; gap:5px; color:var(--text-3); }
    .readiness-edit:hover { color:var(--cd-blue); }
    .impact-strip { display:flex; align-items:center; gap:var(--sp-5); margin:var(--sp-3) 0; padding:var(--sp-2) 0; border-block:1px solid var(--line-faint); }
    .impact-heading { color:var(--text-3); font-size:10px; font-weight:var(--fw-semibold); text-transform:uppercase; letter-spacing:.1em; white-space:nowrap; }
    .impact-tile { display:flex; align-items:center; gap:var(--sp-2); min-width:0; padding:0 var(--sp-4); border-left:1px solid var(--line-faint); }
    .impact-number { color:var(--text-1); font:700 var(--fs-lg) var(--font-display); line-height:1; font-variant-numeric:tabular-nums; }
    .impact-label { color:var(--text-3); font-size:var(--fs-xs); white-space:nowrap; }
    .impact-info { display:flex; align-items:baseline; gap:var(--sp-2); min-width:0; }
    .impact-icon { display:inline-flex; color:var(--cd-blue); opacity:.85; }
    .dashboard-action { display:grid; grid-template-columns:56px minmax(0,1fr); align-items:start; gap:var(--sp-4); }
    .action-visual { display:grid; place-items:center; width:52px; height:52px; border-radius:50%; background:var(--cd-blue-dim); color:var(--cd-blue); }
    .action-copy { min-width:0; }
    .next-action.quiet { background:linear-gradient(115deg,var(--surface-2),var(--surface-1)); border:1px solid var(--line-faint); border-radius:var(--r-xl); padding:var(--sp-5); }
    .next-action.quiet .action-visual { color:var(--text-3); background:var(--surface-3); }
    .next-action.quiet .eyebrow { color:var(--text-3); }
    .next-action.quiet .headline { margin-bottom:var(--sp-1); }
    @media(max-width:700px) {
      .readiness-panel { grid-template-columns:118px 1fr; gap:var(--sp-3); }
      .readiness-svg { width:118px; height:118px; }
      .readiness-foot { align-items:flex-start; flex-direction:column; }
      .impact-strip { justify-content:space-between; gap:var(--sp-1); }
      .impact-heading { display:none; }
      .impact-tile { padding:0 var(--sp-2); gap:5px; }
      .impact-info { align-items:flex-start; flex-direction:column; gap:2px; }
      .impact-number { font-size:var(--fs-md); }
      .impact-label { font-size:10px; white-space:normal; }
      .dashboard-action { grid-template-columns:40px minmax(0,1fr); gap:var(--sp-3); padding:var(--sp-4); }
      .action-visual { width:40px; height:40px; }
    }
    @media(max-width:420px) {
      .readiness-panel { grid-template-columns:1fr; }
      .readiness-svg { width:132px; height:132px; }
      .readiness-visual { margin-bottom:calc(var(--sp-2) * -1); }
    }

    .mobile-breadcrumb {
      display: none;
    }
    @media (max-width: 600px) {
      .mobile-breadcrumb {
        display: flex;
        margin-bottom: var(--sp-3);
      }
      .masthead {
        display: none !important;
      }
    }


  </style>
</head>
<body>

<div class="portal">
  <div class="portal-body">

    <!-- Mobile breadcrumb replacing large masthead on phones -->
    <nav class="breadcrumb mobile-breadcrumb" id="mobileBreadcrumb">
      <a href="/member/dashboard.html">Home</a>
      <span class="sep">/</span>
      <span id="mobileUserName">Dashboard</span>
    </nav>

    <!-- Who we think you are, before anything is asked of you. -->
    <header class="masthead" id="masthead"></header>

    <!-- Lead with the next real opportunity. -->
    <div id="nextAction"></div>

    <!-- Keep the three-ring picture visible; keep its copy spare. -->
    <section class="panel-card readiness-card" id="readinessSection" hidden aria-label="Profile readiness">
      <div id="readinessContent"></div>
    </section>

    <section class="impact-strip" id="impactStrip" aria-label="Your contributions" hidden></section>

    <div class="home">

      <!-- History gets the wide column to itself: the entries are one line
           each, and twelve of them is the tallest this column goes — the
           slice in load() is the cap, and "Full history" is the rest. -->
      <div class="stack">
        <section id="activitySection">
          <div class="section-head">
            <h2 class="section-title"><span class="section-title-icon" data-icon="activity" data-icon-size="16"></span>Recent activity</h2>
            <a href="/member/engagement.html" class="section-link">Full history →</a>
          </div>
          <div class="timeline" id="timeline"></div>
        </section>
      </div>

      <!-- What is being asked of you, and the standing offer to ask back. -->
      <div class="stack">
        <section id="invitesSection" hidden>
          <div class="section-head">
            <h2 class="section-title"><span class="section-title-icon" data-icon="surveys" data-icon-size="16"></span>Waiting for you</h2>
            <a href="/member/surveys.html" class="section-link">All surveys →</a>
          </div>
          <div id="invites"></div>
        </section>

        <section id="sessionsSection" hidden>
          <div class="section-head">
            <h2 class="section-title"><span class="section-title-icon" data-icon="sessions" data-icon-size="16"></span>Coming up</h2>
            <a href="/member/sessions.html" class="section-link">All sessions →</a>
          </div>
          <div id="sessions"></div>
        </section>

        <!-- The member's line to the team. It sits below both conditional
             sections so a survey actually waiting on somebody is never pushed
             under a standing invitation to write in. Circle/cohort membership
             ("where you sit") is intentionally not shown to members: it only
             decides matching and is never something a member acts on — it
             belongs in the console. -->
        <section class="panel-card say-card">
          <div class="panel-title">Feedback</div>
          <a class="btn btn-primary btn-block" href="/member/feedback.html" data-icon="send" data-icon-size="16">Share a thought</a>
        </section>

        <!-- Twelve weeks of taking part, as a record rather than a score.
             Last, and in the narrow column, because the heat grid is square:
             it is as tall as the column is wide, and it was the tallest thing
             on the page for two numbers' worth of information. -->
        <section class="panel-card" id="engagementSection">
          <div class="panel-title">Your engagement</div>
          <div class="row" style="align-items:baseline;gap:var(--sp-4);margin-bottom:var(--sp-4)">
            <div>
              <div class="big-figure" id="streakValue">—</div>
              <div class="text-xs dim mt-1" id="streakLabel">day streak</div>
            </div>
          </div>
          <div class="heat" id="heat"></div>
          <div class="heat-legend">
            <span>12 weeks ago</span>
            <span class="spacer"></span>
            <span class="heat-key">
              <span style="background:var(--tint-2)"></span>
              <span style="background:var(--blue-line)"></span>
              <span style="background:var(--cd-blue);opacity:.75"></span>
              <span style="background:var(--cd-blue)"></span>
            </span>
            <span>today</span>
          </div>
        </section>
      </div>

    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/survey-theme.js"></script>
<script src="/assets/js/brand.js"></script>
<script src="/assets/js/activity.js"></script>
<script>
  Shell.portal('dashboard');

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function watLabel(stored) {
    // parseStamp handles both shapes the two databases produce. Doing the
    // normalising here was what put "Invalid Date" on this card: appending a Z
    // to a Postgres timestamp that already carried one.
    const utc = parseStamp(stored);
    if (!utc) return '—';
    const wat = new Date(utc.getTime() + 3600000);
    return `${wat.getUTCDate()} ${MONTHS[wat.getUTCMonth()]}, ` +
           `${String(wat.getUTCHours()).padStart(2, '0')}:${String(wat.getUTCMinutes()).padStart(2, '0')} WAT`;
  }

  function showDashSkeletons() {
    document.getElementById('masthead').innerHTML =
      '<div class="skeleton" style="width:180px;height:34px;border-radius:var(--r-full)"></div>';

    document.getElementById('streakValue').textContent = '';
    document.getElementById('streakLabel').textContent = 'loading…';
    document.getElementById('heat').innerHTML =
      Array(84).fill('<span class="heat-cell"></span>').join('');

    document.getElementById('timeline').innerHTML =
      Array(4).fill('<div class="tl-item"><span class="skeleton" style="width:16px;height:16px;border-radius:50%"></span>' +
        '<div style="flex:1"><div class="skeleton" style="height:12px;width:80%;margin-bottom:6px"></div></div></div>').join('');

    document.getElementById('invites').innerHTML =
      Array(2).fill('<div class="skeleton" style="height:64px;width:100%;border-radius:var(--r-lg)"></div>').join('');

    document.getElementById('sessions').innerHTML =
      Array(2).fill('<div class="skeleton" style="height:48px;width:100%;border-radius:var(--r-lg)"></div>').join('');
  }

  async function load() {
    showDashSkeletons();
    try {
      const [profile, surveys, engagement, sessions] = await Promise.all([
        api.get('/users/profile'),
        api.get('/users/surveys'),
        api.get('/users/engagement?limit=200'),
        api.get('/users/sessions')
      ]);

      renderMasthead(profile);
      renderImpact(profile.stats);
      renderNextAction(profile, surveys.surveys, sessions.sessions);
      renderReadiness(profile.readiness);
      renderHeat(engagement.history, profile.stats);
      renderInvites(surveys.surveys);
      renderSessions(sessions.sessions);
      // Twelve rather than eight: history has the wide column to itself now,
      // and eight entries left most of it empty. "Full history" still has the
      // rest.
      renderTimeline(engagement.history.slice(0, 12));
    } catch (err) {
      showToast('Failed to load: ' + err.message, 'error');
    }
  }

  function renderReadiness(readiness) {
    const section = document.getElementById('readinessSection');
    const el = document.getElementById('readinessContent');
    if (!section || !el || !readiness) return;

    const rings = readiness.rings || [];
    const geometry = [
      { radius:64, length:402.12 },
      { radius:50, length:314.16 },
      { radius:36, length:226.19 }
    ];
    const arcs = rings.slice(0, 3).map((ring, index) => {
      const { radius, length } = geometry[index];
      const percentage = Math.max(0, Math.min(100, Number(ring.percentage) || 0));
      const offset = (length * (1 - percentage / 100)).toFixed(2);
      const color = escapeHtml(ring.color || '#0D9488');
      return `<circle class="readiness-arc" cx="80" cy="80" r="${radius}" stroke-width="8" ` +
        `stroke-dasharray="${length}" stroke-dashoffset="${offset}" stroke="${color}" transform="rotate(-90 80 80)"></circle>`;
    }).join('');
    const tracks = geometry.map(({ radius }) =>
      `<circle class="readiness-track" cx="80" cy="80" r="${radius}" stroke-width="8"></circle>`
    ).join('');
    const legend = rings.slice(0, 3).map(ring => `
      <div class="readiness-item">
        <span class="readiness-swatch" style="background:${escapeHtml(ring.color || '#0D9488')}"></span>
        <div>
          <div class="readiness-item-name">${escapeHtml(ring.name)}</div>
          <div class="readiness-item-note">${escapeHtml(ring.subtitle || '')}</div>
        </div>
        <span class="readiness-item-score">${Math.round(ring.percentage || 0)}%</span>
      </div>`).join('');
    const tasks = readiness.unfinished_tasks || [];
    const action = readiness.next_action;
    const footer = readiness.is_complete
      ? `<a class="readiness-edit" href="/member/profile.html" aria-label="Edit profile" title="Edit profile">${icon('edit', 16)}</a>`
      : `<span class="readiness-missing">${tasks.length} item${tasks.length === 1 ? '' : 's'} left</span>
         ${action ? `<a class="btn btn-sm btn-primary" href="${escapeHtml(action.action_url)}">${escapeHtml(action.action_label)} ${icon('arrowRight', 14)}</a>` : ''}`;

    section.hidden = false;
    el.innerHTML = `
      <div class="readiness-panel">
        <div class="readiness-visual">
          <svg class="readiness-svg" viewBox="0 0 160 160" role="img" aria-label="${readiness.overall_percentage}% readiness">
            ${tracks}${arcs}
            <text x="80" y="77" text-anchor="middle" class="readiness-center">${readiness.overall_percentage}%</text>
            <text x="80" y="94" text-anchor="middle" class="readiness-center-label">${readiness.completed_rings}/3 RINGS</text>
          </svg>
        </div>
        <div class="readiness-copy">
          <div class="readiness-head">
            <h2 class="readiness-title">Readiness</h2>
          </div>
          <div class="readiness-legend">${legend}</div>
          <div class="readiness-foot">${footer}</div>
        </div>
      </div>`;
  }

  // ─── Who we think you are ─────────────────────────────────
  // Whatever stands on this line has to be true in every circle. A circle is a
  // workspace, not a tier of one: api_status and kyb_completed are the
  // Developer Hub's facts about somebody integrating against the Credit Direct
  // APIs, and they used to sit here as SANDBOX / KYB PENDING badges — which is
  // a heading about API integration on the dashboard of a circle that may have
  // nothing to do with the APIs. They are still on the member's record and
  // still in the console, where the audience is the team that acts on them.
  //
  // What replaces them is the profile the member filled in themselves, which
  // every circle collects: where they work, what they work on, and how long
  // they have been here.
  function mastheadFacts(user) {
    const joined = parseStamp(user.created_at);
    return [
      user.company,
      user.work_sector,
      joined ? `Member since ${MONTHS[joined.getUTCMonth()]} ${joined.getUTCFullYear()}` : null
    ].filter(Boolean);
  }

  function renderMasthead({ user, stats }) {
    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

    const mobileName = document.getElementById('mobileUserName');
    if (mobileName) {
      mobileName.textContent = `${firstName(user.name) || user.email}${user.company ? ' · ' + user.company : ''}`;
    }

    // The tone followed api_status too. It follows the streak now — the same
    // orbitLevel the rings around the avatar already draw, which is one shared
    // definition rather than two, and is measured the same way in every circle.
    const level = orbitLevel(stats.streak);

    document.getElementById('masthead').innerHTML = `
      ${orbitAvatar(personName(user.name, user.email), level, 'avatar-xl ' + (level >= 3 ? 'avatar-teal' : 'avatar-gold'))}
      <div style="min-width:0">
        <div class="text-xs dim">${greeting}</div>
        <h1 class="masthead-name">${escapeHtml(firstName(user.name) || user.email)}</h1>
        <div class="masthead-line">
          ${mastheadFacts(user)
            .map(fact => `<span>${escapeHtml(fact)}</span>`)
            .join('<span class="dim">·</span>')}
        </div>
      </div>`;
  }

  // Twelve weeks of daily activity, counted from the engagement history the
  // member is entitled to see anyway. Weeks run in columns, days down.
  function renderHeat(history, stats) {
    const WEEKS = 12;
    const counts = new Map();
    history.forEach(e => {
      const day = String(e.created_at).slice(0, 10);
      counts.set(day, (counts.get(day) || 0) + 1);
    });

    // Start on the Sunday twelve weeks back, so columns are whole weeks.
    const today = new Date();
    const start = new Date(today);
    start.setDate(today.getDate() - (WEEKS * 7 - 1) - today.getDay());

    let cells = '';
    for (let i = 0; i < WEEKS * 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = d.toISOString().slice(0, 10);
      const n = counts.get(key) || 0;
      const level = n === 0 ? '' : n === 1 ? 'l1' : n <= 3 ? 'l2' : 'l3';
      const ahead = d > today;
      const label = ahead ? '' : `${n} event${n === 1 ? '' : 's'} on ${d.toDateString().slice(4)}`;
      cells += `<span class="heat-cell ${level}"${ahead ? ' style="opacity:.25"' : ''} title="${label}"></span>`;
    }

    document.getElementById('heat').innerHTML = cells;
    document.getElementById('streakValue').textContent = stats.streak;
    document.getElementById('streakLabel').textContent =
      stats.streak && stats.streak === stats.best_streak
        ? 'day streak — your best yet'
        : `day streak · best ${stats.best_streak}`;
  }

  function renderImpact(stats = {}) {
    const section = document.getElementById('impactStrip');
    const contributions = [
      ['surveys_completed', 'Surveys answered', 'surveys'],
      ['feedback_submitted', 'Feedback shared', 'feedback'],
      ['gifts_claimed', 'Rewards claimed', 'gifts']
    ];
    section.innerHTML = `<div class="impact-heading">Your footprint</div>` + contributions.map(([key, label, glyph]) => `
      <div class="impact-tile">
        <span class="impact-icon">${icon(glyph, 17)}</span>
        <div class="impact-info">
          <strong class="impact-number">${Number(stats[key] || 0).toLocaleString()}</strong>
          <span class="impact-label">${label}</span>
        </div>
      </div>`).join('');
    section.hidden = false;
  }

  // Feature one real next action; its icon carries the kind of activity at a glance.
  function renderNextAction(profile, surveys, sessions) {
    const el = document.getElementById('nextAction');
    const waiting = (surveys || []).filter(s => !s.completed);
    const soon = (sessions || [])[0];

    if (soon) {
      el.innerHTML = `
        <div class="next-action dashboard-action">
          <div class="action-visual">${icon('sessions', 25)}</div>
          <div class="action-copy">
            <div class="eyebrow">Coming up</div>
            <div class="headline">${escapeHtml(soon.title)}</div>
            <p class="detail">
              ${watLabel(soon.scheduled_for)} · ${soon.duration_min} min${soon.location ? ' · ' + escapeHtml(soon.location) : ''}
              ${soon.clashes_with_availability ? `<br><span class="clash">${escapeHtml(soon.clash_reason)}</span>` : ''}
            </p>
            <div class="row-tight wrap">
              ${soon.survey_id ? `<a class="btn btn-primary" href="/member/survey.html?id=${soon.survey_id}">${icon('surveys', 15)} Open survey</a>` : ''}
              <a class="btn btn-ghost" href="/member/sessions.html">All sessions ${icon('arrowRight', 14)}</a>
            </div>
          </div>
        </div>`;
      return;
    }

    if (waiting.length) {
      const survey = waiting[0];
      el.innerHTML = `
        <div class="next-action dashboard-action">
          <div class="action-visual">${icon('surveys', 25)}</div>
          <div class="action-copy">
            <div class="eyebrow">${waiting.length} open survey${waiting.length === 1 ? '' : 's'}</div>
            <div class="headline">${escapeHtml(survey.title)}</div>
            <p class="detail">${survey.time_estimate_min} min · ${survey.question_count} question${survey.question_count === 1 ? '' : 's'}</p>
            <a class="btn btn-primary" href="/member/survey.html?id=${survey.id}">Take part ${icon('arrowRight', 15)}</a>
          </div>
        </div>`;
      return;
    }

    el.innerHTML = `
      <div class="next-action dashboard-action quiet">
        <div class="action-visual">${icon('activity', 25)}</div>
        <div class="action-copy">
          <div class="headline">Nothing waiting.</div>
          <a class="btn btn-secondary" href="/member/feedback.html">Share a thought ${icon('arrowRight', 14)}</a>
        </div>
      </div>`;
  }

  async function grantConsent() {
    try {
      const { consent } = await api.get('/users/profile');
      for (const c of consent.filter(c => c.status === 'pending')) {
        await api.post('/users/consent', { channel: c.channel });
      }
      showToast('Thank you — preferences saved');
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  function renderInvites(surveys) {
    const waiting = surveys.filter(s => !s.completed);
    document.getElementById('invitesSection').hidden = !waiting.length;
    if (!waiting.length) return;

    document.getElementById('invites').innerHTML = waiting.slice(0, 3).map(s => `
      <a class="invite" href="/member/survey.html?id=${s.id}">
        <div class="invite-title">${escapeHtml(s.title)}</div>
        ${s.description ? `<p class="invite-desc">${escapeHtml(s.description)}</p>` : ''}
        <div class="invite-foot">
          <span class="btn btn-sm btn-primary">Start ${icon('arrowRight', 13)}</span>
          <span class="invite-cost">~${s.time_estimate_min} min · ${s.question_count} question${s.question_count === 1 ? '' : 's'}</span>
        </div>
      </a>`).join('');
  }

  function renderSessions(sessions) {
    document.getElementById('sessionsSection').hidden = !sessions.length;
    if (!sessions.length) return;

    document.getElementById('sessions').innerHTML = sessions.slice(0, 3).map(s => `
      <div class="row-item">
        <span class="when-chip">${watLabel(s.scheduled_for)}</span>
        <div style="flex:1;min-width:0">
          <div class="row-item-title">${escapeHtml(s.title)}</div>
          <div class="row-item-meta">
            ${s.duration_min} min${s.location ? ' · ' + escapeHtml(s.location) : ''}
            ${s.clashes_with_availability ? ` · <span class="clash">${escapeHtml(s.clash_reason)}</span>` : ''}
          </div>
        </div>
        ${s.survey_id ? `<a class="btn btn-sm btn-secondary" href="/member/survey.html?id=${s.survey_id}">${icon('surveys', 13)} Survey</a>` : ''}
      </div>`).join('');
  }

  function renderTimeline(history) {
    const el = document.getElementById('timeline');
    if (!history.length) {
      el.innerHTML = emptyState({ title: 'Nothing here yet', text: 'Your history builds up as you take part.' });
      return;
    }

    let lastDay = null;
    el.innerHTML = history.map(h => {
      const info = activityInfo(h.type);
      const day = activityDayLabel(h.created_at);
      const divider = day !== lastDay ? `<div class="tl-divider">${day}</div>` : '';
      lastDay = day;

      // Written back to the member in the second person.
      const text = info.text
        .replace(/^was /, 'You were ')
        .replace(/^(joined|completed|started|claimed|received|submitted|logged|made|went|requested)/, 'You $1');

      return `
        ${divider}
        <div class="tl-item">
          <div class="tl-dot ${info.tone}"></div>
          <div class="tl-head">
            <span class="tl-title">${text.charAt(0).toUpperCase() + text.slice(1)}</span>
            <span class="tl-time">${formatDate(h.created_at)}</span>
          </div>
        </div>`;
    }).join('');
  }

  load();
</script>
</body>
</html>
