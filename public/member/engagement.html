<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Your activity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    .page-title-lg { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-2xl); letter-spacing: -0.03em; }
    .lede { color: var(--ash); font-size: var(--fs-sm); margin-top: var(--sp-1); max-width: 52ch; }
    .provenance { font-size: 10px; font-family: var(--font-mono); color: var(--cd-clay); text-transform: uppercase; letter-spacing: 0.06em; }
  </style>
</head>
<body>

<div class="portal">
  <div class="portal-body">

    <header class="mb-6">
      <h1 class="page-title-lg">Your history with Credit Direct</h1>
      <p class="lede">Everything you have done here, and everything we have recorded about your integration. Nobody else can see this.</p>
    </header>

    <div class="figures" id="figures"></div>

    <div class="toolbar">
      <button class="chip active" data-group="">Everything</button>
      <button class="chip" data-group="integration">Integration</button>
      <button class="chip" data-group="survey">Surveys</button>
      <button class="chip" data-group="reward">Rewards</button>
      <button class="chip" data-group="voice">Feedback</button>
      <span class="result-count" id="count"></span>
    </div>

    <div class="timeline" id="timeline">
      <div class="tl-item"><div class="skeleton" style="width:60%"></div></div>
      <div class="tl-item"><div class="skeleton" style="width:48%"></div></div>
    </div>

  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/activity.js"></script>
<script>
  Shell.portal('engagement');

  const GROUPS = {
    integration: ['account_created', 'api_key_generated', 'first_sandbox_call', 'first_production_call', 'kyb_completed', 'product_requested'],
    survey: ['survey_invited', 'survey_started', 'survey_completed'],
    reward: ['gift_claimed', 'gift_delivered'],
    voice: ['feedback_submitted', 'complaint_received']
  };

  let events = [];
  let group = '';

  async function load() {
    try {
      const [profile, engagement] = await Promise.all([
        api.get('/users/profile'),
        api.get('/users/engagement?limit=100')
      ]);

      events = engagement.history;
      renderFigures(profile.stats);
      render();
    } catch (err) {
      document.getElementById('timeline').innerHTML =
        emptyState({ title: 'Could not load your history', text: err.message });
    }
  }

  function renderFigures(s) {
    document.getElementById('figures').innerHTML = `
      <div><div class="figure-value">${s.surveys_completed}</div><div class="figure-label">Surveys answered</div></div>
      <div><div class="figure-value">${s.gifts_claimed}</div><div class="figure-label">Rewards claimed</div></div>
      <div><div class="figure-value">${s.feedback_submitted}</div><div class="figure-label">Feedback given</div></div>
      <div><div class="figure-value">${s.streak}</div><div class="figure-label">Current streak</div></div>
      <div><div class="figure-value">${s.best_streak}</div><div class="figure-label">Best streak</div></div>`;
  }

  function render() {
    const list = group ? events.filter(e => GROUPS[group].includes(e.type)) : events;
    document.getElementById('count').textContent = `${list.length} event${list.length === 1 ? '' : 's'}`;

    const el = document.getElementById('timeline');
    if (!list.length) {
      el.innerHTML = emptyState({
        title: group ? 'Nothing of this kind yet' : 'Nothing recorded yet',
        text: 'Your history fills in as you integrate, answer surveys and claim rewards.'
      });
      return;
    }

    let lastDay = null;
    el.innerHTML = list.map(e => {
      const info = activityInfo(e.type);
      const day = activityDayLabel(e.created_at);
      const divider = day !== lastDay ? `<div class="tl-divider">${day}</div>` : '';
      lastDay = day;

      // Anything the metadata makes specific — which survey, which reward.
      let detail = '';
      try {
        const meta = typeof e.metadata === 'string' ? JSON.parse(e.metadata || '{}') : (e.metadata || {});
        detail = meta.survey_title || meta.gift || meta.category || (meta.channel ? `via ${meta.channel}` : '');
      } catch { /* metadata is optional */ }

      // Written in the second person: this is the member's own record.
      const text = info.text
        .replace(/^was /, 'You were ')
        .replace(/^(joined|completed|started|claimed|received|submitted|logged|made|went|requested)/, 'You $1');

      const from = e.source && !['dev_circle', 'system'].includes(e.source)
        ? `<span class="provenance">${escapeHtml(e.source.replace('_', '.'))}</span>` : '';

      return `
        ${divider}
        <div class="tl-item">
          <div class="tl-dot ${info.tone}"></div>
          <div class="tl-head">
            <span class="tl-title">${text.charAt(0).toUpperCase() + text.slice(1)}</span>
            ${from}
            <span class="tl-time">${formatDate(e.created_at)}</span>
          </div>
          ${detail ? `<div class="tl-body">${escapeHtml(detail)}</div>` : ''}
        </div>`;
    }).join('');
  }

  document.querySelectorAll('.chip[data-group]').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      group = chip.dataset.group;
      render();
    });
  });

  load();
</script>
</body>
</html>
