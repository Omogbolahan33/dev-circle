<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Survey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    .survey-header {
      padding: var(--sp-4) var(--sp-6);
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(160, 160, 184, 0.06); flex-shrink: 0;
    }
    .survey-logo { font-family: var(--font-display); font-weight: var(--fw-black); font-size: var(--fs-md); letter-spacing: -0.03em; }
    .survey-logo span { color: var(--cd-blue); }
    .survey-meta-bar { display: flex; align-items: center; gap: var(--sp-4); }
    .survey-id { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ash-dim); }
    .survey-exit { font-size: var(--fs-sm); color: var(--ash); cursor: pointer; background: none; border: none; }
    .survey-exit:hover { color: var(--white); }

    .survey-progress { padding: 0 var(--sp-6); padding-top: var(--sp-4); flex-shrink: 0; }
    .progress-track { height: 3px; background: rgba(160, 160, 184, 0.06); border-radius: var(--r-full); overflow: hidden; }
    .progress-fill { height: 100%; background: var(--cd-blue); border-radius: var(--r-full); transition: width var(--duration-normal) var(--ease-out); }
    .progress-label { display: flex; justify-content: space-between; margin-top: var(--sp-2); font-size: var(--fs-xs); color: var(--ash-dim); font-family: var(--font-mono); }

    .survey-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--sp-6); }
    .question-container { max-width: 640px; width: 100%; text-align: center; }
    .question-number { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--cd-blue); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: var(--sp-4); }
    .question-text { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-xl); letter-spacing: -0.02em; line-height: var(--lh-tight); margin-bottom: var(--sp-8); max-width: 520px; margin-left: auto; margin-right: auto; }

    /* Rating */
    .rating-scale { display: flex; justify-content: center; gap: var(--sp-3); margin-bottom: var(--sp-6); }
    .rating-option { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); cursor: pointer; }
    .rating-circle {
      width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(160, 160, 184, 0.15);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-lg); color: var(--ash);
      transition: all var(--duration-fast) var(--ease-out); position: relative;
    }
    .rating-circle::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; transition: border-color var(--duration-fast) var(--ease-out); }
    .rating-option:hover .rating-circle { border-color: var(--cd-blue-40); color: var(--white); }
    .rating-option.selected .rating-circle { border-color: var(--cd-blue); background: var(--cd-blue); color: var(--white); }
    .rating-option.selected .rating-circle::after { border-color: var(--cd-blue-20); }
    .rating-label { font-size: 10px; color: var(--ash-dim); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; }
    .rating-option.selected .rating-label { color: var(--cd-blue); }

    /* Choice */
    .choice-list { display: flex; flex-direction: column; gap: var(--sp-3); max-width: 480px; margin: 0 auto var(--sp-6); text-align: left; }
    .choice-item {
      display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4);
      border: 1px solid rgba(160, 160, 184, 0.08); border-radius: var(--r-md); cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out); font-size: var(--fs-base);
    }
    .choice-item:hover { border-color: var(--cd-blue-40); background: rgba(16, 126, 188, 0.04); }
    .choice-item.selected { border-color: var(--cd-blue); background: rgba(16, 126, 188, 0.08); }
    .choice-radio {
      width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(160, 160, 184, 0.15);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .choice-item.selected .choice-radio { border-color: var(--cd-blue); }
    .choice-item.selected .choice-radio::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--cd-blue); }

    /* Text */
    .text-answer { max-width: 480px; margin: 0 auto var(--sp-6); }
    .text-area {
      width: 100%; min-height: 120px; background: var(--slate); border: 1px solid rgba(160, 160, 184, 0.08);
      border-radius: var(--r-lg); padding: var(--sp-4); color: var(--white); font-family: var(--font-body);
      font-size: var(--fs-base); line-height: var(--lh-normal); resize: vertical;
      transition: border-color var(--duration-fast) var(--ease-out);
    }
    .text-area::placeholder { color: var(--ash-dim); }
    .text-area:focus { border-color: var(--cd-blue); outline: none; }
    .char-count { text-align: right; font-size: var(--fs-xs); color: var(--ash-dim); font-family: var(--font-mono); margin-top: var(--sp-1); }

    .survey-footer {
      padding: var(--sp-4) var(--sp-6); display: flex; align-items: center;
      justify-content: space-between; border-top: 1px solid rgba(160, 160, 184, 0.06); flex-shrink: 0;
    }
    .survey-footer .btn { min-width: 120px; }
    .keyboard-hint { font-size: 10px; color: var(--ash-dim); font-family: var(--font-mono); }
    .keyboard-hint kbd { display: inline-block; padding: 1px 6px; background: var(--slate-mid); border: 1px solid rgba(160, 160, 184, 0.08); border-radius: 3px; font-family: var(--font-mono); font-size: 10px; margin: 0 2px; }

    /* Completion */
    .completion-screen { display: none; flex: 1; align-items: center; justify-content: center; padding: var(--sp-6); text-align: center; }
    .completion-screen.visible { display: flex; }
    .completion-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--emerald-dim); display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto var(--sp-6); color: var(--emerald); }
    .completion-title { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-xl); letter-spacing: -0.02em; margin-bottom: var(--sp-2); }
    .completion-text { color: var(--ash); font-size: var(--fs-sm); max-width: 400px; margin: 0 auto var(--sp-6); line-height: var(--lh-loose); }
    .completion-meta { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ash-dim); margin-bottom: var(--sp-6); }

    /* Loading */
    .loading-screen { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--ash); }

    .loading-skeleton { background:linear-gradient(90deg,var(--slate) 25%,var(--slate-mid) 50%,var(--slate) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:var(--r-md); }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    @media (max-width: 768px) {
      .survey-header { padding: var(--sp-3) var(--sp-4); }
      .survey-progress { padding: var(--sp-3) var(--sp-4) 0; }
      .survey-body { padding: var(--sp-4); align-items: flex-start; padding-top: var(--sp-8); }
      .question-text { font-size: var(--fs-lg); }
      .rating-circle { width: 44px; height: 44px; font-size: var(--fs-md); }
      .rating-scale { gap: var(--sp-2); }
      .survey-footer { padding: var(--sp-3) var(--sp-4); }
      .keyboard-hint { display: none; }
    }
    @media (max-width: 480px) {
      .rating-scale { flex-wrap: wrap; gap: var(--sp-2); }
      .rating-circle { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>

  <header class="survey-header">
    <div class="survey-logo">dev<span>.</span>circle</div>
    <div class="survey-meta-bar">
      <span class="survey-id" id="surveyId">—</span>
      <button class="survey-exit" onclick="exitSurvey()">✕ Exit</button>
    </div>
  </header>

  <div class="survey-progress" id="progressSection">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-label">
      <span id="progressText">Loading…</span>
      <span id="progressTime">—</span>
    </div>
  </div>

  <main class="survey-body" id="questionView">
    <div class="loading-screen" id="loadingScreen">
      <p>Loading survey…</p>
    </div>
  </main>

  <div class="completion-screen" id="completionView">
    <div>
      <div class="completion-icon">✓</div>
      <h2 class="completion-title">Survey complete</h2>
      <p class="completion-text" id="completionText">Thank you for your feedback. Your responses help us build a better developer experience.</p>
      <div class="completion-meta" id="completionMeta">Response recorded</div>
      <div style="display:flex;gap:var(--sp-3);justify-content:center">
        <button class="btn btn-primary" onclick="window.location.href='/member/dashboard.html'">Return to Dashboard</button>
      </div>
    </div>
  </div>

  <footer class="survey-footer" id="surveyFooter">
    <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← Previous</button>
    <div class="keyboard-hint">
      Press <kbd>←</kbd> <kbd>→</kbd> to navigate · <kbd>1</kbd>–<kbd>5</kbd> to rate
    </div>
    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
  </footer>

<script src="/assets/js/api.js"></script>
<script>
  // ─── Auth Guard ──────────────────────────────────────
  if (!Auth.requireAuth(false)) throw new Error('Redirecting');

  // ─── State ───────────────────────────────────────────
  let survey = null;
  let questions = [];
  let currentIndex = 0;
  let answers = {};
  let responseId = null;

  // ─── Init ────────────────────────────────────────────
  async function init() {
    const params = new URLSearchParams(window.location.search);
    const surveyId = params.get('id');

    if (!surveyId) {
      // Show available surveys to pick from
      showSurveyPicker();
      return;
    }

    try {
      const data = await api.post(`/users/surveys/${surveyId}/start`);
      survey = data.survey;
      questions = survey.questions;
      responseId = data.response.id;

      document.getElementById('surveyId').textContent = survey.title;
      document.title = `Dev Circle — ${survey.title}`;

      renderQuestion();
    } catch (err) {
      document.getElementById('loadingScreen').innerHTML = `
        <div style="text-align:center">
          <p style="color:var(--rose);margin-bottom:var(--sp-4)">${err.message}</p>
          <button class="btn btn-primary" onclick="window.location.href='/member/dashboard.html'">Back to Dashboard</button>
        </div>`;
    }
  }

  async function showSurveyPicker() {
    try {
      const data = await api.get('/users/surveys');
      const available = data.surveys.filter(s => !s.completed);

      if (!available.length) {
        document.getElementById('loadingScreen').innerHTML = `
          <div style="text-align:center">
            <p style="font-size:var(--fs-xl);margin-bottom:var(--sp-2)">📋</p>
            <p style="color:var(--ash);margin-bottom:var(--sp-4)">No active surveys right now</p>
            <button class="btn btn-primary" onclick="window.location.href='/member/dashboard.html'">Back to Dashboard</button>
          </div>`;
        return;
      }

      document.getElementById('loadingScreen').innerHTML = `
        <div style="max-width:480px;width:100%">
          <h2 style="font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--fs-lg);margin-bottom:var(--sp-4);text-align:center">Choose a Survey</h2>
          ${available.map(s => `
            <div style="background:var(--slate);border:1px solid rgba(160,160,184,0.06);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-3);cursor:pointer" onclick="window.location.href='/member/survey.html?id=${s.id}'">
              <div style="font-weight:var(--fw-medium);margin-bottom:var(--sp-1)">${escapeHtml(s.title)}</div>
              <div style="font-size:var(--fs-xs);color:var(--ash-dim)">~${s.time_estimate_min} min · ${s.questions.length} questions</div>
            </div>
          `).join('')}
        </div>`;
    } catch (err) {
      document.getElementById('loadingScreen').innerHTML = `<p style="color:var(--rose)">${err.message}</p>`;
    }
  }

  // ─── Render Question ─────────────────────────────────
  function renderQuestion() {
    const q = questions[currentIndex];
    const progress = ((currentIndex + 1) / questions.length) * 100;
    const remaining = questions.slice(currentIndex).reduce((sum, q) => sum + (q.type === 'text' ? 1 : 0.5), 0);

    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressText').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
    document.getElementById('progressTime').textContent = `~${Math.ceil(remaining)} min remaining`;

    document.getElementById('prevBtn').disabled = currentIndex === 0;
    document.getElementById('nextBtn').textContent = currentIndex === questions.length - 1 ? 'Submit →' : 'Next →';

    let answerHtml = '';

    if (q.type === 'rating') {
      const scale = q.scale || 5;
      const labels = q.labels || [];
      answerHtml = `
        <div class="rating-scale">
          ${Array.from({length: scale}, (_, i) => {
            const val = i + 1;
            const label = labels[i] || '';
            const selected = answers[q.id] === val ? 'selected' : '';
            return `
              <div class="rating-option ${selected}" data-value="${val}" onclick="selectRating('${q.id}', ${val})" tabindex="0" role="radio" aria-checked="${selected ? 'true' : 'false'}">
                <div class="rating-circle">${val}</div>
                <span class="rating-label">${label}</span>
              </div>`;
          }).join('')}
        </div>`;
    } else if (q.type === 'choice') {
      answerHtml = `
        <div class="choice-list">
          ${q.options.map(opt => {
            const selected = answers[q.id] === opt ? 'selected' : '';
            return `
              <div class="choice-item ${selected}" onclick="selectChoice('${q.id}', '${escapeHtml(opt)}')" tabindex="0">
                <div class="choice-radio"></div>
                <div class="choice-text">${escapeHtml(opt)}</div>
              </div>`;
          }).join('')}
        </div>`;
    } else if (q.type === 'text') {
      const current = answers[q.id] || '';
      answerHtml = `
        <div class="text-answer">
          <textarea class="text-area" id="textAnswer" placeholder="Type your answer…" oninput="answers['${q.id}']=this.value;updateCharCount()">${escapeHtml(current)}</textarea>
          <div class="char-count"><span id="charCount">${current.length}</span>/500</div>
        </div>`;
    }

    document.getElementById('questionView').innerHTML = `
      <div class="question-container">
        <div class="question-number">Question ${currentIndex + 1}</div>
        <h1 class="question-text">${escapeHtml(q.text)}</h1>
        ${answerHtml}
      </div>`;

    // Focus textarea if text question
    if (q.type === 'text') {
      setTimeout(() => document.getElementById('textAnswer')?.focus(), 100);
    }
  }

  // ─── Answer Handlers ─────────────────────────────────
  function selectRating(qId, value) {
    answers[qId] = value;
    document.querySelectorAll('.rating-option').forEach(opt => {
      const isSelected = parseInt(opt.dataset.value) === value;
      opt.classList.toggle('selected', isSelected);
      opt.setAttribute('aria-checked', isSelected ? 'true' : 'false');
    });
  }

  function selectChoice(qId, value) {
    answers[qId] = value;
    document.querySelectorAll('.choice-item').forEach(item => {
      const text = item.querySelector('.choice-text').textContent;
      item.classList.toggle('selected', text === value);
    });
  }

  function updateCharCount() {
    const el = document.getElementById('charCount');
    const ta = document.getElementById('textAnswer');
    if (el && ta) el.textContent = ta.value.length;
  }

  // ─── Navigation ──────────────────────────────────────
  function nextQuestion() {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      submitSurvey();
    }
  }

  function prevQuestion() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  }

  async function submitSurvey() {
    try {
      const result = await api.post(`/users/surveys/${survey.id}/respond`, { answers });

      document.getElementById('questionView').style.display = 'none';
      document.getElementById('surveyFooter').style.display = 'none';
      document.getElementById('progressSection').style.display = 'none';

      const user = Auth.getUser();
      document.getElementById('completionText').textContent = `Thank you for your feedback, ${user.name.split(' ')[0]}. Your responses help us build a better developer experience.`;
      document.getElementById('completionMeta').textContent = `Response recorded · Engagement streak: ${result.streak} sessions`;
      document.getElementById('completionView').classList.add('visible');

    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  function exitSurvey() {
    if (Object.keys(answers).length > 0) {
      if (!confirm('You have unsaved answers. Exit anyway?')) return;
    }
    window.location.href = '/member/dashboard.html';
  }

  // ─── Keyboard Navigation ─────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'TEXTAREA') return;

    if (e.key === 'ArrowRight' || e.key === 'Enter') nextQuestion();
    if (e.key === 'ArrowLeft') prevQuestion();

    const num = parseInt(e.key);
    if (num >= 1 && num <= 5) {
      const q = questions[currentIndex];
      if (q && q.type === 'rating') selectRating(q.id, num);
    }
  });

  // ─── Start ───────────────────────────────────────────
  init();
</script>

</body>
</html>
