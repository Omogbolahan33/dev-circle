<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Survey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    /* Answering a survey is a focused mode: no nav, no sidebar, one question
       at a time. The only things on screen are the question and the way out. */
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .survey-bar {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      padding: 0 var(--sp-6);
      height: var(--topbar-h);
      border-bottom: 1px solid var(--line-faint);
      flex-shrink: 0;
    }
    .survey-name { font-size: var(--fs-sm); color: var(--ash); }

    .progress-strip { padding: var(--sp-4) var(--sp-6) 0; max-width: 640px; margin: 0 auto; width: 100%; }
    .progress-meta { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--ash-dim); margin-top: var(--sp-2); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-8) var(--sp-6);
    }

    .question-wrap { max-width: 640px; width: 100%; }
    .question-number { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--cd-blue); margin-bottom: var(--sp-3); }
    .question-text {
      font-family: var(--font-display);
      font-weight: var(--fw-bold);
      font-size: var(--fs-xl);
      letter-spacing: -0.02em;
      line-height: var(--lh-tight);
      margin-bottom: var(--sp-8);
    }

    /* Rating: the numbers are the control, big enough to hit on a phone. */
    .rating { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .rating-option { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); cursor: pointer; }
    .rating-circle {
      width: 52px; height: 52px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-weight: var(--fw-semibold);
      font-size: var(--fs-md);
      color: var(--ash);
      transition: all var(--duration-fast) var(--ease-out);
    }
    .rating-option:hover .rating-circle { border-color: var(--cd-blue-40); color: var(--white); }
    .rating-option.selected .rating-circle { background: var(--cd-blue); border-color: var(--cd-blue); color: var(--white); }
    .rating-label { font-size: 10px; color: var(--ash-dim); max-width: 60px; text-align: center; }

    .choice-list { display: flex; flex-direction: column; gap: var(--sp-2); }
    .choice-item {
      display: flex; align-items: center; gap: var(--sp-3);
      padding: var(--sp-4);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      cursor: pointer;
      font-size: var(--fs-base);
      transition: all var(--duration-fast) var(--ease-out);
    }
    .choice-item:hover { border-color: var(--line-strong); }
    .choice-item.selected { border-color: var(--cd-blue); background: var(--cd-blue-dim); }
    .choice-radio { width: 16px; height: 16px; border: 1px solid var(--line-strong); border-radius: 50%; flex-shrink: 0; }
    .choice-item.selected .choice-radio { border: 5px solid var(--cd-blue); }

    .char-count { text-align: right; font-size: var(--fs-xs); color: var(--ash-dim); margin-top: var(--sp-2); }

    .survey-foot {
      display: flex;
      justify-content: space-between;
      gap: var(--sp-3);
      padding: var(--sp-4) var(--sp-6);
      border-top: 1px solid var(--line-faint);
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
      flex-shrink: 0;
    }

    .done { max-width: 480px; text-align: center; }
    .done-mark {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--emerald-dim);
      color: var(--emerald);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-lg);
      margin: 0 auto var(--sp-5);
    }
    .done-title { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-xl); margin-bottom: var(--sp-3); }
    .done-text { color: var(--ash); font-size: var(--fs-sm); line-height: var(--lh-loose); margin-bottom: var(--sp-2); }
    .done-meta { font-size: var(--fs-xs); color: var(--ash-dim); margin-bottom: var(--sp-6); }

    .picker-item {
      display: block;
      padding: var(--sp-4);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      margin-bottom: var(--sp-3);
      text-decoration: none;
    }
    .picker-item:hover { border-color: var(--cd-blue-40); text-decoration: none; }
  </style>
</head>
<body>

  <div class="survey-bar">
    <span class="brand-mark">dev<span>.</span>circle</span>
    <span class="survey-name" id="surveyName"></span>
    <span class="spacer"></span>
    <button class="btn btn-sm btn-ghost" onclick="exitSurvey()">Save &amp; exit</button>
  </div>

  <div class="progress-strip hide" id="progressStrip">
    <div class="progress"><div class="fill" id="progressFill" style="width:0"></div></div>
    <div class="progress-meta">
      <span id="progressText"></span>
      <span id="progressTime"></span>
    </div>
  </div>

  <main id="stage">
    <div class="row"><span class="spinner"></span></div>
  </main>

  <div class="survey-foot hide" id="foot">
    <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← Back</button>
    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
  </div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
  if (!Auth.requireAuth(false)) throw new Error('Redirecting');

  let survey = null;
  let questions = [];
  let answers = {};
  let currentIndex = 0;

  async function init() {
    const surveyId = param('id');
    if (!surveyId) { showPicker(); return; }

    try {
      const data = await api.post(`/users/surveys/${surveyId}/start`);
      survey = data.survey;
      questions = survey.questions;

      document.getElementById('surveyName').textContent = survey.title;
      document.title = `Dev Circle — ${survey.title}`;
      document.getElementById('progressStrip').classList.remove('hide');
      document.getElementById('foot').classList.remove('hide');

      renderQuestion();
    } catch (err) {
      document.getElementById('stage').innerHTML = `
        <div class="done">
          <p class="done-text" style="color:var(--rose)">${escapeHtml(err.message)}</p>
          <a class="btn btn-primary" href="/member/dashboard.html">Back to home</a>
        </div>`;
    }
  }

  // Arriving without an id means "I want to answer something" — so offer
  // whatever is open rather than dead-ending.
  async function showPicker() {
    try {
      const data = await api.get('/users/surveys');
      const available = data.surveys.filter(s => !s.completed);

      document.getElementById('stage').innerHTML = available.length
        ? `<div style="max-width:480px;width:100%">
             <h1 class="done-title" style="text-align:center">Choose a survey</h1>
             ${available.map(s => `
               <a class="picker-item" href="/member/survey.html?id=${s.id}">
                 <div style="font-weight:var(--fw-medium);margin-bottom:2px">${escapeHtml(s.title)}</div>
                 <div class="text-xs dim">~${s.time_estimate_min} min · ${s.questions.length} question${s.questions.length === 1 ? '' : 's'}</div>
               </a>`).join('')}
           </div>`
        : `<div class="done">
             <div class="done-title">Nothing to answer</div>
             <p class="done-text">There are no open surveys for you right now. We will let you know when there are.</p>
             <a class="btn btn-primary" href="/member/dashboard.html">Back to home</a>
           </div>`;
    } catch (err) {
      document.getElementById('stage').innerHTML =
        `<p class="done-text" style="color:var(--rose)">${escapeHtml(err.message)}</p>`;
    }
  }

  function renderQuestion() {
    const q = questions[currentIndex];
    const progress = ((currentIndex + 1) / questions.length) * 100;
    const remaining = questions.slice(currentIndex).reduce((sum, x) => sum + (x.type === 'text' ? 1 : 0.5), 0);

    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressText').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
    document.getElementById('progressTime').textContent = `~${Math.ceil(remaining)} min left`;

    document.getElementById('prevBtn').disabled = currentIndex === 0;
    document.getElementById('nextBtn').textContent =
      currentIndex === questions.length - 1 ? 'Submit' : 'Next →';

    let control = '';

    if (q.type === 'rating') {
      const scale = q.scale || 5;
      const labels = q.labels || [];
      control = `
        <div class="rating" role="radiogroup">
          ${Array.from({ length: scale }, (_, i) => {
            const val = i + 1;
            const selected = answers[q.id] === val;
            return `
              <div class="rating-option${selected ? ' selected' : ''}" data-value="${val}"
                   onclick="selectRating('${q.id}', ${val})" tabindex="0" role="radio" aria-checked="${selected}">
                <div class="rating-circle">${val}</div>
                <span class="rating-label">${escapeHtml(labels[i] || '')}</span>
              </div>`;
          }).join('')}
        </div>`;
    } else if (q.type === 'choice') {
      control = `
        <div class="choice-list">
          ${q.options.map((opt, i) => `
            <div class="choice-item${answers[q.id] === opt ? ' selected' : ''}"
                 onclick="selectChoice('${q.id}', ${i})" tabindex="0">
              <span class="choice-radio"></span>
              <span>${escapeHtml(opt)}</span>
            </div>`).join('')}
        </div>`;
    } else {
      const current = answers[q.id] || '';
      control = `
        <textarea class="input" id="textAnswer" maxlength="500" style="min-height:160px"
                  placeholder="Type your answer…" oninput="onText('${q.id}')">${escapeHtml(current)}</textarea>
        <div class="char-count"><span id="charCount">${current.length}</span>/500</div>`;
    }

    document.getElementById('stage').innerHTML = `
      <div class="question-wrap">
        <div class="question-number">Question ${currentIndex + 1}</div>
        <h1 class="question-text">${escapeHtml(q.text)}${q.optional ? ' <span class="dim" style="font-size:var(--fs-sm);font-weight:400">(optional)</span>' : ''}</h1>
        ${control}
      </div>`;

    if (q.type === 'text') setTimeout(() => document.getElementById('textAnswer')?.focus(), 60);
  }

  function selectRating(qId, value) {
    answers[qId] = value;
    document.querySelectorAll('.rating-option').forEach(opt => {
      const on = Number(opt.dataset.value) === value;
      opt.classList.toggle('selected', on);
      opt.setAttribute('aria-checked', String(on));
    });
  }

  // Index rather than text, so an option containing a quote cannot break out.
  function selectChoice(qId, index) {
    const value = questions[currentIndex].options[index];
    answers[qId] = value;
    document.querySelectorAll('.choice-item').forEach((item, i) => {
      item.classList.toggle('selected', i === index);
    });
  }

  function onText(qId) {
    const ta = document.getElementById('textAnswer');
    answers[qId] = ta.value;
    document.getElementById('charCount').textContent = ta.value.length;
  }

  function nextQuestion() {
    if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); }
    else submitSurvey();
  }

  function prevQuestion() {
    if (currentIndex > 0) { currentIndex--; renderQuestion(); }
  }

  async function submitSurvey() {
    try {
      const result = await api.post(`/users/surveys/${survey.id}/respond`, { answers });
      const user = Auth.getUser();

      document.getElementById('progressStrip').classList.add('hide');
      document.getElementById('foot').classList.add('hide');
      document.getElementById('stage').innerHTML = `
        <div class="done">
          <div class="done-mark">✓</div>
          <div class="done-title">Thank you, ${escapeHtml(user.name.split(' ')[0])}</div>
          <p class="done-text">
            Your answers go straight to the team building the APIs you integrate with.
            That is the whole point of this — no ticket queue, no black hole.
          </p>
          <p class="done-meta">Response recorded · ${result.streak} session streak</p>
          <a class="btn btn-primary" href="/member/dashboard.html">Back to home</a>
        </div>`;
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function exitSurvey() {
    if (Object.keys(answers).length) {
      const ok = await Shell.confirm({
        title: 'Leave this survey?',
        text: 'Your answers so far are not submitted yet, and will not be kept.',
        ok: 'Leave'
      });
      if (!ok) return;
    }
    window.location.href = '/member/dashboard.html';
  }

  // Keyboard: arrows move, digits answer a rating.
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA') return;
    if (!questions.length) return;

    if (e.key === 'ArrowRight' || e.key === 'Enter') nextQuestion();
    if (e.key === 'ArrowLeft') prevQuestion();

    const num = parseInt(e.key, 10);
    const q = questions[currentIndex];
    if (num >= 1 && num <= 9 && q && q.type === 'rating' && num <= (q.scale || 5)) {
      selectRating(q.id, num);
    }
  });

  // Overlay furniture (scrim, toasts, confirm) without the portal chrome.
  Shell._mountOverlays();
  Shell._bindKeys(false);

  init();
</script>
</body>
</html>
