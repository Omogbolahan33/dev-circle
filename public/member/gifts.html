<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Rewards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    .page-title-lg { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-2xl); letter-spacing: -0.03em; }
    .lede { color: var(--ash); font-size: var(--fs-sm); margin-top: var(--sp-1); max-width: 54ch; }

    .reward {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      padding: var(--sp-4) 0;
      border-bottom: 1px solid var(--line-faint);
    }
    .reward:last-child { border-bottom: none; }
    .reward-name { font-size: var(--fs-sm); font-weight: var(--fw-medium); }
    .reward-desc { font-size: var(--fs-xs); color: var(--ash-dim); margin-top: 2px; }
    .reward-value { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-md); white-space: nowrap; }

    /* Locked rewards state their price in plain terms rather than teasing. */
    .reward.locked { opacity: 0.62; }
    .requirement { font-size: var(--fs-xs); color: var(--cd-gold); text-align: right; max-width: 220px; }

    @media (max-width: 600px) {
      .page-head-block { margin-bottom: var(--sp-3) !important; }
      .page-title-lg { font-size: var(--fs-xl); }
      .lede { display: none; }
    }
  </style>
</head>
<body>

<div class="portal">
  <div class="portal-body">

    <nav class="breadcrumb mb-3">
      <a href="/member/dashboard.html">Home</a>
      <span class="sep mobile-current">/</span>
      <span class="current mobile-current">Rewards</span>
    </nav>

    <header class="page-head-block mb-6">
      <h1 class="page-title-lg hide-on-mobile">Rewards</h1>
      <p class="lede">Small thanks for the time you put in. Nothing here is a prize draw — each one has a clear condition, and it is either met or it is not.</p>
    </header>

    <div id="claimSuccess"></div>

    <div class="figures" id="figures"></div>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Ready to claim</h2>
      </div>
      <div id="available"></div>
    </section>

    <section class="section" id="lockedSection" hidden>
      <div class="section-head">
        <h2 class="section-title">Not yet</h2>
      </div>
      <div id="locked"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Yours</h2>
      </div>
      <div id="claimed"></div>
    </section>

  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
  Shell.portal('gifts');

  function rewardRow(g, trailing, cls = '') {
    return `
      <div class="reward ${cls}">
        <div style="flex:1;min-width:0">
          <div class="reward-name">${escapeHtml(g.name)}</div>
          <div class="reward-desc">${escapeHtml(g.description || '')}</div>
        </div>
        <div class="reward-value">${money(g.value, g.currency)}</div>
        ${trailing}
      </div>`;
  }

  async function load() {
    try {
      const gifts = await api.get('/users/gifts');

      document.getElementById('figures').innerHTML = `
        <div><div class="figure-value">${gifts.claimed.length}</div><div class="figure-label">Claimed</div></div>
        <div><div class="figure-value">${gifts.progress.surveys_completed}</div><div class="figure-label">Surveys answered</div></div>
        <div><div class="figure-value">${gifts.progress.streak}</div><div class="figure-label">Day streak</div></div>`;

      document.getElementById('available').innerHTML = gifts.available.length
        ? gifts.available.map(g => rewardRow(g,
            `<button class="btn btn-sm btn-gold" onclick="claim('${g.id}', this)">Claim</button>`)).join('')
        : emptyState({
            title: 'Nothing ready yet',
            text: 'Answer a survey to unlock your first reward.',
            action: '<a class="btn btn-sm btn-primary" href="/member/dashboard.html">See open surveys</a>'
          });

      // Show what is still out of reach and exactly what it takes, rather than
      // hiding it or pretending it is available.
      document.getElementById('lockedSection').hidden = !gifts.locked.length;
      document.getElementById('locked').innerHTML = gifts.locked.map(g =>
        rewardRow(g, `<div class="requirement">${g.requirements.map(escapeHtml).join(' · ')}</div>`, 'locked')).join('');

      document.getElementById('claimed').innerHTML = gifts.claimed.length
        ? gifts.claimed.map(g => rewardRow(g,
            g.delivered_at ? badge('delivered', 'active') : badge('on its way', 'warn'))).join('')
        : '<p class="dim text-sm">Nothing claimed yet.</p>';
    } catch (err) {
      showToast('Failed to load rewards: ' + err.message, 'error');
    }
  }

  async function claim(id, button) {
    button.disabled = true;
    button.innerHTML = '<span class="spinner"></span>';
    try {
      const res = await api.post(`/users/gifts/${id}/claim`, {});
      showToast(`${res.gift.name} claimed — we will be in touch with delivery details`);

      const banner = document.getElementById('claimSuccess');
      if (banner) {
        banner.innerHTML = `
          <div class="card p-4 mb-6" style="border:1px solid var(--teal);background:var(--tint-success, rgba(13,148,136,0.08));border-radius:var(--r-lg)">
            <div class="row align-center justify-between wrap gap-3">
              <div>
                <strong style="color:var(--teal)">🎉 ${escapeHtml(res.gift.name)} claimed!</strong>
                <div class="text-xs dim mt-1">We will contact you with delivery instructions shortly.</div>
              </div>
              <div class="row gap-2">
                <a class="btn btn-sm btn-primary" href="/member/dashboard.html">Back to dashboard →</a>
                <a class="btn btn-sm btn-secondary" href="/member/engagement.html">View history</a>
              </div>
            </div>
          </div>`;
      }

      load();
    } catch (err) {
      showToast(err.message, 'error');
      button.disabled = false;
      button.textContent = 'Claim';
    }
  }

  load();
</script>
</body>
</html>
