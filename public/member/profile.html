<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <title>Dev Circle — Your profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    .profile-top { display:flex; align-items:center; gap:var(--sp-4); margin-bottom:var(--sp-4); }
    .profile-title { flex:1; min-width:0; }
    .profile-title h1 { margin:0; font-family:var(--font-display); font-size:var(--fs-2xl); letter-spacing:-.03em; }
    .profile-title p { margin:var(--sp-1) 0 0; color:var(--text-3); font-size:var(--fs-sm); }
    .identity-compact { flex:0 0 auto; display:flex; align-items:center; gap:var(--sp-2); color:var(--text-2); font-size:var(--fs-sm); }
    .identity-compact .avatar { width:40px; height:40px; }
    .profile-summary { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:var(--sp-2) var(--sp-4); margin-bottom:var(--sp-5); padding:var(--sp-3) var(--sp-4); border:1px solid var(--line); border-radius:var(--r-lg); background:var(--surface-1); }
    .summary-chips { display:flex; flex-wrap:wrap; gap:var(--sp-2); }
    .summary-chip { border-radius:var(--r-full); padding:4px 10px; background:var(--surface-2); color:var(--text-2); font-size:var(--fs-xs); }
    .membership { display:flex; flex-wrap:wrap; gap:6px; }
    .wizard-progress { margin-bottom:var(--sp-4); }
    .wizard-progress-heading { display:flex; justify-content:space-between; gap:var(--sp-3); align-items:baseline; margin-bottom:var(--sp-2); font-size:var(--fs-sm); }
    .wizard-progress-heading span { color:var(--text-3); font-size:var(--fs-xs); }
    .wizard-track { height:5px; border-radius:var(--r-full); overflow:hidden; background:var(--surface-3); margin-bottom:var(--sp-3); }
    .wizard-track-fill { display:block; width:25%; height:100%; border-radius:inherit; background:var(--cd-blue); transition:width 180ms ease; }
    .wizard-tabs { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--sp-2); }
    .wizard-tab { min-width:0; display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; align-items:center; column-gap:8px; text-align:left; padding:var(--sp-2) var(--sp-3); border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface-1); color:var(--text-2); cursor:pointer; }
    .wizard-tab.active { border-color:var(--cd-blue); background:var(--cd-blue-dim); color:var(--text-1); }
    .wizard-tab.complete .wizard-number { background:var(--teal); color:white; }
    .wizard-number { grid-row:1/3; display:grid; place-items:center; width:25px; height:25px; border-radius:50%; background:var(--surface-3); font-size:var(--fs-xs); font-weight:var(--fw-semibold); }
    .wizard-tab > span:not(.wizard-number) { font-size:var(--fs-sm); font-weight:var(--fw-semibold); }
    .wizard-tab small { color:var(--text-3); font-size:10px; line-height:1.2; }
    .profile-card { max-width:900px; margin:0 auto; border:1px solid var(--line); border-radius:var(--r-xl); background:var(--surface-1); overflow:hidden; }
    .profile-panel { display:none; padding:clamp(var(--sp-4),4vw,var(--sp-7)); min-height:350px; }
    .profile-panel.active { display:block; }
    .profile-panel[hidden] { display:none !important; }
    .panel-heading { margin-bottom:var(--sp-5); }
    .panel-heading h2 { margin:4px 0 0; font-family:var(--font-display); font-size:var(--fs-xl); letter-spacing:-.02em; }
    .panel-kicker { color:var(--text-3); font-size:10px; font-weight:var(--fw-bold); letter-spacing:.12em; }
    .panel-intro { margin:calc(var(--sp-4) * -1) 0 var(--sp-5); color:var(--text-3); font-size:var(--fs-sm); }
    .field-row { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--sp-4); }
    .field { min-width:0; margin-bottom:var(--sp-4); }
    .field-note { margin-left:6px; color:var(--text-3); font-size:var(--fs-xs); font-weight:400; }
    .choice-grid { display:flex; flex-wrap:wrap; gap:var(--sp-2); }
    .choice { display:inline-flex; align-items:center; padding:9px 14px; border:1px solid var(--line); border-radius:var(--r-full); font-size:var(--fs-sm); color:var(--text-2); cursor:pointer; transition:background 140ms,border-color 140ms,color 140ms; }
    .choice:hover { border-color:var(--line-strong); color:var(--text-1); }
    .choice.selected { background:var(--cd-blue-dim); border-color:var(--cd-blue); color:var(--cd-blue); }
    .segment-result { display:flex; justify-content:space-between; align-items:center; gap:var(--sp-3); margin-top:var(--sp-6); padding:var(--sp-3) var(--sp-4); border-radius:var(--r-md); background:var(--surface-2); color:var(--text-2); font-size:var(--fs-sm); }
    .segment-result strong { color:var(--text-1); }
    .consent-summary { margin-top:var(--sp-4); color:var(--text-3); font-size:var(--fs-xs); }
    .wizard-actions { position:sticky; bottom:0; display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) clamp(var(--sp-4),4vw,var(--sp-7)); border-top:1px solid var(--line); background:var(--surface-1); }
    .wizard-actions .save-feedback { flex:1; color:var(--text-3); font-size:var(--fs-xs); }
    .wizard-actions button:disabled { opacity:.45; cursor:not-allowed; }
    @media(max-width:640px) {
      .profile-top { align-items:flex-start; gap:var(--sp-2); flex-wrap:wrap; }
      .profile-title { order:3; flex-basis:100%; }
      .profile-title h1 { font-size:var(--fs-xl); }
      .profile-summary { align-items:flex-start; flex-direction:column; }
      .wizard-tabs { gap:5px; }
      .wizard-tab { display:flex; flex-direction:column; align-items:flex-start; gap:4px; padding:8px; }
      .wizard-tab small { display:none; }
      .wizard-number { width:22px; height:22px; }
      .field-row { grid-template-columns:1fr; gap:0; }
      .profile-panel { min-height:300px; }
      .wizard-actions { flex-wrap:wrap; }
      .wizard-actions .save-feedback { flex-basis:100%; order:3; }
      .wizard-actions button { flex:1; }
    }
  </style>
</head>
<body>

<div class="portal">
  <div class="portal-body">

    <header class="profile-top">
      <a class="btn btn-ghost btn-sm" href="/member/dashboard.html">← Home</a>
      <div class="profile-title">
        <h1>Your profile</h1>
      </div>
      <div id="identity" class="identity-compact"><span class="skeleton" style="width:40px;height:40px;border-radius:50%"></span></div>
    </header>

    <div class="profile-summary">
      <div class="summary-chips" id="standing">
        <span class="skeleton" style="width:110px;height:22px"></span>
        <span class="skeleton" style="width:90px;height:22px"></span>
      </div>
      <div id="membership" class="membership"></div>
    </div>

    <div class="wizard-progress" aria-live="polite">
      <div class="wizard-progress-heading">
        <strong id="wizardStepLabel">Step 1 of 4 · About you</strong>
        <span id="wizardDoneLabel">Progress saves as you continue</span>
      </div>
      <div class="wizard-track" role="progressbar" aria-label="Profile sections" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1">
        <span class="wizard-track-fill" id="wizardTrackFill"></span>
      </div>
      <nav class="wizard-tabs" id="wizardTabs" aria-label="Profile sections">
        <button type="button" class="wizard-tab active" data-step="0" aria-current="step"><span class="wizard-number">1</span><span>About</span><small id="stepState0">In progress</small></button>
        <button type="button" class="wizard-tab" data-step="1"><span class="wizard-number">2</span><span>Products</span><small id="stepState1">Not started</small></button>
        <button type="button" class="wizard-tab" data-step="2"><span class="wizard-number">3</span><span>Availability</span><small id="stepState2">Not started</small></button>
        <button type="button" class="wizard-tab" data-step="3"><span class="wizard-number">4</span><span>Contact</span><small id="stepState3">Not started</small></button>
      </nav>
    </div>

    <main class="profile-card">
      <section class="profile-panel active" id="about" data-profile-step="0" aria-labelledby="aboutTitle">
        <div class="panel-heading"><span class="panel-kicker">STEP 1</span><h2 id="aboutTitle" tabindex="-1">About you</h2></div>
        <div class="field-row">
          <div class="field"><label class="label" for="fName">Name</label><input type="text" class="input" id="fName" autocomplete="name"></div>
          <div class="field"><label class="label" for="fEmail">Email <span class="field-note">Read-only</span></label><input type="email" class="input" id="fEmail" disabled autocomplete="email"></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="label" for="fPhone">Phone</label><input type="tel" class="input" id="fPhone" placeholder="+234…" autocomplete="tel"><small class="field-note" id="fPhoneHint"></small></div>
          <div class="field"><label class="label" for="fCompany">Company</label><input type="text" class="input" id="fCompany" autocomplete="organization"></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="label" for="fSector">Work sector</label><select class="input" id="fSector"><option value="">Select work sector</option></select></div>
          <div class="field"><label class="label" for="fLocation">Location</label><select class="input" id="fLocation"><option value="">Select state</option></select></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="label" for="fAgeGroup">Age group</label><select class="input" id="fAgeGroup"><option value="">Select age group</option></select></div>
          <div class="field"><label class="label" for="fGender">Gender</label><select class="input" id="fGender"><option value="">Prefer not to say</option></select></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="label" for="fEmployment">Employment</label><select class="input" id="fEmployment"><option value="">Select employment type</option></select></div>
          <div class="field"><label class="label" for="fPreferredResearch">Preferred research</label><select class="input" id="fPreferredResearch"><option value="">Select preferred research</option></select></div>
        </div>
      </section>

      <section class="profile-panel" id="products" data-profile-step="1" aria-labelledby="productsTitle" hidden>
        <div class="panel-heading"><span class="panel-kicker">STEP 2</span><h2 id="productsTitle" tabindex="-1">Products you use</h2></div>
        <p class="panel-intro">Choose all that apply.</p>
        <div class="choice-grid product-choices" id="productGroup"></div>
        <div class="segment-result"><span>Participant segment</span><strong id="participantSegmentValue" aria-live="polite">—</strong></div>
      </section>

      <section class="profile-panel" id="availability" data-profile-step="2" aria-labelledby="availabilityTitle" hidden>
        <div class="panel-heading"><span class="panel-kicker">STEP 3</span><h2 id="availabilityTitle" tabindex="-1">Availability</h2></div>
        <div class="field"><label class="label">Days that work</label><div class="choice-grid" id="dayGroup"></div></div>
        <div class="field-row">
          <div class="field"><label class="label" for="fTimeStart">From</label><input type="time" class="input" id="fTimeStart"></div>
          <div class="field"><label class="label" for="fTimeEnd">Until</label><input type="time" class="input" id="fTimeEnd"></div>
        </div>
      </section>

      <section class="profile-panel" id="channels" data-profile-step="3" aria-labelledby="channelsTitle" hidden>
        <div class="panel-heading"><span class="panel-kicker">STEP 4</span><h2 id="channelsTitle" tabindex="-1">Contact preferences</h2></div>
        <p class="panel-intro">Choosing a channel also gives permission to contact you there.</p>
        <div class="choice-grid" id="channelGroup"></div>
        <div id="consentSummary" class="consent-summary"></div>
      </section>

      <div class="wizard-actions">
        <button type="button" class="btn btn-ghost" id="wizardBack" disabled>Back</button>
        <span class="save-feedback" id="saveFeedback" role="status" aria-live="polite"></span>
        <button type="button" class="btn btn-primary" id="wizardContinue">Save &amp; continue</button>
        <button type="button" class="btn btn-primary hide" id="wizardSave">Save changes</button>
      </div>
    </main>

  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/survey-theme.js"></script>
<script src="/assets/js/brand.js"></script>
<script>
  Shell.portal('profile');

  const CHANNELS = { email: 'Email', whatsapp: 'WhatsApp', sms: 'SMS', calls: 'Phone calls', in_portal: 'In-portal' };
  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  let participantSegmentRules = [];

  function renderChoices(groupId, options, selected) {
    document.getElementById(groupId).innerHTML = Object.entries(options).map(([value, label]) => `
      <button type="button" class="choice${selected.includes(value) ? ' selected' : ''}" data-value="${value}">
        ${escapeHtml(label)}
      </button>`).join('');

    document.querySelectorAll(`#${groupId} .choice`).forEach(el => {
      el.addEventListener('click', () => {
        el.classList.toggle('selected');
        document.getElementById('saveFeedback').textContent = 'Unsaved changes';
        if (groupId === 'productGroup') updateParticipantSegment();
      });
    });
  }

  function getChoices(groupId) {
    return Array.from(document.querySelectorAll(`#${groupId} .choice.selected`)).map(el => el.dataset.value);
  }

  function updateParticipantSegment() {
    const count = new Set(getChoices('productGroup').map(value => value.trim()).filter(Boolean)).size;
    const rule = participantSegmentRules.find(item => count >= item.min_products
      && (item.max_products === null || count <= item.max_products));
    document.getElementById('participantSegmentValue').textContent = rule?.value || '—';
  }

  function renderStanding(user, circles, cohorts) {
    document.getElementById('standing').innerHTML = `
      <span class="summary-chip">API ${escapeHtml(user.api_status || '—')}</span>
      <span class="summary-chip">KYB ${user.kyb_completed ? 'complete' : 'pending'}</span>
      ${user.dev_hub_user_id ? '<span class="summary-chip">Developer Hub linked</span>' : ''}`;
    const tags = [
      ...(circles || []).map(c => `<span class="tag" style="background:${c.color}1F;color:${c.color}">${escapeHtml(c.name)}</span>`),
      ...(cohorts || []).map(c => `<span class="tag" style="background:${c.color}1F;color:${c.color}">${escapeHtml(c.name)}</span>`)
    ];
    document.getElementById('membership').innerHTML = tags.join('');
  }

  async function load() {
    try {
      const profile = await api.get('/users/profile');
      const { user, stats, consent, circles, cohorts, readiness } = profile;
      participantSegmentRules = profile.segment_rules || [];
      renderStanding(user, circles, cohorts);
      const fieldCatalog = Object.fromEntries((profile.profile_field_catalog || []).map(field => [field.key, field]));
      const fillSelect = (id, fieldKey, fallbackOptions, placeholder) => {
        const select = document.getElementById(id);
        const options = fieldCatalog[fieldKey]?.values || fallbackOptions || [];
        select.innerHTML = `<option value="">${escapeHtml(placeholder)}</option>` +
          options.map(option => {
            const value = typeof option === 'object' ? option.value : option;
            const label = typeof option === 'object' ? option.label : option;
            return `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`;
          }).join('');
      };
      fillSelect('fSector', 'work_sector', [], 'Select work sector');
      fillSelect('fLocation', 'location_state', profile.location_options || [], 'Select state');
      fillSelect('fAgeGroup', 'age_group', [], 'Select age group');
      fillSelect('fGender', 'gender', [], 'Prefer not to say');
      fillSelect('fEmployment', 'employment', [], 'Select employment type');
      fillSelect('fPreferredResearch', 'preferred_research', profile.preferred_research_options || [], 'Select preferred research');
      const setSelectValue = (id, value) => {
        const select = document.getElementById(id);
        if (value && !Array.from(select.options).some(option => option.value === value)) {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          select.appendChild(option);
        }
        select.value = value || '';
      };

      // The one part of the integration a member declares themselves.
      const participantChoices = fieldCatalog.products?.values || [];
      const catalog = participantChoices.length
        ? Object.fromEntries(participantChoices.map(option => [option.value, option.label]))
        : Object.fromEntries((profile.product_catalog || []).map(product => [product.key, product.label]));
      renderChoices('productGroup', catalog, user.products || []);
      updateParticipantSegment();

      const phoneInput = document.getElementById('fPhone');
      const phoneHint = document.getElementById('fPhoneHint');
      if (user.phone_normalized || user.phone) {
        phoneInput.value = user.phone || user.phone_normalized;
        phoneInput.readOnly = true;
        phoneInput.setAttribute('aria-readonly', 'true');
        phoneHint.textContent = 'Read-only';
      } else {
        phoneHint.textContent = 'Used for sign-in';
      }

      const level = orbitLevel(stats.streak);
      document.getElementById('identity').innerHTML = `
        ${orbitAvatar(personName(user.name, user.email), level, 'avatar' + (level >= 3 ? ' avatar-teal' : ' avatar-gold'))}
        <span>${escapeHtml(personName(user.name, user.email))}</span>`;

      document.getElementById('fName').value = user.name || '';
      document.getElementById('fEmail').value = user.email || '';
      document.getElementById('fPhone').value = user.phone || '';
      document.getElementById('fCompany').value = user.company || '';
      setSelectValue('fSector', user.work_sector);
      setSelectValue('fLocation', user.location_state);
      setSelectValue('fAgeGroup', user.age_group);
      setSelectValue('fGender', user.gender);
      setSelectValue('fEmployment', user.employment);
      setSelectValue('fPreferredResearch', user.preferred_research);
      document.getElementById('fTimeStart').value = user.preferred_time_start || '10:00';
      document.getElementById('fTimeEnd').value = user.preferred_time_end || '14:00';

      renderChoices('dayGroup', Object.fromEntries(DAYS.map(d => [d, d])), user.preferred_days || []);
      renderChoices('channelGroup', CHANNELS, user.preferred_channels || []);

      const granted = (consent || []).filter(c => c.status === 'granted').map(c => c.channel);
      document.getElementById('consentSummary').textContent = granted.length
        ? `Permission on file: ${granted.map(channel => CHANNELS[channel] || channel).join(', ')}`
        : '';

      renderWizardProgress(readiness);
      handleHash();
    } catch (err) {
      showToast('Failed to load profile: ' + err.message, 'error');
    }
  }

  const PROFILE_STEPS = [
    { id: 'about', title: 'About you', keys: ['name', 'phone', 'company', 'work_sector', 'location_state', 'age_group', 'gender', 'employment', 'preferred_research'] },
    { id: 'products', title: 'Products', keys: ['products'] },
    { id: 'availability', title: 'Availability', ring: 'availability' },
    { id: 'channels', title: 'Contact', ring: 'channels' }
  ];
  let activeStep = 0;
  let savedReadiness = null;

  function renderWizardProgress(readiness = savedReadiness) {
    savedReadiness = readiness;
    const rings = new Map((readiness?.rings || []).map(ring => [ring.id, ring]));
    const profileTasks = rings.get('profile')?.tasks || [];
    const complete = PROFILE_STEPS.map(step => {
      if (step.ring) return Boolean(rings.get(step.ring)?.is_complete);
      const tasks = profileTasks.filter(task => step.keys.includes(task.key));
      return tasks.length === 0 || tasks.every(task => task.done);
    });

    PROFILE_STEPS.forEach((step, index) => {
      const tab = document.querySelector(`.wizard-tab[data-step="${index}"]`);
      tab.classList.toggle('complete', complete[index]);
      const state = document.getElementById(`stepState${index}`);
      state.textContent = complete[index] ? 'Complete' : index === activeStep ? 'In progress' : 'Not complete';
    });
    const completed = complete.filter(Boolean).length;
    document.getElementById('wizardDoneLabel').textContent = `${completed} of 4 sections complete`;
  }

  function showStep(index, { updateHash = true, focusHeading = false } = {}) {
    activeStep = Math.max(0, Math.min(PROFILE_STEPS.length - 1, index));
    const step = PROFILE_STEPS[activeStep];
    document.querySelectorAll('.profile-panel').forEach((panel, i) => {
      const visible = i === activeStep;
      panel.hidden = !visible;
      panel.classList.toggle('active', visible);
    });
    document.querySelectorAll('.wizard-tab').forEach((tab, i) => {
      tab.classList.toggle('active', i === activeStep);
      if (i === activeStep) tab.setAttribute('aria-current', 'step');
      else tab.removeAttribute('aria-current');
    });

    const label = document.getElementById('wizardStepLabel');
    label.textContent = `Step ${activeStep + 1} of ${PROFILE_STEPS.length} · ${step.title}`;
    const fill = document.getElementById('wizardTrackFill');
    fill.style.width = `${((activeStep + 1) / PROFILE_STEPS.length) * 100}%`;
    fill.parentElement.setAttribute('aria-valuenow', String(activeStep + 1));
    document.getElementById('wizardBack').disabled = activeStep === 0;
    document.getElementById('wizardContinue').classList.toggle('hide', activeStep === PROFILE_STEPS.length - 1);
    document.getElementById('wizardSave').classList.toggle('hide', activeStep !== PROFILE_STEPS.length - 1);
    renderWizardProgress();

    if (updateHash && window.location.hash !== `#${step.id}`) {
      history.replaceState(null, '', `#${step.id}`);
    }
    if (focusHeading) document.getElementById(`${step.id}Title`)?.focus();
  }

  function handleHash() {
    const id = window.location.hash.slice(1);
    const index = PROFILE_STEPS.findIndex(step => step.id === id);
    showStep(index >= 0 ? index : 0, { updateHash: !id });
  }

  document.querySelectorAll('.wizard-tab').forEach(tab => {
    tab.addEventListener('click', () => showStep(Number(tab.dataset.step), { focusHeading: true }));
  });
  document.getElementById('wizardBack').addEventListener('click', () => showStep(activeStep - 1, { focusHeading: true }));
  document.getElementById('wizardContinue').addEventListener('click', () => saveProfile('continue', document.getElementById('wizardContinue')));
  document.getElementById('wizardSave').addEventListener('click', () => saveProfile('stay', document.getElementById('wizardSave')));

  document.querySelector('.profile-card').addEventListener('input', () => {
    document.getElementById('saveFeedback').textContent = 'Unsaved changes';
  });

  async function saveProfile(mode = 'stay', btn) {
    await busy(btn, 'Saving…', async () => {
      try {
        const payload = {
          name: document.getElementById('fName').value.trim(),
          company: document.getElementById('fCompany').value.trim(),
          work_sector: document.getElementById('fSector').value,
          location_state: document.getElementById('fLocation').value.trim(),
          age_group: document.getElementById('fAgeGroup').value || null,
          employment: document.getElementById('fEmployment').value || null,
          preferred_research: document.getElementById('fPreferredResearch').value || null,
          gender: document.getElementById('fGender').value,
          preferred_channels: getChoices('channelGroup'),
          preferred_days: getChoices('dayGroup'),
          preferred_time_start: document.getElementById('fTimeStart').value,
          preferred_time_end: document.getElementById('fTimeEnd').value,
          products: getChoices('productGroup')
        };

        const phoneInput = document.getElementById('fPhone');
        if (!phoneInput.readOnly && !phoneInput.disabled) payload.phone = phoneInput.value.trim();
        await api.put('/users/profile', payload);
        const latest = await api.get('/users/profile');
        renderWizardProgress(latest.readiness);
        document.getElementById('saveFeedback').textContent = 'Saved';
        showToast('Profile saved');
        if (mode === 'continue' && activeStep < PROFILE_STEPS.length - 1) {
          showStep(activeStep + 1, { focusHeading: true });
        }
      } catch (err) {
        document.getElementById('saveFeedback').textContent = '';
        showToast(err.message, 'error');
      }
    });
  }

  load();
</script>
</body>
</html>
