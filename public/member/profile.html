<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Your profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    .identity-head { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-6); }
    .identity-title { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-2xl); letter-spacing: -0.03em; }
    .identity-line { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--fs-sm); color: var(--ash); margin-top: var(--sp-1); }

    /* Availability is a promise we keep: these choices gate when sessions are
       scheduled and when messages may be sent. */
    .choice-grid { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
    .choice {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-3);
      border: 1px solid var(--line);
      border-radius: var(--r-full);
      font-size: var(--fs-xs);
      color: var(--ash);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-out);
    }
    .choice:hover { border-color: var(--line-strong); color: var(--white); }
    .choice.selected { background: var(--cd-blue-dim); border-color: var(--cd-blue-40); color: var(--cd-blue); }

    .save-bar {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: flex-end;
      gap: var(--sp-3);
      padding: var(--sp-4) 0;
      background: linear-gradient(transparent, var(--surface-0) 30%);
    }
  </style>
</head>
<body>

<div class="portal">
  <div class="portal-body">

    <header class="identity-head" id="identity"></header>

    <div class="figures" id="figures"></div>

    <section class="section">
      <div class="section-head"><h2 class="section-title">About you</h2></div>
      <div class="field-row">
        <div class="field">
          <label class="label">Name</label>
          <input type="text" class="input" id="fName">
        </div>
        <div class="field">
          <label class="label">Email</label>
          <input type="email" class="input" id="fEmail" disabled>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="label">Phone</label>
          <input type="tel" class="input" id="fPhone" placeholder="+234…">
        </div>
        <div class="field">
          <label class="label">Company</label>
          <input type="text" class="input" id="fCompany">
        </div>
      </div>
      <div class="field">
        <label class="label">Work sector</label>
        <select class="input" id="fSector">
          <option value="">Not specified</option>
          <option value="Fintech">Fintech</option>
          <option value="Banking">Banking</option>
          <option value="Lending">Lending</option>
          <option value="Payments">Payments</option>
          <option value="Insurance">Insurance</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">When to reach you</h2></div>
      <p class="text-sm muted mb-4" style="max-width:54ch">
        We schedule sessions and send messages inside these windows. Outside them, anything
        due is held rather than sent.
      </p>

      <div class="field">
        <label class="label">Days that work</label>
        <div class="choice-grid" id="dayGroup"></div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="label">From</label>
          <input type="time" class="input" id="fTimeStart">
        </div>
        <div class="field">
          <label class="label">Until</label>
          <input type="time" class="input" id="fTimeEnd">
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2 class="section-title">How to reach you</h2></div>
      <p class="text-sm muted mb-4" style="max-width:54ch">
        Your preference is where we would like to reach you. Consent is your permission to do
        it at all — manage that under
        <a href="/member/notifications.html">notifications</a>.
      </p>

      <div class="field">
        <label class="label">Preferred channels</label>
        <div class="choice-grid" id="channelGroup"></div>
      </div>

      <div class="mt-6" id="consentSummary"></div>
    </section>

    <div class="save-bar">
      <button class="btn btn-primary" onclick="saveProfile()">Save changes</button>
    </div>

  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script>
  Shell.portal('profile');

  const CHANNELS = { email: 'Email', whatsapp: 'WhatsApp', sms: 'SMS', calls: 'Phone calls', in_portal: 'In-portal' };
  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function renderChoices(groupId, options, selected) {
    document.getElementById(groupId).innerHTML = Object.entries(options).map(([value, label]) => `
      <button type="button" class="choice${selected.includes(value) ? ' selected' : ''}" data-value="${value}">
        ${escapeHtml(label)}
      </button>`).join('');

    document.querySelectorAll(`#${groupId} .choice`).forEach(el => {
      el.addEventListener('click', () => el.classList.toggle('selected'));
    });
  }

  function getChoices(groupId) {
    return Array.from(document.querySelectorAll(`#${groupId} .choice.selected`)).map(el => el.dataset.value);
  }

  async function load() {
    try {
      const { user, stats, consent } = await api.get('/users/profile');

      document.getElementById('identity').innerHTML = `
        ${orbitAvatar(user.name, orbitLevel(stats.streak), 'avatar-xl' + (user.api_status === 'production' ? ' avatar-teal' : ' avatar-gold'))}
        <div>
          <div class="identity-title">${escapeHtml(user.name)}</div>
          <div class="identity-line">
            <span class="mono">${escapeHtml(user.email)}</span>
            ${badge(user.api_status, user.api_status)}
            ${user.kyb_completed ? badge('KYB done', 'active') : badge('KYB pending', 'warn')}
          </div>
        </div>`;

      document.getElementById('figures').innerHTML = `
        <div><div class="figure-value">${stats.surveys_completed}</div><div class="figure-label">Surveys answered</div></div>
        <div><div class="figure-value">${stats.gifts_claimed}</div><div class="figure-label">Rewards claimed</div></div>
        <div><div class="figure-value">${stats.streak}</div><div class="figure-label">Current streak</div></div>
        <div><div class="figure-value">${stats.best_streak}</div><div class="figure-label">Best streak</div></div>`;

      document.getElementById('fName').value = user.name || '';
      document.getElementById('fEmail').value = user.email || '';
      document.getElementById('fPhone').value = user.phone || '';
      document.getElementById('fCompany').value = user.company || '';
      document.getElementById('fSector').value = user.work_sector || '';
      document.getElementById('fTimeStart').value = user.preferred_time_start || '10:00';
      document.getElementById('fTimeEnd').value = user.preferred_time_end || '14:00';

      renderChoices('dayGroup', Object.fromEntries(DAYS.map(d => [d, d])), user.preferred_days || []);
      renderChoices('channelGroup', CHANNELS, user.preferred_channels || []);

      // A preference for a channel you have not consented to would never be
      // honoured, so say so here rather than letting it look active.
      const granted = consent.filter(c => c.status === 'granted').map(c => c.channel);
      const preferredWithoutConsent = (user.preferred_channels || []).filter(c => !granted.includes(c));

      document.getElementById('consentSummary').innerHTML = preferredWithoutConsent.length
        ? `<p class="hint" style="color:var(--cd-gold)">
             You prefer ${preferredWithoutConsent.map(c => CHANNELS[c]).join(', ')}, but have not allowed
             ${preferredWithoutConsent.length === 1 ? 'it' : 'them'} yet — so we will not use
             ${preferredWithoutConsent.length === 1 ? 'it' : 'them'}.
             <a href="/member/notifications.html">Allow now</a>.
           </p>`
        : `<p class="hint">Allowed: ${granted.length ? granted.map(c => CHANNELS[c] || c).join(', ') : 'nothing yet'}.</p>`;
    } catch (err) {
      showToast('Failed to load profile: ' + err.message, 'error');
    }
  }

  async function saveProfile() {
    try {
      await api.put('/users/profile', {
        name: document.getElementById('fName').value.trim(),
        phone: document.getElementById('fPhone').value.trim(),
        company: document.getElementById('fCompany').value.trim(),
        work_sector: document.getElementById('fSector').value,
        preferred_channels: getChoices('channelGroup'),
        preferred_days: getChoices('dayGroup'),
        preferred_time_start: document.getElementById('fTimeStart').value,
        preferred_time_end: document.getElementById('fTimeEnd').value
      });
      showToast('Profile saved');
      load();
    } catch (err) { showToast(err.message, 'error'); }
  }

  load();
</script>
</body>
</html>
