<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Circle — Surveys</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
  <style>
    .page-title-lg { font-family: var(--font-display); font-weight: var(--fw-bold); font-size: var(--fs-2xl); letter-spacing: -0.03em; }
    .lede { color: var(--ash); font-size: var(--fs-sm); margin-top: var(--sp-1); max-width: 56ch; }

    /* An open survey states its cost before you commit to it — question count
       and minutes, taken from what the author actually set. */
    .survey-open {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-4);
      padding: var(--sp-5);
      border: 1px solid var(--cd-blue-40);
      background: linear-gradient(135deg, var(--cd-blue-dim), transparent 70%), var(--surface-2);
      border-radius: var(--r-lg);
      margin-bottom: var(--sp-3);
      text-decoration: none;
    }
    .survey-open:hover { text-decoration: none; border-color: var(--cd-blue); }
    .survey-title { font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--fs-md); margin-bottom: var(--sp-1); }
    .survey-desc { font-size: var(--fs-sm); color: var(--ash); margin-bottom: var(--sp-3); }
    .survey-cost { display: flex; gap: var(--sp-3); font-size: var(--fs-xs); color: var(--ash-dim); font-family: var(--font-mono); }

    @media (max-width: 600px) {
      .page-head-block { margin-bottom: var(--sp-3) !important; }
      .page-title-lg { font-size: var(--fs-xl); }
      .lede { display: none; }
    }
  </style>
</head>
<body>

<div class="portal">
  <div class="portal-body">

    <nav class="breadcrumb mb-3">
      <a href="/member/dashboard.html">Home</a>
      <span class="sep mobile-current">/</span>
      <span class="current mobile-current">Surveys</span>
    </nav>

    <header class="page-head-block mb-6">
      <h1 class="page-title-lg hide-on-mobile">Surveys</h1>
      <p class="lede">
        Short, specific questions from the team building the APIs you integrate with.
        We tell you how long each one takes before you start, and we mean it.
      </p>
    </header>

    <div class="figures" id="figures">
      <div><div class="skeleton" style="height:30px;width:60%;margin-bottom:6px"></div><div class="skeleton" style="height:12px;width:90%"></div></div>
      <div><div class="skeleton" style="height:30px;width:60%;margin-bottom:6px"></div><div class="skeleton" style="height:12px;width:90%"></div></div>
      <div><div class="skeleton" style="height:30px;width:60%;margin-bottom:6px"></div><div class="skeleton" style="height:12px;width:90%"></div></div>
    </div>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Open for you</h2>
        <span class="dim text-xs" id="openCount"></span>
      </div>
      <div id="open">
        <div class="skeleton" style="height:110px;width:100%;border-radius:var(--r-lg);margin-bottom:var(--sp-3)"></div>
        <div class="skeleton" style="height:110px;width:100%;border-radius:var(--r-lg)"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Already answered</h2>
      </div>
      <div id="done">
        <div class="skeleton" style="height:52px;width:100%;border-radius:var(--r-lg)"></div>
        <div class="skeleton" style="height:52px;width:100%;border-radius:var(--r-lg);margin-top:var(--sp-2)"></div>
      </div>
    </section>

  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/survey-theme.js"></script>
<script src="/assets/js/brand.js"></script>
<script>
  Shell.portal('surveys');

  const MODES = {
    in_portal: 'Here in Dev Circle',
    email: 'Sent by email',
    whatsapp: 'Over WhatsApp',
    '1-on-1': 'A 1-on-1 conversation'
  };

  async function load() {
    try {
      const [{ surveys }, { stats }] = await Promise.all([
        api.get('/users/surveys'),
        api.get('/users/profile')
      ]);

      const open = surveys.filter(s => !s.completed);
      const done = surveys.filter(s => s.completed);

      document.getElementById('figures').innerHTML = `
        <div><div class="figure-value">${stats.surveys_completed}</div><div class="figure-label">Answered</div></div>
        <div><div class="figure-value">${open.length}</div><div class="figure-label">Waiting for you</div></div>
        <div><div class="figure-value">${stats.streak}</div><div class="figure-label">Day streak</div></div>`;

      document.getElementById('openCount').textContent =
        open.length ? `${open.reduce((n, s) => n + s.time_estimate_min, 0)} min in total` : '';

      document.getElementById('open').innerHTML = open.length
        ? open.map(s => `
          <a class="survey-open" href="/member/survey.html?id=${s.id}">
            <div style="flex:1;min-width:0">
              <div class="survey-title">${escapeHtml(s.title)}</div>
              ${s.description ? `<div class="survey-desc">${escapeHtml(s.description)}</div>` : ''}
              <div class="survey-cost">
                <span>~${s.time_estimate_min} min</span>
                <span>${s.question_count} question${s.question_count === 1 ? '' : 's'}</span>
                <span>${escapeHtml(MODES[s.engagement_mode] || s.engagement_mode)}</span>
              </div>
            </div>
            <span class="btn btn-sm btn-primary">Start ${icon('arrowRight', 14)}</span>
          </a>`).join('')
        : emptyState({
            title: 'Nothing to answer right now',
            text: stats.surveys_completed
              ? 'You are caught up. We will let you know when the next one is ready — on the channels you allowed, in the hours you chose.'
              : 'When the team has a question for you, it will appear here first.'
          });

      // A completed survey stays listed: it is part of the record the member
      // is entitled to see, not something that disappears once submitted.
      document.getElementById('done').innerHTML = done.length
        ? done.map(s => `
          <div class="row-item">
            <div style="flex:1;min-width:0">
              <div class="row-item-title">${escapeHtml(s.title)}</div>
              <div class="row-item-meta">${s.question_count} question${s.question_count === 1 ? '' : 's'} · ${escapeHtml(MODES[s.engagement_mode] || s.engagement_mode)}</div>
            </div>
            ${badge('answered', 'active')}
          </div>`).join('')
        : '<p class="dim text-sm">Nothing answered yet.</p>';
    } catch (err) {
      showToast('Failed to load surveys: ' + err.message, 'error');
    }
  }

  load();
</script>
</body>
</html>
