name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, plus current LTS
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # The suite runs against a throwaway database; this secret only has
          # to exist and be stable within the run.
          DEV_HUB_SSO_SECRET: ci-test-secret

      - name: Check migrations apply cleanly to an empty database
        run: npm run migrate:status
        env:
          DEVCIRCLE_DB_PATH: ${{ runner.temp }}/ci-check.db
          DEV_HUB_SSO_SECRET: ci-test-secret

      - name: Check the server boots
        run: |
          node src/server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server is up"
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not become healthy in time"
          kill $SERVER_PID 2>/dev/null
          exit 1
        env:
          DEVCIRCLE_DB_PATH: ${{ runner.temp }}/ci-boot.db
          DEV_HUB_SSO_SECRET: ci-test-secret
